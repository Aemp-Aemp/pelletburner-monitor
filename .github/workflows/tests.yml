# Runs the tests on every push and pull request. The browser tests (Playwright) are skipped here.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyserial==3.5 segno==1.6.1
      - name: Tests (no browser)
        run: python scada/run_tests.py --no-browser
