  }
  const labels=ch.labels||[], S=ch.series||[], n=labels.length; if(!n){ placeholder(cv,t("disc_none"),""); return; }

  const lstep=Math.max(1,Math.ceil((Math.max(...labels.map(l=>c.measureText(String(l)).width))+6)/gw));

  c.textAlign="left";
  leg.forEach(([lx,ly,s,k,nm])=>{ const col=s.state!=null?(stateCol[s.state]||pal[k%pal.length]):pal[k%pal.length]; c.fillStyle=col; c.fillRect(lx,ly-8,10,8); c.fillStyle="#8b949e";

}

    if(si===0){ for(let g=0;g<=4;g++){const y=y1-(y1-y0)*g/4; c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke(); c.fillText(fmt(st*g,axisDec(st)),2,y+3);} }
    else { c.textAlign="right"; for(let g=0;g<=4;g+=2){const y=y1-(y1-y0)*g/4; c.fillText(fmt(st*g,axisDec(st*2)),W-2,y+3);} c.textAlign="left"; }
    c.fillStyle=s.color;
    s.data.forEach((v,i)=>{ const h=(y1-y0)*(v||0)/mx; c.fillRect(x0+i*gw+bw*(si+0.5),y1-h,bw*0.9,h); });
    c.fillStyle="#5a6472";
  });
  const step=Math.ceil(n/12);
  labels.forEach((l,i)=>{ if(i%step===0) c.fillText(l,x0+i*gw+2,H-5); });
}

const BATCH_COLORS=["#39d0d8","#ff8f40","#d2a8ff","#7ee787","#58a6ff","#f2cc60","#ff7b72","#a5d6ff"];
function batchColor(name, batches){
  const i=batches.findIndex(b=>b.name===name);
  return i<0 ? "#8b949e" : BATCH_COLORS[i % BATCH_COLORS.length];
}
// scatter: pts=[{x,y,color,shape:'dot'|'x'|'ring'}]; xTicks(v)->label
function scatter(canvas, pts, xLabel, yLabel, xTick){
  const {c,W,H}=setupCanvas(canvas);
  const padL=38,padR=12,padT=10,padB=26, x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  if(!pts.length) return;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let xmn=Math.min(...xs), xmx=Math.max(...xs); if(xmn===xmx){xmn-=1;xmx+=1;}
  if(!xTick) [xmn,xmx]=niceAxis(xmn,xmx,false);                                // plain numbers (°C): round steps 20/30/40...
  const [,ymx,yst]=niceAxis(0,Math.max(1,...ys)*1.05,true);                     // round steps (shared helper)
  const X=v=>x0+(x1-x0)*(v-xmn)/(xmx-xmn), Y=v=>y1-(y1-y0)*v/ymx;
  c.strokeStyle="#222a36"; c.fillStyle="#5a6472"; c.font="10px Segoe UI"; c.lineWidth=1;
  for(let g=0;g<=4;g++){const v=yst*g,y=Y(v); c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke(); c.fillText(fmt(v,axisDec(yst)),4,y+3);}
  let lastTick=null;                                                           // the same label (a date) is written once
  for(let g=0;g<=4;g++){const v=xmn+(xmx-xmn)*g/4, lb=xTick?xTick(v):v.toFixed(0); if(lb!==lastTick) c.fillText(lb, X(v)-12, H-12); lastTick=lb;}
  c.fillText(yLabel,x0+4,y0+10); c.textAlign="right"; c.fillText(xLabel,x1,H-2); c.textAlign="left";
  pts.forEach(p=>{
    const px=X(p.x), py=Y(p.y); c.strokeStyle=p.color; c.fillStyle=p.color; c.lineWidth=2;
    if(p.shape==="x"){ c.beginPath(); c.moveTo(px-5,py-5);c.lineTo(px+5,py+5);c.moveTo(px+5,py-5);c.lineTo(px-5,py+5); c.stroke(); }
    else if(p.shape==="ring"){ c.beginPath(); c.arc(px,py,4.5,0,Math.PI*2); c.stroke(); }
    else { c.beginPath(); c.arc(px,py,4.5,0,Math.PI*2); c.fill(); }
  });
}

let lastIgR=null;   // kept so the table can be drawn again once the 'Started by' names arrive with the first status poll
function renderIgnitions(r){
  lastIgR=r;
  const recs=(r.records||[]), batches=r.batches||[];
  const lh=document.getElementById("lightHelp");            // "Trouble lighting?" (read only; nothing is sent to the boiler)
  lh.style.display=r.help?"":"none";
  lh.innerHTML=r.help?lhHTML(r.help,{warn:"var(--warn)",dim:"var(--dim)",line:"var(--edge)"},"guide#trouble-after-upgrade"):"";
  document.getElementById("igBatchNow").textContent=t("ig_batch_now",{b:r.current_batch||"—"});
  const leg=document.getElementById("igLegend");
  const names=[...new Set(recs.map(x=>x.batch))];
  // Time to flame = minutes from the start of lighting until the flame is strong enough: the server works it out
  // (flame_min per start, the typical value per batch in stats). A start that failed or was stopped: how long it lasted.
  const fm=x=>x.flame_min!=null?+x.flame_min:(x.result!=="ok"&&x.minutes!=null?+x.minutes:null);
  leg.innerHTML=names.map(n=>{ const m=((r.stats||{})[n]||{}).flame_min;
      return `<span><span class="sw" style="background:${batchColor(n,batches)};height:8px;width:8px;border-radius:50%"></span>${esc(!n||n==="—"?t(names.some(b=>b&&b!=="—")?"ig_before_batch":"ig_no_batch"):n)}${m!=null&&m>=1?" · "+fmt(m,1)+" min":""}</span>`;}).join("")
    +`<span style="color:var(--bad)">✕ ${esc(t("lg_failed"))}</span><span>○ ${esc(t("lg_stopped"))}</span>`;
  const cv=document.getElementById("cIgn"), cv2=document.getElementById("cIgnCold");
  if(!recs.length){ placeholder(cv,t("ig_none"),""); placeholder(cv2,t("ig_none"),""); }
  else{
    scatter(cv, recs.filter(x=>fm(x)!=null).map(x=>({x:x.epoch, y:fm(x), color:x.result==="failed"?getCss("--bad"):batchColor(x.batch,batches),
        shape:x.result==="ok"?"dot":(x.result==="failed"?"x":"ring")})), "", "min",
        v=>new Date(v*1000).toLocaleDateString(LOC(), {day:"2-digit",month:"2-digit"}));
    const ok=recs.filter(x=>x.result==="ok" && x.boiler!=null && fm(x)!=null);
    if(ok.length) scatter(cv2, ok.map(x=>({x:x.boiler, y:fm(x), color:batchColor(x.batch,batches), shape:"dot"})), "°C", "min");
    else placeholder(cv2,t("ig_none"),"");
  }
  const H=["th_when","th_result","started_by","th_min","th_boiler0","th_off","th_feed","th_rpm","th_peak","th_batch"];
  document.getElementById("igTable").innerHTML=`<tr>${H.map(h=>`<th>${t(h)}</th>`).join("")}</tr>`+
    recs.slice(-15).reverse().map(x=>`<tr><td>${dmy(x.epoch)}</td>`+
      `<td style="color:${x.result==="ok"?"var(--ok)":(x.result==="failed"?"var(--bad)":"var(--dim)")}">${esc(t("ig_"+x.result))}${x.alarm?" ("+x.alarm+")":""}</td><td>${esc(srcText(x))}</td>`+
      `<td>${fmt(x.minutes,1)}</td><td>${fmt(x.boiler,1)}</td><td>${fmt(x.off_h,1)}</td><td>${x.auger_s??"—"}</td>`+
      `<td>${x.rpm_min!=null?x.rpm_min+"–"+x.rpm_max:"—"}</td><td>${fmt(x.peak_lux,0)}</td><td>${esc(x.batch)}</td></tr>`).join("");
  const S=r.by_settings||[];
  // the program's short setting names -> plain words (EN/DA), e.g. "start fuel s 60" -> "Start pellets 60 s"
  function igSetTxt(txt){
    const M=[["dose interval s",t("ig_dose_int"),"s"],["dose s",t("ig_dose"),"s"],
      ["max doses",t("ig_max_doses"),""],["start fuel s",t("ig_start_fuel"),"s"],
      ["ign. air %",t("ig_ign_air"),"%"],["warm-up s",t("ig_warmup"),"s"],["timeout s",t("ig_timeout"),"s"]];
    let out=String(txt||"");
    M.forEach(([k,lbl,u])=>{ out=out.replace(new RegExp(k.replace(/[.%]/g,"\\$&")+"\\s+([0-9.,]+)","g"),(m,v)=>lbl+" "+v+(u?" "+u:"")); });
    return out; }
  document.getElementById("igSettings").innerHTML=`<tr><th>${t("th_set")}</th><th>${t("th_tries")}</th><th>${t("th_okn")}</th><th>${t("th_med")}</th></tr>`+
    (S.length?S.map(s=>`<tr><td>${esc(igSetTxt(s.settings))}</td><td>${s.n}</td><td>${s.ok}</td><td>${fmt(s.median_min,1)}</td></tr>`).join("")
     :`<tr><td colspan="4" class="note">—</td></tr>`);
}

    (L.length?L.map(l=>`<tr><td>${l.pct}</td><td>${l.n}</td><td>${fmt(l.baseline_rpm,0)}</td><td>${fmt(l.now_rpm,0)}</td>`+
      `<td>${fmt(l.change_pct,1)}</td><td>${l.jitter_base!=null?fmt(l.jitter_base,1)+" → "+fmt(l.jitter_now,1):"—"}</td></tr>`).join("")
     :`<tr><td colspan="6" class="note">—</td></tr>`);

  chart(cv,[{data:s.map(x=>x.pct?x.rpm/x.pct:null),color:getCss("--fan")}]);
}
