<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pellet burner</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --edge:#2b3443;
    --ink:#e6edf3; --dim:#8b949e; --faint:#5a6472;
    --accent:#39d0d8; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --boiler:#ff8f40; --flue:#f05d5e; --power:#39d0d8; --fan:#58a6ff;
    --flame:#d2a8ff; --set:#7ee787;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.4 "Segoe UI",system-ui,Roboto,Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 16px 40px}
  /* top bar */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 14px;background:var(--panel);border:1px solid var(--edge);
    border-radius:10px;position:sticky;top:8px;z-index:20}
  .brand{font-weight:700;font-size:17px;letter-spacing:.3px}
  .brand small{color:var(--dim);font-weight:400;font-size:12px}
  .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim)}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--faint);
    box-shadow:0 0 0 0 rgba(0,0,0,0)}
  .dot.live{background:var(--ok);animation:pulse 2s infinite}
  .dot.demo{background:var(--warn)}
  .dot.stale{background:var(--bad)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .statebadge{font-weight:700;font-size:15px;padding:6px 14px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--edge);white-space:nowrap}
  select,button{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);
    border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer}
  .lang{display:inline-flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden}
  .lang button{border:0;border-radius:0;padding:5px 10px;background:var(--panel2);color:var(--dim);font-weight:600}
  .lang button.on{background:var(--accent);color:#06281f}
  /* alarm banner */
  .alarm{margin-top:12px;padding:12px 16px;border-radius:10px;font-weight:600;
    display:none;align-items:center;gap:12px}
  .alarm.on{display:flex;background:rgba(248,81,73,.14);border:1px solid var(--bad);color:#ffb3ae}
  .alarm .code{font-size:22px;font-weight:800;color:var(--bad)}
  .alarm .hint{font-weight:400;color:var(--dim);margin-left:auto;text-align:right;max-width:46%}
  .alarm.nodata.on{display:flex;background:rgba(210,153,34,.14);border:1px solid var(--warn);color:#f0d38a}
  .alarm.nodata .code{color:var(--warn)}
  /* grid */
  .grid{display:grid;gap:12px;margin-top:12px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cols{grid-template-columns:1.35fr 1fr}
  .cols>*{min-width:0}
  @media(max-width:1040px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);font-weight:600}
  /* stat tiles */
  .tile .lab{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
  .tile .val{font-size:26px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile .val .u{font-size:13px;color:var(--dim);font-weight:500;margin-left:3px}
  .tile .sub{font-size:12px;color:var(--faint);margin-top:2px;min-height:15px}
  .tile .val.warn{color:var(--warn)} .tile .val.bad{color:var(--bad)} .tile .val.ok{color:var(--ok)}
  .io{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:middle}
  .io.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .io.onamber{background:var(--warn);box-shadow:0 0 7px var(--warn)}
  /* charts */
  canvas{width:100%;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:6px}
  .legend b{font-weight:600}
  .sw{display:inline-block;width:11px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  /* advisories */
  .adv{display:flex;flex-direction:column;gap:8px}
  .adv .row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--faint)}
  .adv .row.ok{border-left-color:var(--ok)} .adv .row.warn{border-left-color:var(--warn)} .adv .row.bad{border-left-color:var(--bad)}
  .adv .ic{font-size:15px;line-height:1.1} .adv .tx{flex:1}
  .adv .tx b{display:block;font-size:13px} .adv .tx span{color:var(--dim);font-size:12px}
  /* pid decomposition bar */
  .pbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--panel2);
    margin-top:14px;border:1px solid var(--edge)}
  .pbar span{display:block;height:100%;transition:width .3s}
  #pbar_p{background:var(--accent)} #pbar_i{background:#2d6fb0}
  .pbar-key{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:5px}
  /* event log */
  .log{max-height:230px;overflow:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
  .log .e{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--panel2)}
  .log .e .tm{color:var(--faint);white-space:nowrap}
  .log .e .ms{flex:1}
  .log .e.alarm .ms{color:#ffb3ae} .log .e.state .ms{color:var(--set)}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch} .tshint{margin-top:4px}
  /* tabs */
  .tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .tab{flex:none;white-space:nowrap}   /* phones: the tab bar scrolls sideways instead of widening the page */
  .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    padding:9px 16px;color:var(--dim);font-weight:600;font-size:13.5px}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  /* sequences tab */
  .seqnote{color:var(--faint);font-size:12px;margin:14px 0 4px;line-height:1.5}
  .seqcard{background:var(--panel);border:1px solid var(--edge);border-radius:10px;
    padding:12px 14px;margin-top:12px}
  .seqcard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .seqhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .seqhead .nm{font-weight:700;font-size:14px}
  .seqhead .loc{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);
    background:var(--panel2);border:1px solid var(--edge);padding:2px 8px;border-radius:6px}
  .seqhead .st{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.5px;
    padding:3px 10px;border-radius:12px;background:var(--panel2);color:var(--faint);border:1px solid var(--edge)}
  .seqhead .st.go{background:rgba(57,208,216,.16);color:var(--accent);border-color:var(--accent)}
  .seqflow{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px}
  .step{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--edge);
    border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.35}
  .seqcard.active .step{border-color:#3a5560}
  .seqcard.active .step.cur{border-color:var(--accent);background:rgba(57,208,216,.16);box-shadow:0 0 0 1px var(--accent) inset;font-weight:600}
  .seqcard.active .step.cur .n{background:var(--accent);color:#06281f}
  .step .n{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
    border-radius:50%;background:var(--edge);color:var(--ink);font-size:10px;font-weight:700;margin-right:6px}
  .arrow{align-self:center;color:var(--faint);font-size:15px;padding:0 1px}
  @media (max-width:600px){.arrow{display:none}} /* steps wrap on phones; a lone arrow at a row end points at nothing - the step numbers show the order */
  .seqexits{display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .seqexits .x{font-size:12px;padding:5px 9px;border-radius:7px;border-left:3px solid var(--faint)}
  .seqexits .x.ok{background:rgba(63,185,80,.10);border-left-color:var(--ok);color:#9fe0ab}
  .seqexits .x.fail{background:rgba(210,153,34,.10);border-left-color:var(--warn);color:#e8c57a}
  .seqbar{height:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--edge);
    overflow:hidden;margin-top:11px}
  .seqbar span{display:block;height:100%;background:var(--accent);transition:width .4s}
  .seqbar span.warn{background:var(--warn)} .seqbar span.bad{background:var(--bad)}
  .seqtmr{font-size:11.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
  .trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
  .trip{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;background:var(--panel2);border:1px solid var(--edge);
    border-radius:8px;padding:8px 10px}
  .trip .tdot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
  .trip .tdot.ok{background:var(--ok)} .trip .tdot.warn{background:var(--warn)} .trip .tdot.bad{background:var(--bad);box-shadow:0 0 7px var(--bad)}
  .trip .tx{flex:1 1 130px;min-width:0}
  .trip .tx b{display:block;font-size:12.5px;font-weight:600}
  .trip .tx span{color:var(--dim);font-size:11px}
  .trip .tv{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap;margin-left:auto}
  .foot{color:var(--faint);font-size:12px;margin-top:16px;text-align:center}
  #foot2{font-size:10px;line-height:1.4;margin-top:6px;opacity:.85}
  /* schedule + optimiser tabs */
  .note{color:var(--faint);font-size:12px;margin-top:8px;line-height:1.45}
  .schtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .schstat{color:var(--dim);font-size:12.5px;margin-top:2px}
  .schfs{border:0;padding:0;margin:0;min-width:0;transition:opacity .2s}
  .schfs:disabled{opacity:.42}
  .schfs:disabled *{cursor:not-allowed}
  button.primary{background:var(--accent);color:#06281f;border-color:var(--accent);font-weight:700}
  button.danger{border-color:var(--bad);color:#ffb3ae}
  button:disabled{opacity:.5;cursor:not-allowed}
  .savemsg{font-size:12.5px;color:var(--dim)}
  .savemsg.ok{color:var(--ok)} .savemsg.bad{color:var(--bad)}
  input[type=number],input[type=time],input.dec{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);
    border-radius:7px;padding:5px 8px;font-size:13px;font-family:inherit;color-scheme:dark}
  input[type=number],input.dec{width:84px}
  .form{display:flex;flex-direction:column;gap:9px}
  .form label{display:flex;align-items:center;gap:8px;font-size:13px}
  .form label>span:first-child{flex:1;color:var(--dim)}
  .form label.chk>span{flex:1;color:var(--ink)}
  @media (max-width:560px){ .form label.wrapl{flex-wrap:wrap} .form label.wrapl>span:first-child{flex-basis:100%} }   /* phones: long label above its field */
  .form i{color:var(--faint);font-style:normal;width:22px}
  .win{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--panel2)}
  .days{display:inline-flex;border:1px solid var(--edge);border-radius:7px;overflow:hidden}
  .days button{border:0;border-radius:0;padding:5px 7px;font-size:12px;color:var(--faint);background:var(--panel2);min-width:30px}
  .days button.on{background:rgba(57,208,216,.22);color:var(--ink)}
  .win .x{margin-left:auto}
  .sw-toggle{position:relative;display:inline-block;width:46px;height:26px;flex:none}
  .sw-toggle input{opacity:0;width:0;height:0}
  .sw-toggle span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--edge);border-radius:13px;cursor:pointer;transition:.2s}
  .sw-toggle span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--dim);border-radius:50%;transition:.2s}
  .sw-toggle input:checked+span{background:rgba(63,185,80,.3);border-color:var(--ok)}
  .sw-toggle input:checked+span:before{transform:translateX(20px);background:var(--ok)}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tbl th{color:var(--dim);font-weight:600;text-align:right;padding:5px 8px;border-bottom:1px solid var(--edge);white-space:nowrap}
  .tbl td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--panel2)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  #fanTable th{white-space:normal;vertical-align:bottom}   /* long titles ("Ujævnhed % (normal → nu)") wrap instead of being cut */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px 20px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .modal .mtext{white-space:pre-line;font-size:13.5px;line-height:1.5}
  .modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .beta{font-size:10px;font-weight:700;letter-spacing:.5px;color:#06281f;background:var(--warn);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:2px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span id="t_brand">Pellet burner</span> <small id="t_subtitle"></small></div>
    <div class="statebadge" id="stateBadge">—</div>
    <div class="spacer"></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText"></span></div>
    <label class="conn" style="gap:5px"><span id="t_poll"></span>
      <select id="pollSel">
        <option value="2000">2 s</option>
        <option value="5000">5 s</option>
        <option value="10000" selected>10 s</option>
        <option value="30000">30 s</option>
      </select>
    </label>
    <span class="lang" id="langSel"><button data-l="en">EN</button><button data-l="da">DA</button></span>
    <button id="demoBtn">Demo</button>
    <!-- layout-switch (temporary): try the new layout side by side; remove when one is chosen -->
    <a href="home" id="layoutSwitch" style="margin-left:6px;padding:5px 10px;border:1px solid var(--warn);border-radius:7px;color:var(--warn);text-decoration:none;font-size:12px">New layout →</a>
  </header>

  <div class="alarm nodata" id="noDataBar">
    <span class="code">⚠</span><span id="noDataTitle"></span><span class="hint" id="noDataText"></span>
  </div>
  <div class="alarm" id="alarmBar">
    <span class="code" id="alarmCode">!</span>
    <span id="alarmText">—</span>
    <span class="hint" id="alarmHint"></span>
  </div>

  <nav class="tabs">
    <button class="tab on" data-tab="live" id="t_tab_live"></button>
    <button class="tab" data-tab="seq" id="t_tab_seq"></button>
    <button class="tab" data-tab="sch" id="t_tab_sch"></button>
    <button class="tab" data-tab="opt" id="t_tab_opt"></button>
    <button class="tab" data-tab="disc" id="t_tab_disc"></button>
  </nav>

  <div id="tab-live">
  <!-- stat tiles -->
  <div class="grid tiles" id="tiles"></div>

  <!-- state machine + advisories -->
  <div class="grid cols">
    <div class="card" style="min-width:0">
      <h3 id="t_h_fsm"></h3>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><svg id="fsm" viewBox="0 0 900 360" style="width:100%;min-width:600px;height:auto;display:block"></svg></div>
    </div>
    <div class="card">
      <h3 id="t_h_adv"></h3>
      <div class="adv" id="adv"></div>
    </div>
  </div>

  <!-- transitions + pre-alarm snapshot (from the responder's Tracker, survives page reloads/restarts) -->
  <div class="grid cols">
    <div class="card">
      <h3 id="t_h_trans"></h3>
      <div class="log" id="transLog"></div>
    </div>
    <div class="card">
      <h3 id="t_h_pre"></h3>
      <div id="preInfo" style="font-size:13px;margin-bottom:6px"></div>
      <div class="legend">
        <span><span class="sw" style="background:var(--boiler)"></span><span id="t_lg_boiler2"></span></span>
        <span><span class="sw" style="background:var(--power)"></span><span id="t_lg_power2"></span></span>
        <span><span class="sw" style="background:var(--fan)"></span><span id="t_lg_fanpct2"></span></span>
      </div>
      <canvas id="cPre" height="120"></canvas>
      <div id="sysInfo" style="color:var(--faint);font-size:11.5px;margin-top:10px"></div>
    </div>
  </div>

  <!-- trends -->
  <div class="grid cols">
    <div class="card">
      <h3 id="t_h_temps"></h3>
      <div class="legend">
        <span><span class="sw" style="background:var(--boiler)"></span><span id="t_lg_boiler"></span></span>
        <span><span class="sw" style="background:var(--set)"></span><span id="t_lg_setpoint"></span></span>
        <span><span class="sw" style="background:var(--flue)"></span><span id="t_lg_flue"></span></span>
      </div>
      <canvas id="cTemp" height="150"></canvas>
    </div>
    <div class="card">
      <h3 id="t_h_powfan"></h3>
      <div class="legend">
        <span><span class="sw" style="background:var(--power)"></span><span id="t_lg_power"></span></span>
        <span><span class="sw" style="background:var(--fan)"></span><span id="t_lg_fanpct"></span></span>
        <span><span class="sw" style="background:#2d6fb0"></span><span id="t_lg_fanrpm"></span></span>
      </div>
      <canvas id="cPow" height="150"></canvas>
    </div>
  </div>
  <div class="grid cols">
    <div class="card">
      <h3 id="t_h_pid"></h3>
      <div class="legend">
        <span><span class="sw" style="background:var(--warn)"></span><span id="t_lg_piderr"></span></span>
        <span><span class="sw" style="background:var(--power)"></span><span id="t_lg_pidpow"></span></span>
      </div>
      <canvas id="cPid" height="150"></canvas>
    </div>
    <div class="card">
      <h3 id="t_h_decomp"></h3>
      <div class="grid tiles" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="tile"><div class="lab" id="t_lb_err"></div><div class="val" id="v_err">—</div><div class="sub" id="t_sb_err"></div></div>
        <div class="tile"><div class="lab" id="t_lb_out"></div><div class="val" id="v_out">—</div><div class="sub" id="t_sb_out"></div></div>
        <div class="tile"><div class="lab" id="t_lb_pterm"></div><div class="val" id="v_pterm">—</div><div class="sub" id="t_sb_pterm"></div></div>
        <div class="tile"><div class="lab" id="t_lb_iterm"></div><div class="val" id="v_iterm">—</div><div class="sub" id="t_sb_iterm"></div></div>
      </div>
      <div class="pbar" id="pbar"><span id="pbar_p"></span><span id="pbar_i"></span></div>
      <div class="pbar-key"><span><span class="sw" style="background:var(--accent)"></span><span id="t_pk_p"></span></span><span><span class="sw" style="background:#2d6fb0"></span><span id="t_pk_i"></span></span></div>
      <div id="pidStatus" style="margin-top:9px;font-size:13px"></div>
      <div id="pidGains" style="color:var(--faint);font-size:11.5px;margin-top:8px"></div>
    </div>
  </div>
  <div class="grid cols">
    <div class="card">
      <h3 id="t_h_comb"></h3>
      <div class="legend">
        <span><span class="sw" style="background:var(--flue);border-radius:50%;width:8px;height:8px"></span><span id="t_lg_oppts"></span></span>
        <span><span class="sw" style="background:#7ee787"></span><span id="t_lg_baseline"></span></span>
      </div>
      <canvas id="cEff" height="160"></canvas>
      <div id="t_comb_note" style="color:var(--faint);font-size:11.5px;margin-top:6px"></div>
    </div>
    <div class="card">
      <h3 id="t_h_eff"></h3>
      <div class="grid tiles" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="tile"><div class="lab" id="t_lb_kgph"></div><div class="val" id="v_kgph">—</div><div class="sub" id="t_sb_kgph"></div></div>
        <div class="tile"><div class="lab" id="t_lb_kgses"></div><div class="val" id="v_kgses">—</div><div class="sub" id="t_sb_kgses"></div></div>
        <div class="tile"><div class="lab" id="t_lb_kw"></div><div class="val" id="v_kw">—</div><div class="sub" id="s_kw"></div></div>
        <div class="tile"><div class="lab" id="t_lb_fdelta"></div><div class="val" id="v_fdelta">—</div><div class="sub" id="s_fdelta"></div></div>
      </div>

// a number as display text with d decimals (decimal comma in Danish); "—" when there is none
const fmt=(v,d)=>{ if(v==null||isNaN(v)) return "—"; const s=Number(v).toFixed(d).replace(/^-(0(\.0+)?)$/,"$1"); return LANG==="da"?s.replace(".",","):s; };

const median=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };

const clock=(ep,sec)=>{ if(!ep) return "—"; const d=new Date(ep*1000), p=n=>String(n).padStart(2,"0");

const niceStep=v=>{ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; };

const niceAxis=(lo,hi,pos)=>{ if(pos) lo=0; if(hi-lo<1e-9){ lo-=1; hi+=1; } let st=niceStep((hi-lo)/4), a=0;
  for(let k=0;k<20;k++){ a=Math.floor(lo/st)*st; if(pos&&a<0) a=0; if(a+4*st>=hi) break; st=niceStep(st*1.01); } return [a,a+4*st,st]; };

function lhReport(h,ver){
  const p=n=>String(n).padStart(2,"0"), when=e=>{ const d=new Date(e*1000); return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes()); };
  const L=[lhT("r_title",{v:ver||"?"}), lhBoiler(h), lhVerdict(h), "", lhT("r_set")];
  (h.rows||[]).forEach(r=>L.push("- "+lhT("n_"+r.id)+": "+lhVal(r.id,r.now)+" / "+lhVal(r.id,r.fac)+(r.mark==="unused"?"  ("+lhT("m_unused")+")":r.mark&&r.mark!=="diff"?"  !":r.mark?"  *":"")));
  if((h.rows||[]).some(r=>r.mark&&r.mark!=="unused")) L.push(lhT("r_marks"));
  L.push(lhT("r_blind"));
  if(!(h.sw&&h.sw_known!==false)) L.push(lhT("sw_note"));
  L.push("");
  const st=h.starts||[];
  L.push(st.length?lhT("r_starts",{n:st.length}):lhT("r_none"));
  st.forEach((s,i)=>{ const res=s.result==="ok"?(s.flame_min!=null?lhT("r_lit",{a:fmt(s.flame_min,1)}):lhT("r_lit0")):
      s.result==="failed"?(s.alarm?lhT("r_fail_a",{a:s.alarm}):lhT("r_fail")):lhT("r_stop");
    L.push((i+1)+". "+(s.epoch?when(s.epoch)+"  ":"")+res+(s.start_fuel!=null&&s.max_doses!=null?"  ("+lhT("r_cfg",{a:s.start_fuel,b:s.max_doses})+")":"")); });
  return L.join("\n");
}
// copy text; the pages are plain http on the home network, so there is a fallback for browsers without clipboard access
function lhCopy(txt,btn){
  const done=()=>{ if(!btn) return; btn.textContent=lhT("copied"); setTimeout(()=>{ btn.textContent=lhT("copy"); },2000); };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(txt).then(done).catch(()=>{}); return; }
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ if(document.execCommand("copy")) done(); }catch(e){} ta.remove();
}

// Reads the state and draws it (the page's updDraw). While the updater works it asks again every 3 s; the monitor
// restarts in the middle of an update, so a failed read keeps the last state and tries again.
async function updLoad(){ clearTimeout(UPD_TIMER);
  let ok=true;
  try{ const {j}=await api("api/update"); UPD=j&&j.current&&j.view?j:null; }catch(e){ ok=false; }
  if(ok){ const v=UPD&&UPD.view, busy=!!(v&&v.busy);
    // the version changed under the page: load the page of the version that runs now (it shows the same result)
    // also right after a press (UPD_WATCH): the updater may pick the request up a moment after the first read
    const watching=Date.now()<UPD_WATCH;
    if(!busy&&v&&["updated","rolled_back","went_back"].includes(v.key)&&(UPD_BUSY||(watching&&v.key!==UPD_KEY0))){
      UPD_WATCH=0; setTimeout(()=>location.reload(),4000); }
    UPD_BUSY=busy; }
  updDraw();
  if(UPD_BUSY||Date.now()<UPD_WATCH) UPD_TIMER=setTimeout(updLoad,3000); }
// a button was pressed: what = check / retry / back. Only that word is sent. -> true when the Pi took the request
async function updAsk(what){ let ok=false;
  UPD_KEY0=UPD&&UPD.view?UPD.view.key:null; UPD_WATCH=Date.now()+120000;   // keep reading for 2 min after a press
  try{ ok=(await api("api/update/"+what,{})).ok; }catch(e){}
  await updLoad(); return ok; }

// ---- canvas setup (fixes the DPR height-compounding bug: the design height is captured ONCE in
//      dataset.h and the CSS height is pinned, so re-draws never re-scale an already-scaled canvas) ----
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio||1, c=canvas.getContext("2d");
  const H = canvas.dataset.h ? +canvas.dataset.h : ((canvas.getAttribute("height")|0) || 160);
  canvas.dataset.h = H;
  const W = canvas.clientWidth || 600;
  canvas.style.height = H+"px";
  canvas.width = W*dpr; canvas.height = H*dpr;
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  return {c,W,H,dpr};
}
// ---- tiny line chart ----
function chart(canvas, series, opts){
  const {c,W,H}=setupCanvas(canvas);
  const padL=40,padR=opts&&opts.padR||40,padT=10,padB=18;
  const x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  const all=[]; series.forEach(s=>s.data.forEach(v=>{if(v!=null&&!isNaN(v))all.push(v)}));
  let mn = opts&&opts.min!=null?opts.min:(all.length?Math.min(...all):0);
  let mx = opts&&opts.max!=null?opts.max:(all.length?Math.max(...all):1);
  if(mn===mx){mx=mn+1;}
  if(!(opts&&opts.min!=null&&opts.max!=null)){ const [a,b]=niceAxis(mn,mx,false);      // round steps (shared helper)
    if(!(opts&&opts.min!=null)) mn=a; if(!(opts&&opts.max!=null)) mx=b; }
  const ydec=axisDec((mx-mn)/4);
  const n = Math.max(...series.map(s=>s.data.length),2);
  const X=i=>x0+(x1-x0)*(n<=1?0:i/(n-1));
  const Y=v=>y1-(y1-y0)*((v-mn)/(mx-mn));
  c.strokeStyle="#222a36"; c.fillStyle="#5a6472"; c.font="10px Segoe UI"; c.lineWidth=1;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4, y=Y(v);
    c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();
    c.fillText(fmt(v,ydec),4,y+3);}
  (opts&&opts.marks||[]).forEach(m=>{const y=Y(m.v); c.strokeStyle=m.c||"#444";
    c.setLineDash([4,3]);c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();c.setLineDash([]);});
  series.forEach(s=>{
    if(s.axis==="r") return;
    c.strokeStyle=s.color; c.lineWidth=s.w||1.8; c.beginPath(); let started=false;
    s.data.forEach((v,i)=>{ if(v==null||isNaN(v)){started=false;return;}
      const px=X(i),py=Y(v); if(!started){c.moveTo(px,py);started=true;}else c.lineTo(px,py);});
    c.stroke();
    for(let i=s.data.length-1;i>=0;i--){if(s.data[i]!=null&&!isNaN(s.data[i])){
      c.fillStyle=s.color;c.beginPath();c.arc(X(i),Y(s.data[i]),2.6,0,7);c.fill();break;}}
  });
  const rs=series.filter(s=>s.axis==="r");
  if(rs.length){
    const ra=[]; rs.forEach(s=>s.data.forEach(v=>{if(v!=null&&!isNaN(v))ra.push(v)}));
    let rmn=0, rmx=ra.length?Math.max(...ra):1; if(rmx<=0)rmx=1;
    const [,rb,rst]=niceAxis(0,rmx*1.02,true); rmx=rb;                          // round steps (shared helper)
    const RY=v=>y1-(y1-y0)*((v-rmn)/(rmx-rmn));
    c.fillStyle="#5a6472";
    for(let g=0;g<=4;g++){const v=rst*g;c.fillText(fmt(v,axisDec(rst)),x1+3,RY(v)+3);}
    rs.forEach(s=>{c.strokeStyle=s.color;c.lineWidth=s.w||1.6;c.beginPath();let st=false;
      s.data.forEach((v,i)=>{if(v==null||isNaN(v)){st=false;return;}const px=X(i),py=RY(v);
        if(!st){c.moveTo(px,py);st=true;}else c.lineTo(px,py);});c.stroke();});
  }
}

const NODE={}; FSM_NODES.forEach(n=>{n.cx=n.x+HW; n.cy=n.y+HH; NODE[n.s]=n;});

function fsmEdges(){
  const N=NODE, IN=565, OUT=603;

    {f:0,to:2,pts:[side(N[0],"r"),side(N[2],"l")],main:1},                 // STOPPED→STARTING
    {f:2,to:3,pts:[side(N[2],"r"),side(N[3],"l")],main:1},                 // STARTING→IGNITION
    {f:3,to:4,pts:[side(N[3],"r"),side(N[4],"l")],main:1},                 // IGNITION→RUNNING
    {f:4,to:5,pts:[[IN,150],[IN,80]]},                                     // RUNNING→PAUSE/STOP
    {f:5,to:4,pts:[[OUT,80],[OUT,150]]},                                   // PAUSE/STOP→RUNNING
    {f:4,to:7,pts:[[IN,190],[IN,260]]},                                    // RUNNING→FIRE RESCUE
    {f:7,to:4,pts:[[OUT,260],[OUT,190]]},                                  // FIRE RESCUE→RUNNING
    {f:5,to:3,pts:[[530,60],[420,60],[420,150]]},                          // PAUSE/STOP→IGNITION (relight)
    {f:1,to:2,pts:[side(N[1],"t"),side(N[2],"b")]},                        // WAITING→STARTING
    {f:1,to:3,pts:[side(N[1],"r"),[388,280],[388,190]]},                   // WAITING→IGNITION
    {f:4,to:1,pts:[[541,190],[541,228],[480,228],[480,332],[N[1].cx,332],[N[1].cx,300]]}, // RUNNING→WAITING (boiler warm)
    {any:1,to:0,pts:[[84,248],[84,190]]},                                  // stop from any state
    {f:3,to:6,pts:[[380,150],[380,16],[814,16],[814,150]],fail:1},         // IGNITION fails → ALARM
    {f:4,to:6,pts:[[638,170],[760,170]],fail:1},                           // RUNNING faults → ALARM
    {f:7,to:6,pts:[[638,280],[886,280],[886,170],[868,170]],fail:1},       // FIRE RESCUE no fuel → ALARM
  ];
}

  </defs>`+h;

// light up the arrow prev→state (if the diagram has one) and write "came from X"
function highlightEdge(state, prev){
  document.querySelectorAll("#fsm polyline[data-f]").forEach(p=>{
    const direct=[...document.querySelectorAll("#fsm polyline[data-f]")].some(q=>+q.dataset.f===prev&&+q.dataset.to===state);
    const on = prev!=null && prev!==state && +p.dataset.to===state && (p.dataset.f==="any" ? !direct : +p.dataset.f===prev);
    p.setAttribute("stroke", on?(STATE_COLOR[prev]||"#e6edf3"):p.dataset.col);
    p.setAttribute("stroke-width", on?"4":p.dataset.w);
    if(on) p.removeAttribute("stroke-dasharray"); else if(p.dataset.dash) p.setAttribute("stroke-dasharray",p.dataset.dash);
    p.setAttribute("marker-end", `url(#${on?"arH":p.dataset.mk})`);
    if(on) p.parentNode.appendChild(p);           // draw on top of the other arrows
  });
  const c=document.getElementById("fsmCame");
  if(c) c.textContent = (prev!=null && prev!==state) ? t("came_from",{x:stateName(prev)}) : "";
}
// on a phone the diagram scrolls sideways: bring the lit state into view, but only when the state changes

let fsmScrolledFor=null;
function fsmScrollTo(state){
  const svg=document.getElementById("fsm"), box=svg&&svg.parentNode, n=NODE[state];
  if(!box||!n||box.scrollWidth<=box.clientWidth+4||fsmScrolledFor===state) return;
  fsmScrolledFor=state;
  const scale=svg.getBoundingClientRect().width/900;
  box.scrollTo({left:Math.max(0,n.cx*scale-box.clientWidth/2),behavior:"smooth"});
}
// label of the stop arrow: after the heating plan's own low-power stop the same words as /home ("resting until 09:00")
function stopLbl(s){

  if(s===0&&wm&&wm.enabled&&wm.rest_since) return wm.next_start?t("stop_rest",{n:clock(wm.next_start)}):t("stop_rest0");
  return t("stop_lbl");
}
function highlightFSM(state, prev){
  highlightEdge(state, prev); fsmScrollTo(state);
  const sl=document.getElementById("fsmStopLbl"); if(sl) sl.textContent=stopLbl(state);
  FSM_NODES.forEach(n=>{
    const g=document.getElementById("fsmn"+n.s); if(!g)return;
    const rect=g.querySelector("rect"), txt=g.querySelector("text");
    const on=(n.s===state), was=(prev!=null&&prev!==state&&n.s===prev); const col=STATE_COLOR[n.s]||"#8b949e";
    rect.setAttribute("fill", on?col:"#1c2330");

function cmdSrc(s){ s=String(s||""); const k=[["warm","plan"],["schedule","schedule"],["auto_reset","auto_reset"],["mqtt","mqtt"],["web","web"]].find(p=>s.startsWith(p[0]));
  return srcText({source:k?k[1]:"remote"})||s; }
function srcLine(e){                       // "Started by: heating plan" / "Stopped by: ..."
  const s=srcText(e); if(!s) return ""; const to=+e.to, fr=+e.from;
  return (to===2||to===3)?t("started_by")+": "+s:(fr!==6&&(to===0||to===1||to===5))?t("stopped_by")+": "+s:(fr===6&&to===0)?t("reset_by")+": "+s:s;
}
function renderLog(){
  const el=document.getElementById("log"); if(!el) return;
  // live: the responder's log (survives reloads, knows who caused a change); demo: this page's own log
  if(SERVER && Array.isArray(SERVER.events) && lastMode!=="demo"){
    const rows=SERVER.events.slice().reverse().slice(0,80).map(e=>{
      let msg="", cls="state";
      if(e.type==="transition"){
        msg=t("ev_state",{x:stateName(e.to)}); const c=srcLine(e);
        if(c) msg+=` <span style="color:var(--faint)">· ${esc(c)}</span>`;
        if(e.to===6){ cls="alarm"; }
      } else if(e.type==="alarm"){ cls="alarm"; msg=esc(t("ev_alarm",{n:e.alarm, name:ALARM[e.alarm]||""}));
        if(e.at_start) msg+=` <span style="color:var(--faint)">· ${esc(t("at_start"))}</span>`; }
      else if(e.type==="auto_reset"){ cls=e.kind==="saved"?"state":"alarm";
        msg=esc(t("ev_ar_"+e.kind,{a:(e.alarm||"")+" "+(ALARM[e.alarm]||"")})); }
      else if(e.type==="warning"){ cls="alarm"; msg="⚠ "+esc(warnText(e)); }
      else if(e.type==="command_dropped"){ cls="alarm"; msg=esc(t("ev_dropped",{w:e.why||""})); }
      else if(e.type==="alarm_reset_web"){ cls="alarm"; msg=esc(t("ev_web_reset",{n:e.alarm||""})); }
      else return "";
      const dd=new Date(e.epoch*1000), today=new Date().toDateString()===dd.toDateString();   // older days get their date
      return `<div class="e ${cls}"><span class="tm">${today||!e.epoch?"":dd.getDate()+"/"+(dd.getMonth()+1)+" "}${hhmm(e.epoch)}</span><span class="ms">${msg}</span></div>`;
    }).join("");
    el.innerHTML=rows; return;
  }
  el.innerHTML=events.map(e=>{
    let msg, cls;
    if(e.type==="state"){ cls="state"; msg=t("ev_state",{x:stateName(e.data.st)}); }
    else { cls="alarm"; msg=t("ev_alarm",{n:e.data.n, name:ALARM[e.data.n]||""}); }
    return `<div class="e ${cls}"><span class="tm">${e.tm}</span><span class="ms">${msg}</span></div>`;
  }).join("");
}

  const setV=(k,txt,cls)=>{const e=document.getElementById("v_"+k);if(!e)return;

  const rpmBad = (d.fan_pct>10 && d.fan_rpm!=null && d.fan_rpm < 0.9*d.fan_pct*27);
  setV("fan_rpm", fmt(d.fan_rpm,0)+'<span class="u">'+t("u_rpm")+'</span>', rpmBad?"bad":"");

  const luxV = d.flame!=null ? d.flame : (FLAME_FIELD===null ? null : d.aux4);
  setV("aux", fmt(luxV,0)+'<span class="u">/156</span>', luxV!=null && luxV>FLAME_ON ? "ok" : "");
  setV("silo_kg", fmt(d.silo_kg,0)+'<span class="u">kg</span>');
  setV("ignitions", fmt(d.ignitions,0));
  document.getElementById("v_io").innerHTML =
    `<span style="font-size:14px;display:flex;flex-direction:column;gap:6px">
      <span style="white-space:nowrap"><span class="io ${d.auger_on?'on':''}"></span>${t("auger")}</span>
      <span style="white-space:nowrap"><span class="io ${d.igniter_on?'onamber':''}"></span>${t("igniter")}</span></span>`;
  const setS=(k,txt)=>{const e=document.getElementById("s_"+k);if(e)e.textContent=txt;};
  setS("boiler_c", d.setpoint!=null?t("set_x",{x:d.setpoint.toFixed(0)}):"");
  setS("fan_rpm", d.fan_pct!=null?t("cmd_exp",{x:d.fan_pct.toFixed(0),y:(d.fan_pct*27).toFixed(0)}):"");
  setS("silo_kg", d.kgph!=null?t("kgph_v",{x:d.kgph.toFixed(2)}):t("silo_own"));
  setS("ignitions", t("total"));
  setS("aux", t("lux_sub"));
  setS("power_pct", d.state===4?t("modulating"):"");
  drawCharts(d);
  pidPanel(d);
  effPanel(d);
  lastRec=d;
  advise(d, mode);
  renderSeq(d);
}

// ---- state transitions (server log when available, else this page's own) ----
function renderTrans(mode){
  const el=document.getElementById("transLog"); if(!el) return;
  const list=(SERVER && Array.isArray(SERVER.transitions) && mode!=="demo") ? SERVER.transitions : clientTrans;
  if(!list.length){ el.innerHTML=`<div class="e"><span class="ms">${t("tr_none")}</span></div>`; return; }
  el.innerHTML=list.slice(-60).reverse().map(x=>{
    const to=+x.to, from=x.from==null?null:+x.from, cls = to===6?"alarm":"state";
    const dw = x.at_start ? t("at_start") : x.dwell_s!=null&&from!=null ? t("tr_in",{x:fmtDur(x.dwell_s), y:stateName(from)}) : "";
    const dd=new Date(x.epoch*1000), today=new Date().toDateString()===dd.toDateString();   // older days get their date
    return `<div class="e ${cls}"><span class="tm">${today?"":dd.getDate()+"/"+(dd.getMonth()+1)+" "}${hhmm(x.epoch)}</span>`+

      `<b style="color:${STATE_COLOR[to]||"#e6edf3"}">${esc(stateName(to))}</b>`+
      ` <span style="color:var(--faint)">${esc(dw)}${srcLine(x)?" · "+esc(srcLine(x)):""}</span></span></div>`;
  }).join("");
}

// This burner has no flue sensor (RØGFØLER NEJ): the "flue" value is then the board's own temperature, ~20-40 °C
// even at full power. A real flue reads 100 °C+ when burning. Hide flue-based numbers when that is the case.
// Default is "no sensor": flue values show only once a real flue reading (60 °C or more, as the server's
// MQTT check) has been seen. Before, a fresh browser with no burning in its history showed the board temperature.
let FLUE_FITTED=null;
function noFlueSensor(){
  if(FLUE_FITTED===null){ try{ FLUE_FITTED=localStorage.getItem("burner_flue_fitted")==="1"; }catch(e){ FLUE_FITTED=false; } }
  if(!FLUE_FITTED && hist.some(h=>h.flue_c!=null && h.flue_c>=60)){
    FLUE_FITTED=true; try{ localStorage.setItem("burner_flue_fitted","1"); }catch(e){}
  }
  return !FLUE_FITTED;
}

// ---- combustion efficiency panel ----
function effPanel(d){
  setTxt("t_eff_note",t(noFlueSensor()?"eff_note_nf":"eff_note"));   // no flue sensor: no flue words
  const pts=hist.filter(h=>h.power_pct!=null&&h.flue_c!=null&&h.power_pct>15);
  const n=pts.length;
  const sp=pts.map((h,i)=>({p:h.power_pct,f:h.flue_c,age:n>1?1-i/(n-1):0}));
  const bins={};
  pts.forEach(h=>{const b=Math.round(h.power_pct/10)*10;(bins[b]=bins[b]||[]).push(h.flue_c);});
  const baseline=Object.keys(bins).map(b=>({p:+b,
    f:bins[b].reduce((s,x)=>s+x,0)/bins[b].length})).sort((a,b)=>a.p-b.p);
  // no flue sensor: hide the flue card and the "flue vs normal" tile completely (nothing useful to show)
  const nf=noFlueSensor();
  document.getElementById("cEff").closest(".card").style.display=nf?"none":"";
  document.getElementById("v_fdelta").closest(".tile").style.display=nf?"none":"";
  if(!nf) scatterEff(document.getElementById("cEff"), sp, baseline);
  setTxt("v_kgph", d.kgph!=null?fmt(d.kgph,2):"—");
  setTxt("v_kgses", sessionKg>0?fmt(sessionKg,1):"—");
  const kw=d.kgph!=null?d.kgph*LHV:null;
  document.getElementById("v_kw").innerHTML = kw!=null?fmt(kw,1)+'<span class="u"> kW</span>':"—";
  setTxt("s_kw", kw!=null?t("kw_heat",{x:fmt(kw*0.88,1)}):t("sb_kw"));
  let dtxt="—", cls="", sub=t("sb_fdelta");
  if(noFlueSensor()) sub=t("no_flue");
  else if(d.power_pct!=null && d.flue_c!=null){
    const b=Math.round(d.power_pct/10)*10;
    if(bins[b] && bins[b].length>3){
      const base=bins[b].reduce((s,x)=>s+x,0)/bins[b].length, dd=d.flue_c-base;
      dtxt=(dd>=0?"+":"")+dd.toFixed(0)+" °C";
      cls = dd<=-4?"ok":dd>=8?"warn":"";
      sub = dd<=-4?t("cooler"):dd>=8?t("hotter"):t("normal");
    }
  }
  const fe=document.getElementById("v_fdelta"); fe.textContent=dtxt; fe.className="val"+(cls?" "+cls:"");
  setTxt("s_fdelta", sub);
}
function scatterEff(canvas, pts, baseline){
  const {c,W,H}=setupCanvas(canvas);
  const padL=40,padR=14,padT=10,padB=22, x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  if(!pts.length && !baseline.length){
    c.fillStyle="#5a6472";c.font="12px Segoe UI";c.textAlign="center";
    c.fillText(t("scatter_wait"),W/2,H/2);c.textAlign="start";return;
  }
  const fs=pts.map(p=>p.f).concat(baseline.map(b=>b.f));
  let mn=Math.min(...fs), mx=Math.max(...fs); if(mn===mx)mx=mn+1;
  const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const X=p=>x0+(x1-x0)*(p/100), Y=f=>y1-(y1-y0)*((f-mn)/(mx-mn));
  c.strokeStyle="#222a36"; c.fillStyle="#5a6472"; c.font="10px Segoe UI"; c.lineWidth=1;
  for(let g=0;g<=4;g++){const f=mn+(mx-mn)*g/4,y=Y(f);
    c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke(); c.fillText(f.toFixed(0),4,y+3);}
  for(let p=0;p<=100;p+=25){const x=X(p); c.fillText(p+"%",x-7,H-6);}
  c.textAlign="right"; c.fillText(t("flue_axis"),x1,y0+10); c.textAlign="start";   // top right, clear of the tick numbers
  pts.forEach(p=>{const a=0.22+0.68*(1-p.age);
    c.fillStyle=`rgba(240,93,94,${a})`; c.beginPath();c.arc(X(p.p),Y(p.f),3,0,7);c.fill();});
  if(baseline.length>1){
    c.strokeStyle="#7ee787"; c.lineWidth=2; c.beginPath();
    baseline.forEach((b,i)=>{const x=X(b.p),y=Y(b.f); i?c.lineTo(x,y):c.moveTo(x,y);}); c.stroke();
    baseline.forEach(b=>{c.fillStyle="#7ee787";c.beginPath();c.arc(X(b.p),Y(b.f),2.6,0,7);c.fill();});
  }
}

// ---- PID shadow loop ----
function pidPanel(d){
  const kp=d.kp!=null?d.kp:5, ki=d.ki!=null?d.ki:0.005, kd=d.kd!=null?d.kd:0, gnum=v=>LANG==="da"?String(v).replace(".",","):String(v);
  const haveGains=d.kp!=null;
  const err=[], pow=[];
  hist.forEach(h=>{
    err.push((h.setpoint!=null&&h.boiler_c!=null)?h.setpoint-h.boiler_c:null);
    pow.push(h.power_pct!=null?h.power_pct:null);
  });
  if(err.some(v=>v!=null)){
    chart(document.getElementById("cPid"),[
      {data:err,color:getCss("--warn")},          // amber: error, clearly different from the teal power line
      {data:pow,color:getCss("--power"),axis:"r"},
    ],{marks:[{v:0,c:"#5a6472"}]});
  } else {
    placeholder(document.getElementById("cPid"), t("pid_ph1"), t("pid_ph2"));
  }
  const error=(d.setpoint!=null&&d.boiler_c!=null)?d.setpoint-d.boiler_c:null;
  const out=d.power_pct;
  const pterm=error!=null?kp*error:null;
  const iterm=(pterm!=null&&out!=null)?out-pterm:null;
  setTxt("v_err", error!=null?(error>=0?"+":"")+fmt(error,1)+" °C":"—");
  setTxt("v_out", out!=null?out.toFixed(0)+" %":"—");
  setTxt("v_pterm", pterm!=null?(pterm>=0?"+":"")+pterm.toFixed(0)+" %":"—");
  setTxt("v_iterm", iterm!=null?(iterm>=0?"+":"")+iterm.toFixed(0)+" %":"—");
  let pf=0, inf=0;
  if(out!=null && out>0 && pterm!=null){ pf=Math.max(0,Math.min(1,pterm/out)); inf=1-pf; }
  document.getElementById("pbar_p").style.width=(pf*100).toFixed(0)+"%";
  document.getElementById("pbar_i").style.width=(inf*100).toFixed(0)+"%";
  let st;
  if(error==null) st=t("pid_wait");
  else if(d.state!==4) st=t("pid_only_drift",{x:stateName(d.state)});
  else if(d.max_power && out!=null && out>=d.max_power-1) st=t("pid_sat");
  else if(out!=null && out<=1) st=t("pid_min");
  else if(pterm!=null && Math.abs(pterm)<3 && out>5) st=t("pid_hold");
  else if(error>0) st=t("pid_below");
  else st=t("pid_above");
  setTxt("pidStatus", st);
  document.getElementById("pidGains").innerHTML=
    t("pid_gains",{kp:gnum(kp),ki:gnum(ki),kd:gnum(kd),src:haveGains?t("src_ctrl"):"<b style='color:var(--warn)'>"+t("src_def")+"</b>"});
}

// ---- advisory engine ----
function advise(d, mode){
  const out=[];
  const add=(lvl,title,sub)=>out.push({lvl,title,sub});
  if(mode==="demo") add("warn",t("adv_demo_t"),t("adv_demo_s"));
  else if(mode==="stale") add("bad",t("adv_stale_t"),d.never?t("adv_never_s"):t("adv_stale_s",{x:d.ageTxt}));
  if(d.alarm) add("bad",t("adv_alarm_t",{n:d.alarm,name:ALARM[d.alarm]||""}), alarmHint(d.alarm));
  if(d.fan_pct>10 && d.fan_rpm!=null){
    const exp=d.fan_pct*27, ratio=exp>0?d.fan_rpm/exp:1;
    if(ratio<0.85) add("bad",t("adv_fanbad_t"),t("adv_fanbad_s",{rpm:d.fan_rpm,exp:exp.toFixed(0),pct:(ratio*100).toFixed(0)}));
    else if(ratio<0.93) add("warn",t("adv_fanlow_t"),t("adv_fanlow_s",{rpm:d.fan_rpm,exp:exp.toFixed(0)}));
  }
  if(d.state===4 && d.flame!=null && d.flame<17) add("warn",t("adv_flame_t"),t("adv_flame_s"));
  const ft=noFlueSensor()?null:fluePowerTrend();
  if(ft) add("warn",t("adv_flue_t"),t("adv_flue_s",{x:ft}));
  if(d.state===4 && d.power_pct!=null && d.max_power && d.power_pct>=d.max_power-1 && d.boiler_c!=null && d.setpoint!=null && d.boiler_c<d.setpoint-3)
    add("warn",t("adv_full_t"),t("adv_full_s"));
  if(out.length===0) add("ok",t("adv_ok_t"),t("adv_ok_s"));
  document.getElementById("adv").innerHTML=out.map(o=>
    `<div class="row ${o.lvl}"><span class="ic">${o.lvl==="ok"?"✓":o.lvl==="warn"?"▲":"■"}</span>
       <span class="tx"><b>${o.title}</b><span>${o.sub}</span></span></div>`).join("");
}
function fluePowerTrend(){
  const pts=hist.filter(h=>h.power_pct>40 && h.flue_c!=null);
  if(pts.length<40) return null;
  const k=Math.floor(pts.length/3);
  const avg=a=>a.reduce((s,x)=>s+x.flue_c,0)/a.length;
  const older=avg(pts.slice(0,k)), recent=avg(pts.slice(-k));
  return (recent-older>15) ? (recent-older).toFixed(0) : null;
}

// ---- sequences tab (nested sub-state-machines) ----
// state: the operating state this sub-sequence lives inside (null = cross-cutting).
// timer: the boiler's limit in seconds for the dominant countdown of that state (progress is DERIVED
//        from time-in-state — fine sub-steps are not in the telemetry).
const SEQDEF=[
  {id:"ign",     state:3, timer:600, cfgTimer:"017"},   // TIMEOUT (cfg 017) = how long ignition may take
  {id:"rescue",  state:7, timer:600},
  {id:"pause",   state:5, timer:1200},
  {id:"waiting", state:1, timer:null},
  {id:"ash",     state:2, timer:60},       // the ash-plate turn happens in OPSTART; 60 s job limit
];
function fmtDur(s){ s=Math.max(0,Math.round(s));
  if(s<90) return s+" s"; if(s<3600) return Math.floor(s/60)+" min "+(s%60)+" s";
  const tm=Math.round(s/60), h=Math.floor(tm/60), m=tm%60; return h+" "+t("u_hour")+(m?" "+m+" min":""); }  // round total minutes first (no '5 h 60 min')
function renderSeq(d){
  const wrap=document.getElementById("seqWrap"); if(!wrap) return;
  const S=(I18N[LANG]||I18N.en).seqs;
  const cur = d?d.state:null;
  // e.g. RUNNING (4) has no card: say so instead of pointing at a highlighted card that is not there
  const none = cur!=null && !SEQDEF.some(def=>def.state!=null && cur===def.state) && !(ASH && ASH.out===1);
  let html = `<div class="seqnote">${t("seq_derived")}${none?" <b>"+esc(t("seq_none",{st:stateName(cur)}))+"</b>":""}</div>` + safetyCard(d);   // 1 Hz safety scan on top
  SEQDEF.forEach(def=>{
    const s=S[def.id]; if(!s) return;
    const ashOut=def.id==="ash" && ASH && ASH.out===1;
    const active=(def.state!=null && cur===def.state) || ashOut;
    // current step, from real data where we have it (ignition: auger, igniter, flame)
    let curStep=-1;
    if(active && def.id==="ign" && d){
      const lux = d.flame!=null ? d.flame : d.aux4;
      curStep = (lux>FLAME_ON && !d.igniter_on) ? 3 : (lux>FLAME_ON ? 2 : (d.auger_on ? 0 : 1));
    }
    const stepsHtml=s.steps.map((tx,i)=>
      `<div class="step${i===curStep?" cur":""}"><span class="n">${i+1}</span>${tx}</div>`
    ).join('<span class="arrow">&#8594;</span>');
    const exits=(s.exits||[]).map(x=>`<div class="x ok">&#10140; ${x}</div>`).join("")
              +(s.fails||[]).map(x=>`<div class="x fail">&#9888; ${x}</div>`).join("");
    let bar="";
    // time in state from the responder (survives page reloads), else from this page
    const since = (SERVER && SERVER.state_since && lastMode!=="demo") ? SERVER.state_since : stateSince;
    if(active && def.timer!=null && since!=null && d){
      const lim = (def.cfgTimer && lastCfgRaw && +lastCfgRaw[def.cfgTimer]) || def.timer;
      const el=(d.epoch||Date.now()/1000)-since;
      // ignition with flame already seen: the time limit is met, so no red 'gives up' bar
      const lit = def.id==="ign" && curStep>=2;
      const pct=lit?100:Math.max(0,Math.min(100, el/lim*100));
      const cls=lit?"":pct>=100?"bad":pct>=80?"warn":"";
      bar=`<div class="seqbar"><span class="${cls}" style="width:${pct.toFixed(0)}%"></span></div>`
        +`<div class="seqtmr">${t("seq_instate",{x:fmtDur(el)})} · ${lit?t("seq_lit"):t("seq_limit",{x:fmtDur(lim)})}</div>`;
    }
    html+=`<div class="seqcard${active?" active":""}">
      <div class="seqhead"><span class="nm">${s.title}</span>
        <span class="loc">${t("seq_inside",{x:s.loc})}</span>
        <span class="st${active?" go":""}">${active?t("seq_active"):t("seq_idle")}</span></div>
      <div class="seqflow">${stepsHtml}</div>
      <div class="seqexits">${exits}</div>${bar}${def.id==="ash"?ashLiveLine():""}</div>`;
  });
  wrap.innerHTML=html;
}

function safetyCard(d){
  const S=(I18N[LANG]||I18N.en).seqs.safety;
  // each trip: [name, detail, value-string, status]  status: ok|warn|bad|'' (unknown)
  const rows=[];
  const al=d?d.alarm:0;
  const b=d?d.boiler_c:null, fl=d?d.flue_c:null;
  // boiler sensor open/short (alarm 7 / 8)
  rows.push([S.boiler, S.boiler_d,
    b!=null?fmt(b,1)+" °C":"—",
    al===7||al===8?"bad": (b==null?"":(b<-35||b>150?"warn":"ok"))]);
  // flue sensor (alarm 9)
  rows.push([S.flue, S.flue_d,
    noFlueSensor()?t("no_flue"):(fl!=null?fl.toFixed(0)+" °C":"—"),
    al===9?"bad": (fl==null?"":(fl<=-20?"warn":"ok"))]);
  // overheat thermoswitch (alarm 2) — no direct signal
  rows.push([S.thermo, S.thermo_d, al===2?S.tripped:S.noSig, al===2?"bad":""]);
  // exhaust fan (alarm 12)
  let fanv=S.noSig, fans="";
  if(d && d.fan_pct!=null){
    // judge the speed only in steady burning (RUNNING 3+ min, fan % unchanged 1+ min); it lags while ramping up
    const now=d.epoch||Date.now()/1000;
    if(fanPctRef==null || Math.abs(d.fan_pct-fanPctRef)>2){ fanPctRef=d.fan_pct; fanPctSince=now; }
    const since=(SERVER && SERVER.state_since && lastMode!=="demo") ? SERVER.state_since : stateSince;
    const steady=d.state===4 && since!=null && now-since>=180 && now-fanPctSince>=60;
    if(steady && d.fan_pct>10 && d.fan_rpm!=null){
      const r=d.fan_rpm/(d.fan_pct*27); fanv=t(r<0.85?"fan_slow_x":"fan_ok_x",{p:(r*100).toFixed(0)}); fans=r<0.85?"warn":"ok";
    } else fanv=t([2,3,7].includes(d.state)?"fan_start":"fan_steady");
  }
  rows.push([S.fan, S.fan_d, al===12?S.tripped:fanv, al===12?"bad":fans]);
  // board fuse (alarm 13)
  rows.push([S.fuse, S.fuse_d, al===13?S.tripped:S.noSig, al===13?"bad":""]);
  // module/wifi link (alarm 15) — we ARE the module; fresh data = ok
  rows.push([S.wifi, S.wifi_d, al===15?S.tripped:(d?S.answering:"—"), al===15?"bad":(d?"ok":"")]);
  const grid=rows.map(r=>
    `<div class="trip"><span class="tdot ${r[3]}"></span>
      <span class="tx"><b>${r[0]}</b><span>${r[1]}</span></span>
      <span class="tv">${r[2]}</span></div>`).join("");
  return `<div class="seqcard">
     <div class="seqhead"><span class="nm">${S.title}</span>
       <span class="loc">${S.loc}</span>
       <span class="st go">${t("seq_always")}</span></div>
     <div class="trips">${grid}</div>
     <div class="seqtmr">${noFlueSensor()&&S.note_nf?S.note_nf:S.note}</div></div>`;
}

// ---- normalise payload ----
function flatten(latest, cfg){
  const f=(latest&&latest.fields)||{};
  const g=k=>{const v=f[k]; return (v==null)?null:Number(v);};
  const cf=k=>{const v=cfg&&cfg.fields&&cfg.fields[k]; return v==null?null:Number(v);};
  return {
    epoch: latest&&latest.epoch||Date.now()/1000,
    state: g("state")!=null?g("state"):0,
    boiler_c:g("boiler_c"), flue_c:g("flue_c"), power_pct:g("power_pct"),
    fan_rpm:g("fan_rpm"), fan_pct:g("fan_pct"),
    aux3:g("analog3"), aux4:g("sensor4"),
    flame: FLAME_FIELD?g(FLAME_FIELD):null,
    silo_kg:g("silo_kg"), ignitions:g("ignitions"), alarm:g("alarm")||0,
    auger_on:!!g("auger_on"), igniter_on:!!g("igniter_on"),
    setpoint:cf("setpoint_c"), max_power:cf("max_power"),
    kp:cf("pid_kp"), ki:cf("pid_ki"), kd:cf("pid_kd"),
  };
}

// ---- polling ----
// why a poll got no data: this device offline / no reply at all (network error, timeout) / the monitor answered with an error
const noAnswerKey=e=>navigator.onLine===false?"nodata_net":(e&&e.name&&e.name!=="SyntaxError")?"nodata_noreply":"nodata_resp";
let pollBusy=false;                           // one poll at a time: skipped while one is still waiting (slow Wi-Fi)
async function poll(){
  if(forceDemo){ demoTick(); return; }
  if(document.hidden) return;                 // nothing is asked while the page is hidden (see visibilitychange)
  if(pollBusy) return;
  pollBusy=true;
  const ac=window.AbortController?new AbortController():null, to=ac?setTimeout(()=>ac.abort(),20000):0;   // give up after 20 s
  try{
    // the monitor's history rows only on the first answer; after that only the new ones (a poll is a few kB)
    // the seldom-changing parts (transitions, events, ...) only when they changed: &tv= = the versions we have
    const r=await fetch("status.json"+(liveSince?"?since="+liveSince+(liveTV?"&tv="+liveTV:""):""),{cache:"no-store",signal:ac?ac.signal:undefined});
    if(!r.ok) throw 0;
    const j=await r.json(); clearTimeout(to); pollBusy=false;
    ["transitions","events","prealarm","labels","warm","ash_plate","weather","schedule","auto_reset","warnings","remote","vvb","cfg","minmode","cfg_sync","cfg_changes"].forEach(k=>{ if(k in j) liveSlow[k]=j[k]; else if(k in liveSlow){ if(j.hot&&j.hot[k]) liveSlow[k]=Object.assign({},liveSlow[k],j.hot[k]); j[k]=liveSlow[k]; } });
    liveTV=j.tv||"";
    if(Array.isArray(j.history)&&j.history.length) liveSince=Math.max(liveSince,j.history[j.history.length-1].epoch||0);
    monVer=j.version||monVer;
    setTxt("footVer", j.version?"Version "+j.version:"");   // same word in English and Danish
    const firstSrv=!(SERVER&&SERVER.labels);
    SERVER={transitions:j.transitions, prev_state:j.prev_state, prealarm:j.prealarm,
            cfg_sync:j.cfg_sync, remote:j.remote, auto_reset:j.auto_reset, events:j.events,
            state_since:j.state_since, labels:j.labels, warm:j.warm};
    if(firstSrv && j.labels && lastIgR) renderIgnitions(lastIgR);   // opened straight on Analysis (classic#opt): fill 'Started by'
    lastCfgRaw = (j.cfg && j.cfg.raw) || lastCfgRaw;
    lastCfgAt = (j.cfg && j.cfg.epoch) || lastCfgAt;
    ASH = j.ash_plate || ASH;
    if("cfg_changes" in j) CC=j.cfg_changes;
    if(activeTab==="opt"){ renderAshTurns(); renderCfgChanges(); }
    renderLog();
    // LUX field comes from the responder's settings (default 004)
    if("flame_field" in j) FLAME_FIELD = j.flame_field==="003"?"analog3":(j.flame_field==="004"?"sensor4":null);
    const rec=flatten(j.latest, j.cfg);
    rec.never = !(j.latest&&j.latest.epoch);           // nothing ever heard: say so, not "0 s ago"
    rec.epoch = j.latest&&j.latest.epoch || Date.now()/1000;
    const age = Math.max(0, Date.now()/1000 - rec.epoch);
    rec.ageTxt = age<90?`${age.toFixed(0)} s`:`${(age/60).toFixed(0)} min`;
    if(hist.length<3 && Array.isArray(j.history)){
      j.history.forEach(h=>{ pushHist(normHist(h)); feedSilo(h.epoch, h.silo_kg); });
    }
    rec.kgph=kgph(rec);
    pushHist(normHist2(rec));
    lastGood=Date.now();
    const stale = (j.connected===false) || age>pollMs/1000*3;
    render(rec, stale?"stale":"live");
  }catch(e){
    clearTimeout(to); pollBusy=false;
    // was connected before -> say so clearly instead of silently switching to demo data
    if(lastGood && !forceDemo){
      showNoData(t(noAnswerKey(e)));
      const dot=document.getElementById("dot"); if(dot) dot.className="dot stale";
      const age=Math.round((Date.now()-lastGood)/1000);
      setTxt("connText", t("conn_stale",{x: age<90?age+" s":Math.round(age/60)+" min"}));
      return;
    }
    demoTick();
  }
}

  const b=document.getElementById("noDataBar"); if(!b) return;
  if(!text){ b.classList.remove("on"); return; }
  document.getElementById("noDataTitle").textContent=t("nodata_title");

function normHist(h){
  return {epoch:h.epoch, boiler_c:h.boiler_c, setpoint:h.setpoint, flue_c:h.flue_c,
    power_pct:h.power_pct, fan_pct:h.fan_pct, fan_rpm:h.fan_rpm, silo_kg:h.silo_kg, flame:h.flame, state:h.state};
}
function normHist2(rec){
  return {epoch:rec.epoch, boiler_c:rec.boiler_c, setpoint:rec.setpoint, flue_c:rec.flue_c,
    power_pct:rec.power_pct, fan_pct:rec.fan_pct, fan_rpm:rec.fan_rpm, silo_kg:rec.silo_kg, flame:rec.flame, state:rec.state};
}
// Pellet use (kg/h) from the boiler's silo counter. The counter moves in whole kg, so the rate is the kg between
// two steps of the counter / the time between those steps. (Window start to a step gave "1 kg in at most 15 min",
// i.e. 4 kg/h or more after every step, about twice the real use.)
const KGPH_WINDOW=5400, KGPH_MIN_SPAN=600;
let siloBuf=[], siloSteps=[], sessionRef=null;      // siloBuf: the last reading; siloSteps: {t, kg} each time it went down
function feedSilo(ts,s){
  if(s==null||isNaN(s)) return;
  const last=siloBuf.length?siloBuf[siloBuf.length-1]:null;
  if(last && s > last.s + 2){ siloBuf=[]; siloSteps=[]; sessionRef=null; }       // refilled or reset
  else if(last && ts > last.t && s < last.s && last.s - s < 5) siloSteps.push({t:ts, kg:last.s - s});
  if(!siloBuf.length || ts > siloBuf[siloBuf.length-1].t) siloBuf=[{t:ts,s}];
  while(siloSteps.length && ts - siloSteps[0].t > KGPH_WINDOW) siloSteps.shift();
  if(sessionRef==null) sessionRef=s;
  sessionKg=Math.max(0, sessionRef - s);
}
function kgph(rec){
  if(rec.silo_kg==null) return null;
  feedSilo(rec.epoch||Date.now()/1000, rec.silo_kg);
  if(![2,3,4,5,7].includes(rec.state) || siloSteps.length<2) return null;     // only while the burner is on
  const a=siloSteps[0], b=siloSteps[siloSteps.length-1];
  if(b.t-a.t<KGPH_MIN_SPAN) return null;
  return siloSteps.slice(1).reduce((n,x)=>n+x.kg,0) / ((b.t-a.t)/3600);
}

// ---- demo simulator: scripted walk through the WHOLE state machine ----
// Made-up round values (setpoint 65 °C, silo counter 300 kg, 1000 ignitions; fan rpm = fan%×27).
// It auto-cycles so every panel, the alarm banner, the event log and the Sequences
// tab's ACTIVE highlighting all animate — without ever touching the bus.
// Each phase lasts n ticks (one tick per poll); st = operating state.
const DEMO_PHASES=[
  {st:0,n:6},{st:2,n:5},{st:3,n:10},{st:4,n:45},{st:5,n:10},
  {st:4,n:18},{st:7,n:12},{st:4,n:14},{st:6,n:7},{st:0,n:4},
];
const DEMO_ALARMS=[12,4,9,13];   // rotate a different alarm each loop so the hints get exercised
const demo={pi:0,pc:0,loop:0,boiler:20,set:65,silo:300,ign:1000,flue:34,power:0,
  flame:0,fanpct:25,alarm:0,igniterOn:false,augerOn:false};
function demoTick(){
  let ph=DEMO_PHASES[demo.pi];
  demo.pc++;
  if(demo.pc>ph.n){                                   // advance to the next phase
    demo.pc=1; demo.pi=(demo.pi+1)%DEMO_PHASES.length; ph=DEMO_PHASES[demo.pi];
    if(ph.st===2) demo.ign++;                          // each new start attempt ticks the counter
    if(ph.st===6) demo.alarm=DEMO_ALARMS[demo.loop%DEMO_ALARMS.length];
    if(ph.st===0){ demo.alarm=0; if(demo.pi===0) demo.loop++; }
  }
  const frac=demo.pc/ph.n, rnd=a=>(Math.random()-0.5)*a;
  demo.igniterOn=false; demo.augerOn=false;
  switch(ph.st){
    case 0: // STOPPED — cooling, idle air
      demo.power=0; demo.fanpct=25; demo.flame=0;
      demo.boiler=Math.max(16,demo.boiler-0.4); demo.flue=Math.max(18,demo.flue-1.2); break;
    case 2: // STARTING — fan 25 %, ash turn, first fuel
      demo.power=0; demo.fanpct=25; demo.flame=0; demo.augerOn=true; break;
    case 3: // IGNITION — air ramp 80/20, flame building toward the 17 threshold
      demo.power=0; demo.fanpct=(demo.pc%2?80:20); demo.igniterOn=true;
      demo.flame=Math.max(0,30*frac+rnd(4)); demo.flue=38+12*frac; demo.boiler+=0.05; break;
    case 4: { // RUNNING — PID modulation toward setpoint
      const err=demo.set-demo.boiler;
      demo.power=Math.max(18,Math.min(100, demo.power+err*0.9+rnd(3)));
      demo.boiler += (demo.power-42)*0.013 - 0.02 + rnd(0.12);
      demo.flue = 88 + demo.power*1.15 + rnd(5);
      demo.flame = Math.max(20,Math.min(150, 70+demo.power*0.55+rnd(8)));
      demo.fanpct = Math.round(25+demo.power*0.6);
      demo.augerOn=(demo.pc%3===0);
      if(demo.pc%4===0) demo.silo=Math.max(0,demo.silo-1); break; }
    case 5: // PAUSE/STOP — burn out while hot (fan 70→25 %)
      demo.power=Math.max(0,demo.power-3); demo.fanpct=(frac<0.5?70:25);
      demo.flame=Math.max(0,demo.flame-6); demo.flue=Math.max(40,demo.flue-3);
      demo.boiler=Math.max(demo.set-1,demo.boiler-0.15); break;
    case 7: // FIRE RESCUE — dose, purge 100 %, then recover on fan 60 %
      demo.power=0; demo.augerOn=(frac<0.35); demo.fanpct=(frac<0.35?100:60);
      demo.flame=(frac<0.7? Math.max(2,8+rnd(4)) : 60+(frac-0.7)*280);
      demo.flue=Math.max(45,demo.flue-1); break;
    case 6: // ALARM — igniter off, fan to 25 %
      demo.power=0; demo.fanpct=25; demo.flame=0;
      demo.boiler=Math.max(16,demo.boiler-0.2); demo.flue=Math.max(20,demo.flue-2); break;
  }
  const rec={epoch:Date.now()/1000, state:ph.st,
    boiler_c:demo.boiler, flue_c:demo.flue, power_pct:demo.power,
    fan_pct:demo.fanpct, fan_rpm:Math.round(demo.fanpct*27+rnd(40)),
    aux3:Math.round(demo.boiler*1.2), aux4:demo.flame,
    flame: FLAME_FIELD?demo.flame:null,
    silo_kg:demo.silo, ignitions:demo.ign, alarm:demo.alarm,
    auger_on:demo.augerOn, igniter_on:demo.igniterOn,
    setpoint:demo.set, max_power:100, kp:5, ki:0.005, kd:0, ageTxt:"demo"};
  rec.kgph=kgph(rec);
  pushHist(normHist2(rec));
  render(rec,"demo");
}

  document.getElementById("tab-live").style.display = name==="live"?"":"none";
  document.getElementById("tab-seq").style.display  = name==="seq"?"":"none";
  document.getElementById("tab-sch").style.display  = name==="sch"?"":"none";
  document.getElementById("tab-opt").style.display  = name==="opt"?"":"none";
  document.getElementById("tab-disc").style.display = name==="disc"?"":"none";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  if(name==="live" && lastRec){ drawCharts(lastRec); pidPanel(lastRec); effPanel(lastRec); }
  if(name==="seq") renderSeq(lastRec);
  if(name==="sch") loadSchedule(!schLoaded);
  if(name==="opt"){ loadOptimiser(); renderCfgChanges(); }
  if(name==="disc") loadDiscoveries();
}
// refresh the open tab: schedule status every poll, optimiser every minute
setInterval(()=>{ if(activeTab==="sch"&&!document.hidden) loadSchedule(false); }, 10000);
setInterval(()=>{ if(activeTab==="opt"&&!document.hidden) loadOptimiser(); }, 60000);

// ---- in-page confirmation (browser confirm() can be suppressed, e.g. by Brave) ----
function askConfirm(text){
  return new Promise(resolve=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mtext"></div>
      <div class="mbtns"><button type="button" data-a="0"></button><button type="button" class="primary" data-a="1"></button></div></div>`;
    bg.querySelector(".mtext").textContent=text;
    bg.querySelector('[data-a="0"]').textContent=t("btn_cancel");
    bg.querySelector('[data-a="1"]').textContent=t("btn_ok");
    const done=v=>{ bg.remove(); document.removeEventListener("keydown",key); resolve(v); };
    const key=e=>{ if(e.key==="Escape") done(false); };
    bg.addEventListener("click",e=>{ if(e.target===bg) done(false); const a=e.target.dataset&&e.target.dataset.a; if(a!=null) done(a==="1"); });
    document.addEventListener("keydown",key);
    document.body.appendChild(bg);
    bg.querySelector('[data-a="0"]').focus();
  });
}

function askText(text, initial){
  return new Promise(resolve=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mtext"></div>
      <input type="text" maxlength="40" style="width:100%;margin-top:10px;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:7px;padding:7px 9px;font:inherit">
      <div class="mbtns"><button type="button" data-a="0"></button><button type="button" class="primary" data-a="1"></button></div></div>`;
    bg.querySelector(".mtext").textContent=text;
    const inp=bg.querySelector("input"); inp.value=initial||"";
    bg.querySelector('[data-a="0"]').textContent=t("btn_cancel");
    bg.querySelector('[data-a="1"]').textContent=t("sch_save");
    const done=v=>{ bg.remove(); resolve(v); };
    bg.addEventListener("click",e=>{ if(e.target===bg) done(null); const a=e.target.dataset&&e.target.dataset.a;
      if(a==="0") done(null); if(a==="1") done(inp.value.trim()||null); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") done(inp.value.trim()||null); if(e.key==="Escape") done(null); });
    document.body.appendChild(bg); inp.focus();
  });
}

// =====================================================================  Schedule tab
let SCH=null, schDirty=false, schLoaded=false;

async function loadSchedule(force){
  try{
    const {ok,j}=await api("api/settings");
    if(!ok) throw 0;
    document.getElementById("schArmNote").textContent = j.armed?"":t("sch_not_armed");
    renderSchStatus(j.schedule);
    if(force || !schDirty){ SCH=j.settings.schedule; schDirty=false; fillSchedule(); }
    if(j.settings.auto_reset && (force || !arDirty)) fillAutoReset(j.settings.auto_reset);
    renderAutoReset(j.auto_reset);
    if(j.settings.vvb && (force || !vvDirty)) fillVvb(j.settings.vvb);
    renderVvb(j.vvb);
    if(j.settings.warm && (force || !wmDirty)) fillWarm(j.settings.warm);
    renderWarm(j.warm);
    renderWxAsh(j.settings, force);
    document.getElementById("luxField").value = j.settings.flame_field||"";
    schLoaded=true;
  }catch(e){
    document.getElementById("schArmNote").textContent=t("sch_no_server");
    document.getElementById("schStatus").textContent="—";
  }
}
// ---- server messages in the selected language (server sends code/kind + numbers; English text = fallback) ----
function warnText(e){
  let kind=e.kind||""; if(e.source==="ash_plate"&&kind==="alarm_out"&&e.p&&+e.p.alarm===6) kind="alarm_out6";
  const k="wt_"+(e.source||"")+"_"+kind, d=I18N[LANG]||I18N.en;
  if(e.p && d[k]!=null) return t(k, Object.assign({}, e.p, {band: e.band?t("band_"+e.band):""}));
  return e.text||"";
}
function detailText(prefix, st){
  if(!st) return "";
  const p=st.p||{}, d=I18N[LANG]||I18N.en;
  let k=prefix+st.code;
  if(prefix==="sd_" && st.code==="blocked") k="sd_blocked_"+(p.why||"manual");
  if(prefix==="sd_" && st.code==="pending" && p.ending) k="sd_pending_ending";
  if(d[k]!=null) return t(k, Object.assign({}, p, {st: p.state!=null?stateName(p.state):""}));
  return st.text||"";
}

// ---- automatic alarm reset card ----
let AR=null, arDirty=false;
const AR_ALLOWED=TABLES.alarm_auto_reset_allowed;         // the rest can never be reset automatically (server enforces it too)
function fillAutoReset(cfg){
  AR=JSON.parse(JSON.stringify(cfg)); arDirty=false;
  document.getElementById("arEnabled").checked=!!AR.enabled;
  document.getElementById("arFs").disabled=!AR.enabled;
  document.getElementById("arWait").value=AR.wait_min; document.getElementById("arMax").value=AR.max_per_day;
  document.getElementById("arAlarms").innerHTML=AR_ALLOWED.map(n=>
    `<label class="chk"><input type="checkbox" data-al="${n}" ${AR.alarms.includes(n)?"checked":""}> <span>${n} — ${esc(ALARM[n]||"ALARM "+n)}</span></label>`).join("");
  document.querySelectorAll("#arAlarms [data-al]").forEach(cb=>cb.onchange=()=>{
    const n=+cb.dataset.al; AR.alarms = cb.checked? [...new Set([...AR.alarms,n])].sort((a,b)=>a-b) : AR.alarms.filter(x=>x!==n); arDirty=true; });
}
function renderAutoReset(f){
  if(!f) return;
  const c=f.status&&f.status.code||"off";
  const detail=["waiting","clearing","restarted","gave_up","not_allowed"].includes(c)?" · "+esc(detailText("ad_",f.status)):"";
  document.getElementById("arStatus").innerHTML=`<b style="color:${c==="saved"?"var(--ok)":(c==="gave_up"?"var(--warn)":"var(--dim)")}">${esc(t("ars_"+c))}</b>${detail}`;
  const ls=f.last_save;
  document.getElementById("arSaved").innerHTML=`<b>${esc(t("ar_saved",{n:f.saves||0}))}</b><br><span class="note">`+
    (ls?esc(t("ar_last",{t:dmy(ls.epoch),a:ls.alarm+" "+(ALARM[ls.alarm]||"")})):esc(t("ar_none")))+
    ` · ${esc(t("ar_att",{n:f.attempts_24h||0}))}</span>`;
}
async function saveAutoReset(){
  AR.enabled=document.getElementById("arEnabled").checked;
  const m=document.getElementById("arMsg"), nv={wait_min:numF("arWait"),max_per_day:numF("arMax")};
  if(!allNum(nv)){ m.textContent=t("num_bad"); m.className="savemsg bad"; return; }
  Object.assign(AR,nv);
  try{
    const {ok,j}=await api("api/settings",{auto_reset:{enabled:AR.enabled,alarms:AR.alarms,wait_min:AR.wait_min,max_per_day:AR.max_per_day}});
    m.textContent=ok?"✓ "+t("sch_saved"):(j.msg||t("save_failed")); m.className="savemsg "+(ok?"ok":"bad");
    if(ok){ arDirty=false; loadSchedule(true); }
  }catch(e){ m.textContent=t("sch_no_server"); m.className="savemsg bad"; }
}

// ---- warm-period mode card ----
let WM=null, wmDirty=false;
function fillWarm(cfg){
  WM=JSON.parse(JSON.stringify(cfg)); wmDirty=false;
  document.getElementById("wmEnabled").checked=!!WM.enabled;
  document.getElementById("wmBoard").checked=WM.use_board!==false;
  document.getElementById("wmMinC").value=WM.min_boiler_c?WM.min_boiler_c:"";   // 0 = off: shown as "off", not "0 °C"
  wmMinCUnit();
  document.getElementById("wmRestart").value=WM.keep_restart_c??5; document.getElementById("wmPump").value=WM.pump_c??50;
  wmShowValues(LASTWM);
}
function wmMinCUnit(){   // empty or 0 = off: the field says "off" and the °C goes away
  const el=document.getElementById("wmMinC"), off=!(+el.value);
  el.placeholder=t("wm_off"); document.getElementById("wmMinCu").style.visibility=off?"hidden":"";
}
let LASTWM=null, LASTWMF=null;
function wmHelp(){   // stop-at help with the real minimum burn time and the "for N minutes" field as typed
  const f=LASTWMF, typed=numF("wmAfter");
  document.getElementById("wmStopHelp").textContent=t("wm_stop_help",{r:(f&&f.min_run_min)??20,
    a:wmDirty&&isFinite(typed)?typed:(WM&&WM.stop_after_min)??(f&&f.stop_after_min)??2});
}
function wmShowValues(f){
  const board=document.getElementById("wmBoard").checked, src=board&&f?f:WM; if(!src) return;
  document.getElementById("wmFs").disabled=!document.getElementById("wmEnabled").checked;
  LASTWMF=f||LASTWMF; wmHelp();
  ["wmStop","wmAfter","wmPause","wmBoosts"].forEach(id=>document.getElementById(id).disabled=board&&id!=="wmAfter");
  if(wmDirty&&!board) return;
  document.getElementById("wmStop").value=src.stop_pct; document.getElementById("wmAfter").value=(WM||src).stop_after_min;
  document.getElementById("wmPause").value=src.pause_h; document.getElementById("wmBoosts").value=(src.boosts||[]).join(", ");
}
function renderWarm(f){
  LASTWM=f||LASTWM; const el=document.getElementById("wmStatus"); if(!el) return;
  if(!f||!f.enabled){ el.innerHTML=`<span style="color:var(--dim)">${esc(t("wm_off"))}</span>`; }
  else { const c=(f.status||{}).code, nx=f.next_start?new Date(f.next_start*1000).toLocaleDateString(LOC(),{weekday:"short"})+" "+clock(f.next_start):"—";
    const sp=Object.assign({}, (f.status||{}).p||{}, {n:nx,p:f.stop_pct}), d=I18N[LANG]||I18N.en;   // the server sends a code + params; its English text is only the last fallback
    const txt=(d["wm_st_"+c]!=null||I18N.en["wm_st_"+c]!=null)?t("wm_st_"+c,sp):(f.status||{}).text||"";
    el.innerHTML=`<b style="color:${["alarm","gave_up","no_link","not_armed"].includes(c)?"var(--warn)":"var(--ok)"}">${esc(txt)}</b>`; }
  const h=(f&&f.history)||[];
  document.getElementById("wmHist").textContent=h.length?t("wm_hist")+" "+h.slice(-4).reverse().map(x=>hhmm(x.epoch)+" "+t("wm_did_"+x.what)).join(" · "):"";
  if(document.getElementById("wmBoard").checked) wmShowValues(f);
  // with a heating plan (periods) the start times / pause below are not used: say so and point to the plan
  const hasPlan=!!(f&&f.periods&&f.periods.length);
  ["wmBoosts"].forEach(id=>{ const l=document.getElementById(id).closest("label"); if(l) l.style.display=hasPlan?"none":""; });
  // keep-warm settings only mean something with periods
  ["wmRestart"].forEach(id=>{ const l=document.getElementById(id).closest("label"); if(l) l.style.display=hasPlan?"":"none"; });
  const per=((f&&f.periods)||[]).slice().sort((a,b)=>String(a.start||"").localeCompare(String(b.start||"")));   // by time of day
  document.getElementById("wmPeriods").innerHTML=per.length?`<b style="font-size:13px">${esc(t("wm_periods"))}</b> `+per.map(p=>{
      const k=t("wm_k_"+p.kind), tm=(p.kind==="keep"?p.start+"–"+p.end:p.start)+(p.stop_pct?" · "+t("wm_stopat",{p:p.stop_pct}):"");
      return `<span style="display:inline-block;padding:2px 9px;border:1px solid #2b3443;border-radius:10px;font-size:12.5px;margin:2px 4px 2px 0;${p.on===false?"opacity:.45;text-decoration:line-through":""}">${esc((p.name?p.name+" · ":"")+k+" "+tm)}</span>`; }).join("")
    +` <a href="home#plan" style="font-size:13px">${esc(t("wm_per_edit"))}</a>`:"";
  const bl=document.getElementById("wmBoard").closest("label"); if(bl) bl.style.display=hasPlan?"none":"";
  let pn=document.getElementById("wmPlanNote");
  if(!pn){ pn=document.createElement("div"); pn.id="wmPlanNote"; pn.className="note"; pn.style.marginTop="8px"; document.getElementById("wmHist").before(pn); }
  pn.innerHTML=hasPlan?esc(t("wm_plan_note",{n:f.periods.length}))+` <a href="home#plan">${esc(t("wm_plan_link"))}</a>`:"";
}
async function saveWarm(){
  const en=document.getElementById("wmEnabled").checked, board=document.getElementById("wmBoard").checked;
  const nv={stop_after_min:numF("wmAfter"), min_boiler_c:document.getElementById("wmMinC").value.trim()===""?0:numF("wmMinC"),   // empty = off
    keep_restart_c:numF("wmRestart"), pump_c:numF("wmPump")};
  if(!board){ nv.stop_pct=numF("wmStop"); nv.pause_h=numF("wmPause"); }
  const m=document.getElementById("wmMsg");
  if(!allNum(nv)){ m.textContent=t("num_bad"); m.className="savemsg bad"; return; }
  const body={enabled:en,use_board:board,...nv};
  if(!board) body.boosts=document.getElementById("wmBoosts").value.split(/[ ,;]+/).filter(Boolean);
  try{
    const {ok,j}=await api("api/settings",{warm:body});
    m.textContent=ok?"✓ "+t("sch_saved"):(j.msg||t("save_failed")); m.className="savemsg "+(ok?"ok":"bad");
    if(ok){ wmDirty=false; loadSchedule(true); }
  }catch(e){ m.textContent=t("sch_no_server"); m.className="savemsg bad"; }
}

async function wxFindClassic(){

}

let VV=null, vvDirty=false;
function fillVvb(cfg){
  VV=JSON.parse(JSON.stringify(cfg)); vvDirty=false;
  document.getElementById("vvEnabled").checked=!!VV.enabled;
  document.getElementById("vvFs").disabled=!VV.enabled;
  document.getElementById("vvSource").value=VV.source;
  document.getElementById("vvAge").value=VV.max_age_min; document.getElementById("vvSafe").value=VV.safe_c;

function vvHow(){
  document.querySelectorAll("#vvSource option").forEach(o=>o.textContent=t("vv_src_"+o.value));

function renderVvb(f){
  const el=document.getElementById("vvStatus"); if(!el) return;

  else el.innerHTML=`<b style="color:var(--warn)">${esc(t(f.c==null?"vv_none":"vv_stale",{safe:f.safe_c,m:Math.round((f.age_s||0)/60)}))}</b>`;

async function saveVvb(){
  VV.enabled=document.getElementById("vvEnabled").checked; VV.source=document.getElementById("vvSource").value;
  const m=document.getElementById("vvMsg"), nv={max_age_min:numF("vvAge"),safe_c:numF("vvSafe")};
  if(!allNum(nv)){ m.textContent=t("num_bad"); m.className="savemsg bad"; return; }
  Object.assign(VV,nv);
  try{
    const {ok,j}=await api("api/settings",{vvb:{enabled:VV.enabled,source:VV.source,max_age_min:VV.max_age_min,safe_c:VV.safe_c}});
    m.textContent=ok?"✓ "+t("sch_saved"):(j.msg||t("vv_err")); m.className="savemsg "+(ok?"ok":"bad");
    if(ok){ vvDirty=false; loadSchedule(true); }
  }catch(e){ m.textContent=t("sch_no_server"); m.className="savemsg bad"; }
}

function renderSchStatus(f){
  const el=document.getElementById("schStatus"); if(!el) return;
  if(!f||!f.status){ el.textContent="—"; return; }
  const c=f.status.code;
  // the server's detail text only where it adds numbers/reasons
  const detail=["cooldown","pending","max_starts","blocked","running"].includes(c)?" · "+esc(detailText("sd_",f.status)):"";
  el.innerHTML=`<b style="color:${c==="running"?"var(--ok)":(["alarm","blocked"].includes(c)?"var(--warn)":"var(--dim)")}">${esc(t("st_"+c))}</b>`+
    detail+` · ${esc(t("starts_today",{n:f.starts_today}))}`;
}
function fillSchedule(){
  if(!SCH) return;
  document.getElementById("schEnabled").checked=!!SCH.enabled;
  document.getElementById("schFs").disabled=!SCH.enabled;
  const v=(id,x)=>document.getElementById(id).value=x;
  v("schMinOff",SCH.min_off_min); v("schMaxSt",SCH.max_starts_day); v("schShort",SCH.short_run_min);
  v("schAtt",SCH.max_attempts); v("schWait",SCH.retry_wait_s);
  document.getElementById("schOverride").checked=!!SCH.override_waiting;
  renderWins();
}
function renderWins(){
  const el=document.getElementById("schWins"), D=t("days");
  el.innerHTML = SCH.windows.length? SCH.windows.map((w,i)=>
    `<div class="win" data-i="${i}">
      <label class="chk" style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-k="on" ${w.on?"checked":""}>${esc(t("sch_on"))}</label>
      <span class="days">${D.map((d,k)=>`<button type="button" data-day="${k}" class="${w.days.includes(k)?"on":""}">${d}</button>`).join("")}</span>
      <input type="time" data-k="start" value="${w.start}"> – <input type="time" data-k="end" value="${w.end}">
      <button type="button" class="x danger" data-del="1" title="${t("del_title")}">${t("del")||"✕"}</button>
    </div>`).join("") : `<div class="note">—</div>`;
  el.querySelectorAll(".win").forEach(row=>{
    const w=SCH.windows[+row.dataset.i];
    row.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
      const d=+b.dataset.day; w.days = w.days.includes(d)? w.days.filter(x=>x!==d) : [...w.days,d].sort();
      schDirty=true; renderWins();});
    row.querySelector("[data-k=on]").onchange=e=>{w.on=e.target.checked; schDirty=true;};
    row.querySelector("[data-k=start]").onchange=e=>{w.start=e.target.value; schDirty=true;};
    row.querySelector("[data-k=end]").onchange=e=>{w.end=e.target.value; schDirty=true;};
    row.querySelector("[data-del]").onclick=()=>{SCH.windows.splice(+row.dataset.i,1); schDirty=true; renderWins();};
  });
  document.getElementById("schAdd").disabled = SCH.windows.length>=24;
}
function schMsg(txt,cls){ const m=document.getElementById("schMsg"); m.textContent=txt; m.className="savemsg "+(cls||""); }
async function saveSchedule(){
  const n=numF, nv={min_off_min:n("schMinOff"),max_starts_day:n("schMaxSt"),short_run_min:n("schShort"),
    max_attempts:n("schAtt"),retry_wait_s:n("schWait")};
  if(!allNum(nv)){ schMsg(t("num_bad"),"bad"); return; }
  SCH.enabled=document.getElementById("schEnabled").checked;
  Object.assign(SCH,nv,{override_waiting:document.getElementById("schOverride").checked});
  try{
    const {ok,j}=await api("api/settings",{schedule:SCH});
    if(ok){ schDirty=false; schMsg("✓ "+t("sch_saved"),"ok"); loadSchedule(true); }
    else schMsg(j.msg||t("save_failed"),"bad");
  }catch(e){ schMsg(t("sch_no_server"),"bad"); }
}

// =====================================================================  Discoveries tab (auto-generated)
let DISC=null;
async function loadDiscoveries(){
  try{ const r=await fetch("api/insights",{cache:"no-store"}); DISC=await r.json(); }catch(e){ DISC=DISC||{cards:[]}; }
  renderDiscoveries();
}
setInterval(()=>{ if(activeTab==="disc"&&!document.hidden) loadDiscoveries(); }, 300000);
function renderDiscoveries(){
  const head=document.getElementById("discHead"), box=document.getElementById("discCards"); if(!box) return;
  const L2=o=>o&&typeof o==="object"?(o[LANG]||o.en||""):(o||"");
  const cards=(DISC&&DISC.cards)||[];
  head.textContent=cards.length?t("disc_head",{n:fmt(DISC.rows||0,0),t:DISC.generated?new Date(DISC.generated).toLocaleDateString(LOC(),{day:"numeric",month:"short"})+" "+clock(new Date(DISC.generated).getTime()/1000):"—"}):t("disc_none");
  box.innerHTML=cards.map((c,i)=>`<div class="card" style="margin-top:12px"><h3>${esc(L2(c.title))}</h3>
    ${c.chart?`<canvas id="disc${i}" height="190"></canvas>`:""}<div class="note" style="margin-top:6px">${esc(L2(c.text))}</div></div>`).join("");
  cards.forEach((c,i)=>{ if(c.chart) discChart(document.getElementById("disc"+i), c.chart, L2); });
}
// generic drawing for the generated cards: bar, stack (stacked bars) and xy (dots)
function discChart(cv, ch, L2){
  const {c,W,H}=setupCanvas(cv);
  const pal=["#3fb950","#d29922","#58a6ff","#8b949e","#6e7681","#f85149","#bc8cff","#39d0d8"];
