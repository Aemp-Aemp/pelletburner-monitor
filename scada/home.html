<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Home heating</title>
<script>
// theme before first paint: ?theme= (test aid, not saved) > localStorage "burner_theme" > auto
(function(){ var q=new URLSearchParams(location.search).get("theme"), t=null;
  try{ t=localStorage.getItem("burner_theme"); }catch(e){}
  if(q==="light"||q==="dark"||q==="auto") t=q;
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
  // first-start guide: hide the page until the monitor said whether it was set up (no flash of the normal page)
  document.documentElement.classList.add("su-wait"); setTimeout(function(){ document.documentElement.classList.remove("su-wait"); },4000); })();
</script>
<style>
:root{
  --canvas:#ECE4D9; --paper:#FBF7F1; --card:#FFFFFF; --sand:#F4ECE1; --sand2:#EDE3D5; --line:#EAE0D2;
  --ink:#2B2420; --ink2:#6E635A; --ink3:#A39789;
  --ember:#E8692C; --ember2:#F4A04A; --glow:#FFE7D1; --emberText:#B94E1E;
  --rest:#A9A39C; --ok:#3E8E5E; --okSoft:#E5F1E9; --alarm:#CF3B2D; --alarmSoft:#FBE8E3; --amber:#E0962B; --amberSoft:#FCEBD3; --amberText:#A2661A;
  --wood:#8A5E33; --woodSoft:#F5E8D6;
  --heroGlow:#FFE9D6; --alarmGlow:#FDD9D0; --woodGlow:#F8E6CC; --alarmTop:#FFF6F3;
  --track:#F0E7DB; --tick:#E2D7C8; --knob:#FFFFFF; --targetDot:#2B2420; --glowOp:.55;
  --grid:#EFE7DC; --axis:#DDD2C3; --tgt:#B9A995;
  --bPause:#F3EBDF; --bWait:#E9ECEE; --bStart:#FDE3D2; --bStop:#FBE0DA; --bRescue:#FCEBD3; --winTint:#FBF1E6; --winLine:#F0DCC6; --planKeep:#F9DFC2; --planStart:#E6DDF3; --planText:#9A5B1E;
  --normal:#DFEFE4; --flameFill:#FCE3CF; --fanLine:#7D8A92;
  --shadow:0 1px 2px rgba(70,45,20,.05),0 10px 30px rgba(70,45,20,.07);
  --tabOn:#FFFFFF; --langOn:#2B2420; --langOnText:#FFFFFF; --btnPri:#2B2420; --btnPriText:#FFFFFF;
  --scrim:rgba(43,36,32,.35); --tryBg:#FFF6EC; --tryLine:#EBC9A4; --barBg:rgba(251,247,241,.94);
  --font:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* warm dark: same tokens, night palette (auto follows the OS unless light is chosen) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#141110; --paper:#1D1815; --card:#28211D; --sand:#322A24; --sand2:#3A302A; --line:#3A302A;
    --ink:#F2E8DC; --ink2:#B5A898; --ink3:#8A7D70;
    --glow:#4A2A1A; --emberText:#F4A04A; --ok:#6CC08B; --okSoft:#1F3528; --alarm:#EE5A4B; --alarmSoft:#4A221D; --amberSoft:#45331A; --amberText:#F2B65C;
    --wood:#E8BE80; --woodSoft:#3D3023;
    --heroGlow:rgba(232,105,44,.20); --alarmGlow:rgba(207,59,45,.30); --woodGlow:rgba(232,190,128,.15); --alarmTop:#2A1F1C;
    --track:#3A302A; --tick:#4A3E36; --knob:#FFF3E6; --targetDot:#F2E8DC; --glowOp:.9;
    --grid:#342B25; --axis:#4A3E36; --tgt:#8A7D70;
    --bPause:#3A3029; --bWait:#2C3033; --bStart:#4A2E1E; --bStop:#48251F; --bRescue:#45331A; --winTint:#33281F; --winLine:#4A3A2C; --planKeep:#4A321F; --planStart:#352C45; --planText:#F0B97A;
    --normal:#22392A; --flameFill:#4A2E1E; --fanLine:#9AA7AF;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
    --tabOn:#3A302A; --langOn:#F2E8DC; --langOnText:#1D1815; --btnPri:#F2E8DC; --btnPriText:#1D1815;
    --scrim:rgba(0,0,0,.55); --tryBg:#2E2620; --tryLine:#5A4532; --barBg:rgba(29,24,21,.94);
  }
}
:root[data-theme="dark"]{
  --canvas:#141110; --paper:#1D1815; --card:#28211D; --sand:#322A24; --sand2:#3A302A; --line:#3A302A;
  --ink:#F2E8DC; --ink2:#B5A898; --ink3:#8A7D70;
  --glow:#4A2A1A; --emberText:#F4A04A; --ok:#6CC08B; --okSoft:#1F3528; --alarm:#EE5A4B; --alarmSoft:#4A221D; --amberSoft:#45331A; --amberText:#F2B65C;
  --wood:#E8BE80; --woodSoft:#3D3023;
  --heroGlow:rgba(232,105,44,.20); --alarmGlow:rgba(207,59,45,.30); --woodGlow:rgba(232,190,128,.15); --alarmTop:#2A1F1C;
  --track:#3A302A; --tick:#4A3E36; --knob:#FFF3E6; --targetDot:#F2E8DC; --glowOp:.9;
  --grid:#342B25; --axis:#4A3E36; --tgt:#8A7D70;
  --bPause:#3A3029; --bWait:#2C3033; --bStart:#4A2E1E; --bStop:#48251F; --bRescue:#45331A; --winTint:#33281F; --winLine:#4A3A2C; --planKeep:#4A321F; --planStart:#352C45; --planText:#F0B97A;
  --normal:#22392A; --flameFill:#4A2E1E; --fanLine:#9AA7AF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
  --tabOn:#3A302A; --langOn:#F2E8DC; --langOnText:#1D1815; --btnPri:#F2E8DC; --btnPriText:#1D1815;
  --scrim:rgba(0,0,0,.55); --tryBg:#2E2620; --tryLine:#5A4532; --barBg:rgba(29,24,21,.94);
}
/* fire paint for the ring animation (not UI tokens): richer flame on light paper, softer on dark */
:root{
  --fo0:#B32E0C; --fo0a:1;   --fo1:#DC4F18; --fo1a:.96; --fo2:#F08A2C; --fo2a:.6;
  --fm0:#EC5F16; --fm0a:1;   --fm1:#FF9632; --fm1a:.92; --fm2:#FFB24C;
  --fc0:#FFF1C2; --fc1:#FFD271; --fc1a:.9; --fc2:#FFC255;
  --soot:.2; --em1:#D9501A; --em2:#EE7424; --em3:#C2410C; --spk:#EE7424;
  --airCool:#7D8A92; --airCoolA:.85; --airHot:#FFF8EA; --airHotA:.95;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fo0:#C93C14; --fo0a:.95; --fo1:#E8692C; --fo1a:.85; --fo2:#F4A04A; --fo2a:.35;
    --fm0:#F27B2C; --fm0a:1;   --fm1:#FFB24F; --fm1a:.8; --fm2:#FFC86A;
    --fc0:#FFF6DD; --fc1:#FFE1A0; --fc1a:.85; --fc2:#FFD27A;
    --soot:0; --em1:#FFD58A; --em2:#FFB050; --em3:#FF8E3C; --spk:#FFD38A;
    --airCool:#9AA7AF; --airCoolA:.65; --airHot:#FFE9C4; --airHotA:.6;
  }
}
:root[data-theme="dark"]{
  --fo0:#C93C14; --fo0a:.95; --fo1:#E8692C; --fo1a:.85; --fo2:#F4A04A; --fo2a:.35;
  --fm0:#F27B2C; --fm0a:1;   --fm1:#FFB24F; --fm1a:.8; --fm2:#FFC86A;
  --fc0:#FFF6DD; --fc1:#FFE1A0; --fc1a:.85; --fc2:#FFD27A;
  --soot:0; --em1:#FFD58A; --em2:#FFB050; --em3:#FF8E3C; --spk:#FFD38A;
  --airCool:#9AA7AF; --airCoolA:.65; --airHot:#FFE9C4; --airHotA:.6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--canvas)}
body{background:var(--canvas);font-family:var(--font);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1100px;margin:24px auto 40px;background:var(--paper);border-radius:30px;box-shadow:var(--shadow);padding:22px 36px 36px}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink3);font-size:10px;line-height:1.4;text-align:center;opacity:.85}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 60%,var(--ember2),var(--ember) 60%,#B9461C);box-shadow:0 0 0 4px var(--glow)}
.brand i.alarm{background:radial-gradient(circle at 50% 60%,#E8705F,#CF3B2D 60%,#9A2A20);box-shadow:0 0 0 4px var(--alarmSoft)}
.brand i.rest{background:radial-gradient(circle at 50% 60%,#D8D0C6,#A9A39C 60%,#8A847D);box-shadow:0 0 0 4px var(--sand)}
.tabs{display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:999px;align-items:center}
.tabs a{padding:7px 16px;border-radius:999px;font-size:14px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.tabs a.on{background:var(--tabOn);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(60,40,20,.12)}
.tr{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap;justify-content:flex-end}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.live.stale::before{background:var(--alarm)}
.live.wait::before{background:var(--ink3)}
.seg2{display:flex;background:var(--sand);border-radius:999px;padding:3px}
.seg2 button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg2 button.on{background:var(--langOn);color:var(--langOnText)}
.themebtn{border:0;background:var(--sand);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.themebtn svg{width:14px;height:14px}
.classic{font-size:12px;color:var(--ink3);text-decoration:none;border-bottom:1px dashed var(--ink3);white-space:nowrap}

/* common */
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.lbl{font-size:13px;color:var(--ink2);font-weight:500}
.lbl.h{font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 11px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ember{background:var(--glow);color:var(--emberText)}
.chip.alarm{background:var(--alarmSoft);color:var(--alarm)}
.chip.amber{background:var(--amberSoft);color:var(--amberText)}
.chip.wood{background:var(--woodSoft);color:var(--wood)}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.ghost{background:var(--sand);color:var(--ink2)}
.bname{font-size:11px;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin-left:10px}
.h1{font-size:44px;font-weight:650;letter-spacing:-.03em;line-height:1.05}
.lead{font-size:18px;color:var(--ink2)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;border:0}
.btn.pri{background:var(--btnPri);color:var(--btnPriText)}
.btn.emb{background:var(--ember);color:#fff;box-shadow:0 6px 18px rgba(232,105,44,.35)}
.btn.sec{background:var(--sand);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--emberText);font-size:13.5px;font-weight:600;text-decoration:none;background:none;border:0}
.note{font-size:13px;color:var(--ink3)}
.cardh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.meter{height:5px;border-radius:5px;background:var(--sand2);margin-top:10px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--ember2),var(--ember))}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg i.ln{height:3px;border-radius:2px;vertical-align:3px}
svg text{font-family:var(--font)}
.ax{font-size:11.5px;fill:var(--ink3)}
.chart{width:100%;min-height:40px}
.empty{padding:26px 0;text-align:center;color:var(--ink3);font-size:14px}

/* ring */
.ring{position:relative;display:inline-block;max-width:100%}
.ring svg{display:block;overflow:visible;width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink)}
.ring .num{font-weight:300;letter-spacing:-.05em;line-height:.9}
.ring .num sup{font-size:.32em;font-weight:500;letter-spacing:0;vertical-align:top;position:relative;top:.35em;margin-left:2px}
.ring .eb{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.06em;margin-bottom:6px}
.ring .sub{font-size:15px;color:var(--ink2);margin-top:10px}
.ring .sub b{color:var(--ink);font-weight:600}

/* ---------- fire layer in the boiler ring (Settings > This screen > Animations). Everything scoped under .fire / fx- ---------- */
/* the layer sits behind the arc and the centre text; it is created once and kept across re-renders (no animation restarts) */
@property --fxLk{ syntax:"<number>"; inherits:true; initial-value:1; }
@property --fxSwA{ syntax:"<angle>"; inherits:true; initial-value:2deg; }
.ring.fx-host{isolation:isolate}
.ring.fx-host .c{text-shadow:0 0 2px var(--card),0 0 10px var(--card),0 0 18px var(--card)}
.ring.fx-host .c .sub{text-shadow:0 0 1px var(--card),0 0 3px var(--card),0 0 6px var(--card),0 0 12px var(--card),0 0 20px var(--card)}
.fire{position:absolute;inset:0;z-index:-1;pointer-events:none;--spd:1.05s;--emb:3.8s}
.fire>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.fire .fx-glow{opacity:calc(var(--glowOp) * var(--g, 0));transition:opacity 1.6s ease}
.fire .fx-glow.slow{transition:opacity 9s ease-out}
.fire .fx-breath{transform-box:view-box;transform-origin:150px 236px;animation:fx-breath 4.5s ease-in-out infinite alternate}
.fire .fx-flame{transform-box:view-box;transform-origin:150px 238px;transform:scale(.6,.05);opacity:0;
  transition:transform 1.6s cubic-bezier(.3,.7,.3,1),opacity 1.4s ease,--fxLk 1.8s ease,--fxSwA 1.8s ease}
.fire .fx-flame.dying{transition:transform 3.4s ease-in,opacity 3.6s ease-in,--fxLk 1.8s ease,--fxSwA 1.8s ease}
.fire .fx-lean{transform-box:view-box;transform-origin:150px 240px;transition:transform 1.8s ease-in-out}
.fire .fx-embers{transform-box:view-box;transform-origin:150px 238px;transition:transform 1.8s ease-in-out}
.fire .fx-soot{opacity:var(--soot)}
.fire .fx-catchG{transform-box:view-box;transform-origin:150px 238px}
.fire .fx-catchG.catch{animation:fx-catch 1.1s cubic-bezier(.2,.8,.3,1) 1}
.fire .fx-bend{transform-box:view-box;transform-origin:150px 240px;transition:transform 1.4s ease-in-out}
.fire.f-ash .fx-bend{transform:skewX(-7deg) translateX(2px)}
.fire .fx-sway{transform-box:view-box;transform-origin:150px 238px;animation:fx-sway calc(var(--spd) * 3.1) ease-in-out infinite alternate}
.fire .fx-tg{transform-box:fill-box;transform-origin:50% 100%;animation:fx-lickA calc(var(--spd) * var(--k,1)) ease-in-out infinite;animation-delay:var(--dl,0s)}
.fire .fx-tg.b{animation-name:fx-lickB}
.fire .fx-core,.fire .fx-mid{transition:opacity 1.2s ease}
.fire .fx-emb{opacity:0;animation:fx-rise calc(var(--emb) * var(--k,1)) cubic-bezier(.25,.1,.55,1) infinite;animation-delay:var(--dl,0s)}
.fire .fx-emb circle{transform-box:fill-box;transform-origin:center;animation:fx-wob calc(var(--k,1) * 1.25s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.fire .fx-emb.off{display:none}
.fire .fx-emb.fast{animation-duration:calc(2.1s * var(--k,1))}
.fire .fx-emb.fast circle{animation-duration:calc(var(--k,1) * .8s)}
.fire .fx-e1{fill:var(--em1)} .fire .fx-e2{fill:var(--em2)} .fire .fx-e3{fill:var(--em3)}
.fire .fx-bedGlow{opacity:var(--b,0);transition:opacity 1.5s ease}
.fire .fx-bedGlow ellipse{transform-box:fill-box;transform-origin:center;animation:fx-breath 2.6s ease-in-out infinite alternate}
.fire .fx-smoulder{opacity:var(--sm,0);transition:opacity 1.5s ease}
.fire .fx-sm{fill:#FF6A1E;animation:fx-smoulder calc(var(--k,1) * 1.9s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.fire .fx-slotGlow{opacity:var(--b,0);transition:opacity 1.5s ease}
.fire .fx-slotGlow rect{fill:#FF7A2E}
.fire .fx-bellows{opacity:var(--bl,0);transition:opacity 1.8s ease}
.fire .fx-bellows ellipse{transform-box:fill-box;transform-origin:center;animation:fx-breath 1.7s ease-in-out infinite alternate}
.fire.f-cool .fx-bedGlow,.fire.f-cool .fx-smoulder,.fire.f-cool .fx-slotGlow{transition:opacity 14s cubic-bezier(.2,.6,.3,1)}
.fire.f-cool .fx-bedGlow ellipse{animation-duration:5.5s}
.fire.f-cool .fx-sm{animation-duration:calc(var(--k,1) * 4.2s)}
.fire .fx-ign{opacity:0;transition:opacity .8s ease}
.fire.f-ign .fx-ign{opacity:1}
.fire .fx-ign circle{transform-box:fill-box;transform-origin:center;animation:fx-ignPulse 1.3s ease-in-out infinite alternate}
.fire .fx-sparks{display:none}
.fire.f-ign .fx-sparks{display:inline}
.fire .fx-spark{fill:var(--spk);opacity:0;animation:fx-pop .95s ease-out infinite;animation-delay:var(--dl,0s)}
.fire .fx-flash{opacity:0;transform-box:fill-box;transform-origin:center}
.fire .fx-burst{display:none}
.fire.f-catching .fx-burst{display:inline}
.fire.f-catching .fx-flash{animation:fx-flash 1.1s ease-out 1}
.fire .fx-bs{fill:var(--spk);opacity:0;animation:fx-pop 1.2s cubic-bezier(.15,.7,.35,1) 1 both;animation-delay:var(--dl,0s)}
.fire .fx-drops{display:none}
.fire.f-feed .fx-drops{display:inline}
.fire .fx-drop{fill:#B98A55;opacity:0;transform-box:fill-box;transform-origin:center;animation:fx-drop 1.5s cubic-bezier(.5,0,.8,.6) infinite;animation-delay:var(--dl,0s)}
/* ash plate: one slotted disc under the bed, seen from a slight angle */
.fire .fx-discEdge{fill:var(--axis);transition:fill .5s ease}
.fire .fx-discTop{fill:var(--sand2);stroke:var(--ink3);stroke-width:1.2;vector-effect:non-scaling-stroke;transition:stroke .5s ease}
.fire .fx-slots rect{fill:var(--ink3)}
.fire .fx-disc{transform-box:fill-box;transform-origin:center;animation:fx-spin 2.6s linear infinite;animation-play-state:paused}
.fire.f-ash .fx-disc{animation-play-state:running}
.fire.f-ash .fx-discTop{stroke:var(--amber)}
.fire.f-ash .fx-discEdge{fill:var(--amber)}
/* combustion air: the draught the fan makes (three fixed-speed layers, fan_rpm only cross-fades them) */
.fire .fx-lay{opacity:var(--w,0);transition:opacity 1.6s ease,visibility 0s linear 0s}
.fire .fx-lay.z{visibility:hidden;transition:opacity 1.6s ease,visibility 0s linear 1.6s}
.fire .fx-lay path{fill:none;stroke-linecap:round;stroke-dashoffset:100;animation:fx-flow 3.2s linear infinite}
.fire .fx-lay.s path{animation-duration:5.8s}
.fire .fx-lay.m path{animation-duration:3.3s}
.fire .fx-lay.f path{animation-duration:1.9s}
.fire .fx-airLo path{stroke:url(#fx-airCoolG);stroke-width:1.6}
.fire .fx-airHi path{stroke:url(#fx-airHotG);stroke-width:1.3}
.fire .fx-tipG{transform-box:view-box;transform-origin:150px 240px}
.fire.f-ash .fx-tipG{animation:fx-tip 2.6s ease-in-out infinite}
.fire .fx-ashFall{display:none}
.fire.f-ash .fx-ashFall{display:inline}
.fire .fx-ash{fill:var(--rest);opacity:0;animation:fx-fall calc(var(--k,1) * 1.7s) cubic-bezier(.45,0,.9,.7) infinite;animation-delay:var(--dl,0s)}
.fire .fx-ghost{display:none}
.fire .fx-ghost use{fill:var(--ink3)}
@keyframes fx-flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fx-lickA{
  0%{transform:scale(1,1) skewX(0deg)}
  23%{transform:scale(calc(1 - .07*var(--fxLk)),calc(1 + .09*var(--fxLk))) skewX(calc(-3.5deg*var(--fxLk)))}
  51%{transform:scale(calc(1 + .05*var(--fxLk)),calc(1 - .1*var(--fxLk))) skewX(calc(2.5deg*var(--fxLk)))}
  77%{transform:scale(calc(1 - .04*var(--fxLk)),calc(1 + .05*var(--fxLk))) skewX(calc(-1.5deg*var(--fxLk)))}
  100%{transform:scale(1,1) skewX(0deg)}}
@keyframes fx-lickB{
  0%{transform:scale(1,calc(1 - .04*var(--fxLk))) skewX(calc(1deg*var(--fxLk)))}

/* no data / connection lost: freeze at once, grey, faint static silhouette */
.fire.f-nodata *{animation-play-state:paused!important}
.fire.f-nodata .fx-box{filter:grayscale(1);opacity:.62}
.fire.f-nodata .fx-flame,.fire.f-nodata .fx-embers,.fire.f-nodata .fx-sparks,.fire.f-nodata .fx-burst,.fire.f-nodata .fx-flash,
.fire.f-nodata .fx-drops,.fire.f-nodata .fx-ashFall,.fire.f-nodata .fx-glow,.fire.f-nodata .fx-ign,
.fire.f-nodata .fx-bedGlow,.fire.f-nodata .fx-smoulder,.fire.f-nodata .fx-slotGlow,.fire.f-nodata .fx-bellows,.fire.f-nodata .fx-draft{display:none}
.fire.f-nodata .fx-ghost{display:inline;opacity:.5}
.fire.f-nodata .fx-bend,.fire.f-nodata .fx-discTop,.fire.f-nodata .fx-discEdge{transition:none!important}
/* back from no data (or first show): jump straight to the fresh values, never animate from old ones */
.fire.f-snap,.fire.f-snap *{transition:none!important}
/* tab in the background: freeze */
html.fx-hid .fire *{animation-play-state:paused!important}
/* saving work, no visible change: parts that have fully faded out stop moving and are skipped, and the whole layer rests while scrolled out of view */
.fire .fx-idle,.fire .fx-idle *{animation-play-state:paused!important;visibility:hidden!important}
.fire.fx-away *{animation-play-state:paused!important}
.fire .fx-emb.off,.fire .fx-emb.off circle,.fire:not(.f-ign) .fx-spark,.fire:not(.f-feed) .fx-drop,.fire:not(.f-ash) .fx-ash{animation-play-state:paused}
/* the OS asks for less motion: no fire layer at all */
@media (prefers-reduced-motion: reduce){ .fire{display:none} }

html.su-on .wrap,html.su-on .tabbar{display:none}
.setup{min-height:100vh;padding:24px 16px 40px;display:flex;justify-content:center;align-items:flex-start}
.setup[hidden]{display:none}
.su-card{width:100%;max-width:620px;min-width:0;background:var(--paper);border-radius:30px;box-shadow:var(--shadow);padding:26px 30px 28px;margin-top:4vh}
.su-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.su-dots{display:flex;gap:6px;margin:12px 0 22px}
.su-dots i{flex:1;height:5px;border-radius:5px;background:var(--sand2)}
.su-dots i.d{background:var(--ember2)}.su-dots i.on{background:var(--ember)}
.su-card h1{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.su-s{font-size:16px;color:var(--ink2);margin-top:8px;line-height:1.45}
.su-acts{display:flex;gap:10px;margin-top:26px;align-items:center;flex-wrap:wrap}
.su-acts .grow{flex:1}
.su-opts{display:grid;gap:10px;margin-top:18px}
.su-opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.su-opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:14px;line-height:1.35}
.su-opt b{display:block;font-size:16px;color:var(--ink);margin-bottom:2px}
.su-opts.three .su-opt{text-align:center}
.su-opt.on{border:2px solid var(--ember);background:var(--glow)}
.su-conn{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--sand);font-size:15px;line-height:1.45}
.su-conn b{display:flex;align-items:center;gap:10px}
.su-conn b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink3);flex:none}
.su-conn.yes{background:var(--okSoft)}.su-conn.yes b::before{background:var(--ok)}
.su-conn.no{background:var(--amberSoft)}.su-conn.no b::before{background:var(--amber)}
.su-conn p{color:var(--ink2);font-size:14px;margin-top:6px}
.su-f{display:block;margin-top:16px;font-size:13px;color:var(--ink3)}
.su-f b{color:var(--ink);font-size:14.5px}
.su-f .inp{margin-top:6px}
.su-sum{margin-top:18px}
.su-sum div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.su-sum span{color:var(--ink2)}.su-sum b{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.su-card .card{box-shadow:none;border:1px solid var(--line)}

/* phone tab bar */
.tabbar{display:none}
@media (max-width:860px){
  .hero>*,.ahero>*,.phero>*{min-width:0}
  .hero{grid-template-columns:minmax(0,1fr);text-align:center;padding:22px 18px;gap:10px;background:radial-gradient(240px 220px at 50% 150px,var(--heroGlow),transparent 72%),var(--card)}
  .hero .parts,.hero .ctl{justify-content:center}
  .ahero{grid-template-columns:minmax(0,1fr);text-align:center;padding:22px 18px;gap:14px;background:radial-gradient(240px 220px at 50% 140px,var(--alarmGlow),transparent 72%),linear-gradient(180deg,var(--alarmTop),var(--card))}
  .ahero .reas>span{justify-content:center}
  .ahero .checks{text-align:left}
  .phero{grid-template-columns:minmax(0,1fr);text-align:center;padding:22px 18px;gap:12px}
  .phero .ledger{margin-left:auto;margin-right:auto;text-align:left}
  .phero .ctl{justify-content:center}
  .grid3,.grid2,.hist2,#batchRow{grid-template-columns:minmax(0,1fr)!important}
  .h1{font-size:32px}
}
@media (max-width:640px){
  .wrap{margin:0;border-radius:0;padding:12px 16px 104px;box-shadow:none;min-height:100vh}
  .top{margin-bottom:12px;gap:8px}
  .top .tabs{display:none}
  .brand{font-size:14px}
  .tr{gap:6px}
  .stats{gap:8px;margin-top:16px}
  .stat{padding:10px 12px;border-radius:16px;text-align:left}
  .stat .v{font-size:20px}
  .stat .v small{font-size:11px;margin-left:2px}
  .wrap{overflow-x:hidden}
  .card{padding:16px 18px;border-radius:20px}
  .hero,.ahero,.phero{border-radius:24px}
  .lead{font-size:15px}
  .h1{font-size:28px}
  .big{font-size:32px}
  .sec-h h2{font-size:19px}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--barBg);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:40;backdrop-filter:blur(8px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink3);text-decoration:none}
  .tabbar a.on{color:var(--ink);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .setup{padding:0}
  .su-card{border-radius:0;margin:0;min-height:100vh;padding:18px 16px 28px;box-shadow:none}
  .su-card h1{font-size:24px}
  .su-s{font-size:15px}
  .su-acts .btn{padding:12px 16px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast{bottom:96px}
}
</style>
</head>

<script>
"use strict";
window.addEventListener("error",e=>{ try{ document.documentElement.setAttribute("data-jserr",(e.message||"error")+" @"+(e.lineno||"")); }catch(_){} });

/* ==TABLES-BEGIN== made from burner_common.py by tools/sync_pages.py - do not edit here */
const TABLES={
 "states":{"en":["STOPPED","WAITING","STARTING","IGNITION","RUNNING","PAUSE/STOP","ALARM","FIRE RESCUE"],"da":["STOPPET","AFVENTER","OPSTART","OPTÆNDING","DRIFT","PAUSESTOP","ALARM","REDDER BÅL"]},
 "alarm_names":{"en":{"2":"BURNER DISCONNECTED / PELLET SHAFT HOT","4":"STARTUP FAILED","5":"NO FUEL","6":"ASH PLATE","7":"SENSOR NOT MOUNTED (boiler)","8":"SENSOR DEFECT (boiler)","9":"SENSOR NOT MOUNTED (flue)","12":"FAN","13":"FUSE","14":"AUGER CALIBRATION","15":"EXTERNAL IO"},"da":{"2":"BRÆNDER FRAKOBLET / SKAKT VARM","4":"OPTÆNDINGSFEJL","5":"MANGLER BRÆNDSEL","6":"ASKEPLADE","7":"FØLER IKKE MONT. (kedel)","8":"FØLER DEFEKT (kedel)","9":"FØLER IKKE MONT. (røg)","12":"RØGSUGER","13":"SIKRING","14":"SNEGL AFVEJNING","15":"EKSTERN IO"}},
 "alarm_never_auto_reset":[1,2,3,7,8,9,10,11,13,14,15],
 "alarm_auto_reset_allowed":[4,5,6,12],
 "flame_on":17};
/* ==TABLES-END== */
/* ==SHARED-BEGIN== the text of scada/shared.js, copied by tools/sync_pages.py - do not edit here */
// The small helpers both pages use (scada/home.html and scada/dashboard.html). This file is the one source:
// tools/sync_pages.py copies it into the SHARED block of each page, so the pages stay single files.
// LANG ("en" / "da") is the page's own variable.
const LOC=()=>LANG==="da"?"da-DK":"en-GB";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// a number as display text with d decimals (decimal comma in Danish); "—" when there is none
const fmt=(v,d)=>{ if(v==null||isNaN(v)) return "—"; const s=Number(v).toFixed(d).replace(/^-(0(\.0+)?)$/,"$1"); return LANG==="da"?s.replace(".",","):s; };
// the middle value (the mean of the two middle ones for an even count); null for an empty list
const median=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
// a clock time "17:15" (sec: "17:15:01"), the same style in both languages - the style the time fields use
const clock=(ep,sec)=>{ if(!ep) return "—"; const d=new Date(ep*1000), p=n=>String(n).padStart(2,"0");
  return p(d.getHours())+":"+p(d.getMinutes())+(sec?":"+p(d.getSeconds()):""); };
// Chart axes with round steps (1, 2, 5 x 10^n), so every tick label is exact and no half steps.
const niceStep=v=>{ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; };
// [from, to, step] with 4 steps that cover lo..hi; pos = never below 0 (all values are positive)
const niceAxis=(lo,hi,pos)=>{ if(pos) lo=0; if(hi-lo<1e-9){ lo-=1; hi+=1; } let st=niceStep((hi-lo)/4), a=0;
  for(let k=0;k<20;k++){ a=Math.floor(lo/st)*st; if(pos&&a<0) a=0; if(a+4*st>=hi) break; st=niceStep(st*1.01); } return [a,a+4*st,st]; };
// decimals a tick label needs for that step
const axisDec=st=>st<0.1?2:(Math.abs(st-Math.round(st))>1e-9?1:0);
// GET (no body) or POST (JSON body) to the monitor -> {ok, j}
const api=(path,body)=>fetch(path, body===undefined?{cache:"no-cache"}:
  {method:"POST",headers:{"Content-Type":"application/json","X-Burner":"1"},body:JSON.stringify(body)})
  .then(r=>r.json().then(j=>({ok:r.ok,j})));

const LH_TXT={
 en:{title:"Trouble lighting?", ro:"This card only reads; it never changes a boiler setting.",

  m_short:"The lighting timeout is short. The boiler may give up before the pellets catch.",
  blind:"The monitor cannot read the fan speed points (BLÆSER YDELSE) or the service menu. Look at them on the boiler's screen.",

  s1:"Clean the burner pot and its air holes, and empty the ash.",
  s2:"Wipe the flame sensor glass. The boiler only sees the fire through it.",
  s3:"Check the igniter: it must get hot. Test it on the boiler: MONTØR → AVANCERET → TEST MENU → OUTPUTS → TÆNDER.",
  s4:"Use dry pellets. Damp pellets light badly.",
  s5:"A boiler type change, and most likely a software upgrade too, puts the boiler back on factory settings. Compare with the table above and put your old values back: MONTØR → OPTÆNDING.",
  s6:"Soot or coarse ash as well? Look at the fan: MONTØR → SUGEINDSTILLINGER → BLÆSER YDELSE. The 30 % point is 500 rpm from the factory. That gave too little air on one 15 kW boiler; 1200 rpm worked there. (The rpm points and the 500 rpm factory value are from software 1.40 on the 10 and 15 kW types.)",
  s7:"Then the lighting settings in MONTØR → OPTÆNDING. Write the old value down, change one setting, and watch the next 3 starts here. Start with the start fuel (TÆNDBRÆNDSEL).",
  s7_sync:"The monitor's settings sync is on: it puts its saved value back. Change the value on the page instead, or turn the sync off.",
  s8:"Still bad? Press Copy lighting report and paste it where you ask for help.",
  copy:"Copy lighting report", copied:"Copied", copy_note:"The report includes your start times.", guide:"Guide: after a boiler software upgrade", open:"Trouble lighting? See what to try",
  r_title:"Lighting report (pellet boiler monitor {v})", r_set:"Lighting settings (now / factory):", r_starts:"Last {n} starts (newest first):",
  r_none:"No starts recorded yet.", r_lit:"lit, {a} min to flame", r_lit0:"lit", r_fail:"did not light", r_fail_a:"did not light (alarm {a})", r_stop:"stopped",
  r_cfg:"start fuel {a} s, max doses {b}", r_blind:"Not read by the monitor: fan speed points (BLÆSER YDELSE), service menu.", r_marks:"* = not the factory value, ! = worth a look"},
 da:{title:"Problemer med optænding?", ro:"Dette kort læser kun; det ændrer aldrig en indstilling på kedlen.",
  v_ok:"Tænder fint: ca. {a} min til flamme i de seneste {n} starter.", v_ok1:"Én start tændte ikke.",
  v_slow:"Tænder langsomt: ca. {a} min til flamme i de seneste {n} starter.",
  v_fails:"Tænder ofte ikke: {a} af de seneste {n} starter tændte ikke.",
  v_few:"For få starter endnu til at sige, hvordan den tænder.",
  set_h:"Kedlens indstillinger for optænding", c_set:"Indstilling", c_now:"Nu", c_fac:"Fabrik", c_ref:"Én 15 kW kedel",
  n_014:"Tændbrændsel (TÆNDBRÆNDSEL)", n_015:"Luft ved optænding (TÆND LUFT)", n_017:"Timeout for optænding (TIMEOUT)",
  n_018:"Ekstra doser, højst (MAX DOSER)", n_001:"Brændsel (BRÆNDSEL KG/T)", n_035:"PID P",

  fac_note:"Fabrik: kedlens egne værdier for denne software og kedeltype. Én 15 kW kedel: det, der tændte på 3–5 minutter dér. Det er et eksempel, ikke det eneste rigtige svar.",

  s1:"Rens herden og dens lufthuller, og tøm asken.",

  s5:"Et skift af kedeltype, og højst sandsynligt også en softwareopdatering, sætter kedlen tilbage til fabriksindstillinger. Sammenlign med tabellen ovenfor, og sæt dine gamle værdier ind igen: MONTØR → OPTÆNDING.",
  s6:"Også sod eller grov aske? Se på røgsugeren: MONTØR → SUGEINDSTILLINGER → BLÆSER YDELSE. Punktet ved 30 % er 500 o/min fra fabrikken. Det gav for lidt luft på én 15 kW kedel; 1200 o/min virkede dér. (Omdrejningspunkterne og fabriksværdien 500 o/min er fra software 1.40 på 10 og 15 kW typerne.)",

  s7_sync:"Monitorens indstillingssynkronisering er slået til: den sætter sin gemte værdi tilbage. Ændr værdien på siden i stedet, eller slå synkroniseringen fra.",
  s8:"Stadig dårligt? Tryk Kopiér optændingsrapport, og sæt den ind dér, hvor du spørger om hjælp.",
  copy:"Kopiér optændingsrapport", copied:"Kopieret", copy_note:"Rapporten indeholder dine starttidspunkter.", guide:"Guide: efter en softwareopdatering af kedlen", open:"Problemer med optænding? Se hvad du kan prøve",

  r_cfg:"tændbrændsel {a} s, max doser {b}", r_blind:"Aflæses ikke af monitoren: røgsugerens omdrejninger (BLÆSER YDELSE), servicemenuen.", r_marks:"* = ikke fabriksværdien, ! = værd at se på"}};
const lhT=(k,p)=>{ let s=(LH_TXT[LANG]||LH_TXT.en)[k]; if(s==null) s=k; for(const x in (p||{})) s=s.split("{"+x+"}").join(p[x]); return s; };
const LH_KW={0:"10 kW",1:"15 kW",2:"25 kW"};
let LH_OPEN=null;                 // the card: null = open by itself when lighting is slow or fails; true/false = the user's choice
// a setting's value as text: seconds, %, kg/h (the boiler's screen shows the fuel rate in kg/h)
const lhVal=(id,v)=>v==null?"–":id==="001"?fmt(v/1000,1)+" kg/h":id==="035"?fmt(v,1):fmt(v,0)+({"014":" s","015":" %","017":" s"}[id]||"");
const lhBad=h=>!!(h&&h.verdict&&(h.verdict.k==="slow"||h.verdict.k==="fails"));
function lhVerdict(h){
  const v=(h&&h.verdict)||{k:"few"};
  if(v.k==="fails") return lhT("v_fails",{a:v.failed,n:v.n});
  if(v.k==="slow") return lhT("v_slow",{a:fmt(v.min,1),n:v.n});
  if(v.k==="ok"&&v.min!=null) return lhT("v_ok",{a:fmt(v.min,1),n:v.n})+(v.failed===1?" "+lhT("v_ok1"):"");
  return lhT("v_few");
}
const lhBoiler=h=>lhT("boiler",{m:h.type!=null?LH_KW[h.type]:lhT("type_none"),v:h.sw||lhT("sw_none")});
// the inside of the card. c = the page's colours {warn, dim, line}, guide = the link to the guide section
function lhHTML(h,c,guide){
  if(!h) return "";
  const bad=lhBad(h);
  return `<details id="lhDet"${(LH_OPEN==null?bad:LH_OPEN)?" open":""}><summary style="cursor:pointer"><b id="lhTitle">${esc(lhT("title"))}</b> <span id="lhVerdict" style="color:${bad?c.warn:c.dim}">${esc(lhVerdict(h))}</span></summary>
    ${lhBody(h,c,guide)}</details>`;
}
// the inside of the card without its fold: the settings table, what to try, Copy lighting report (also used inside the
// Time to flame row of Burner health on /home)
function lhBody(h,c,guide){
  if(!h) return "";
  const rows=h.rows||[], any=rows.some(r=>r.now!=null), td=`padding:6px 8px 6px 0;border-bottom:1px solid ${c.line};text-align:left;vertical-align:top`;
  const notes=[...new Set(rows.filter(r=>r.mark&&r.mark!=="diff"&&r.mark!=="unused").map(r=>r.mark))];
  const nm=r=>esc(lhT("n_"+r.id))+(r.mark==="unused"?` <span style="color:${c.dim}">(${esc(lhT("m_unused"))})</span>`:"");
  const mk=r=>!r.mark||r.mark==="unused"?"":r.mark==="diff"?` <span title="${esc(lhT("m_diff"))}" style="color:${c.dim}">●</span>`:` <b style="color:${c.warn}">!</b>`;
  return `<p style="margin:12px 0 6px"><b>${esc(lhT("set_h"))}</b> <span style="color:${c.dim}">${esc(lhBoiler(h))}</span></p>
    ${any?`<div style="overflow-x:auto"><table id="lhTable" style="width:100%;border-collapse:collapse;font-size:14px"><tr>${["c_set","c_now","c_fac","c_ref"].map(k=>`<th style="${td};color:${c.dim};font-weight:600">${esc(lhT(k))}</th>`).join("")}</tr>
      ${rows.map(r=>`<tr data-id="${esc(r.id)}"${r.mark?` data-mark="${esc(r.mark)}"`:""}><td style="${td}">${nm(r)}</td><td style="${td};white-space:nowrap"><b>${esc(lhVal(r.id,r.now))}</b>${mk(r)}</td><td style="${td};white-space:nowrap">${esc(lhVal(r.id,r.fac))}</td><td style="${td};white-space:nowrap">${esc(lhVal(r.id,r.ref))}</td></tr>`).join("")}</table></div>
    ${notes.map(m=>`<p style="margin:8px 0 0;color:${c.warn}"><b>!</b> ${esc(lhT("m_"+m))}</p>`).join("")}
    <p style="margin:8px 0 0;color:${c.dim};font-size:13px">● ${esc(lhT("m_diff"))}. ${esc(lhT("fac_note"))}${h.sw&&h.sw_known!==false?"":" "+esc(lhT("sw_note"))}<br>${esc(lhT("blind"))}</p>`
    :`<p style="margin:0;color:${c.dim}">${esc(lhT("no_cfg"))}</p>`}
    <p style="margin:14px 0 4px"><b>${esc(lhT("try_h"))}</b></p>
    <ol id="lhSteps" style="margin:0;padding-left:22px;line-height:1.5">${[1,2,3,4,5,6,7,8].map(i=>`<li style="margin-top:4px">${esc(lhT("s"+i))}${i===7&&h.sync?" "+esc(lhT("s7_sync")):""}</li>`).join("")}</ol>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px"><button type="button" class="btn sec" data-lh="copy">${esc(lhT("copy"))}</button>
      <a class="link" href="${esc(guide)}" target="_blank" rel="noopener">${esc(lhT("guide"))}</a></div>
    <p id="lhCopyNote" style="margin:6px 0 0;color:${c.dim};font-size:13px">${esc(lhT("copy_note"))}</p>
    <p style="margin:10px 0 0;color:${c.dim};font-size:13px">${esc(lhT("ro"))}</p>`;
}
// the plain text for the clipboard: boiler type, software, settings, the last starts, the monitor's version.
// Nothing personal: no names, addresses, topics, place or pellet batch names.
function lhReport(h,ver){
  const p=n=>String(n).padStart(2,"0"), when=e=>{ const d=new Date(e*1000); return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes()); };
  const L=[lhT("r_title",{v:ver||"?"}), lhBoiler(h), lhVerdict(h), "", lhT("r_set")];
  (h.rows||[]).forEach(r=>L.push("- "+lhT("n_"+r.id)+": "+lhVal(r.id,r.now)+" / "+lhVal(r.id,r.fac)+(r.mark==="unused"?"  ("+lhT("m_unused")+")":r.mark&&r.mark!=="diff"?"  !":r.mark?"  *":"")));
  if((h.rows||[]).some(r=>r.mark&&r.mark!=="unused")) L.push(lhT("r_marks"));
  L.push(lhT("r_blind"));
  if(!(h.sw&&h.sw_known!==false)) L.push(lhT("sw_note"));
  L.push("");
  const st=h.starts||[];
  L.push(st.length?lhT("r_starts",{n:st.length}):lhT("r_none"));
  st.forEach((s,i)=>{ const res=s.result==="ok"?(s.flame_min!=null?lhT("r_lit",{a:fmt(s.flame_min,1)}):lhT("r_lit0")):
      s.result==="failed"?(s.alarm?lhT("r_fail_a",{a:s.alarm}):lhT("r_fail")):lhT("r_stop");
    L.push((i+1)+". "+(s.epoch?when(s.epoch)+"  ":"")+res+(s.start_fuel!=null&&s.max_doses!=null?"  ("+lhT("r_cfg",{a:s.start_fuel,b:s.max_doses})+")":"")); });
  return L.join("\n");
}
// copy text; the pages are plain http on the home network, so there is a fallback for browsers without clipboard access
function lhCopy(txt,btn){
  const done=()=>{ if(!btn) return; btn.textContent=lhT("copied"); setTimeout(()=>{ btn.textContent=lhT("copy"); },2000); };
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(txt).then(done).catch(()=>{}); return; }
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ if(document.execCommand("copy")) done(); }catch(e){} ta.remove();
}

// ---- fire rescues: [[epoch, "ok" / "failed" / "stopped" / null], ...] newest first
const rsOutcome=o=>bhT("rs_"+(o||"null"));
// the /classic suggestion and the /home detail: when, and whether the boiler relit it. p = the server's numbers
// (n, days, from, last, ok), "this period" said in words
function rescText(p){
  const last=(p&&p.last)||[], n=(p&&p.n)||0;
  if(n===1&&last.length) return bhT("rs_one",{w:bhWhen(last[0][0]),o:rsOutcome(last[0][1])})+" "+bhT("rs_advice");
  const from=p&&p.from?new Date(p.from+"T12:00").toLocaleDateString(LOC(),{day:"numeric",month:"short"}):"—";
  return bhT("rs_many",{n,d:(p&&p.days)||"?",from})+" "+last.map(x=>bhWhen(x[0])+" ("+rsOutcome(x[1])+")").join("; ")+". "+bhT("rs_advice");
}
// the list of times for the Burner health detail. c = the page's colours {warn, dim, line}

const sentenceCase=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

// ---- the last starts with the settings changes between them, and the lighting settings compared (api/ignitions:
// records, by_settings, cfg_changes). Stacked rows, so it fits a phone. by = the page's "started by" words for a record.
function startsHTML(ign,c,by,n){
  n=n||10;
  const recs=((ign&&ign.records)||[]).slice(-n).reverse(), ch=((ign&&ign.cfg_changes)||[]).slice();
  if(!recs.length) return `<p style="margin:0;color:${c.dim}">${esc(bhT("st_none"))}</p>`;
  const mark=rows=>{ const t0=rows[0].time; return `<div class="stMark" style="padding:6px 0;border-top:1px solid ${c.line};color:${c.warn};font-size:14px">▲ ${esc(bhWhen(t0))} ${esc(rows.map(ccChange).join(", "))}</div>`; };
  // the changes after the newest start go first, then between each start and the one before it
  const take=(a,b)=>{ const got=ch.filter(r=>r.time>=a&&r.time<b); if(!got.length) return "";
    const g={}; got.forEach(r=>{ const k=Math.round(r.time/60); (g[k]=g[k]||[]).push(r); });
    return Object.keys(g).sort((x,y)=>y-x).map(k=>mark(g[k])).join(""); };
  let h=`<p style="margin:0 0 4px"><b>${esc(bhT("st_h",{n:recs.length}))}</b></p><div id="stList">`, anyRes=false;
  recs.forEach((r,i)=>{
    h+=take(r.epoch, i?recs[i-1].epoch:Infinity);
    const res=r.resumed?"resumed":r.relight&&r.result==="ok"?"relight":r.result; if(r.resumed) anyRes=true;
    const col=res==="ok"||res==="relight"?c.ok||c.dim:res==="failed"?c.warn:c.dim, s=by?by(r):"";
    const bits=[s?bhT("st_by",{s}):"", r.flame_min!=null&&!r.resumed?bhT("st_flame",{a:fmt(r.flame_min,1)}):"",
      r.result==="ok"&&r.minutes!=null?bhT("st_full",{a:fmt(r.minutes,1)}):"", r.off_h!=null?bhT("st_off",{a:fmt(r.off_h,1)}):""].filter(Boolean);
    h+=`<div class="stRow" data-res="${esc(res)}" style="padding:7px 0;border-top:1px solid ${c.line}"><b style="font-weight:600">${esc(bhWhen(r.epoch))}</b> · <span style="color:${col}">${esc(bhT("st_r_"+res))}${r.alarm?" ("+esc(bhT("st_alarm",{a:r.alarm}))+")":""}</span>
      ${bits.length?`<br><span style="color:${c.dim};font-size:14px">${esc(bits.join(" · "))}</span>`:""}</div>`; });
  h+=`</div>`;                                       // changes before the oldest start shown are left out
  if(anyRes) h+=`<p style="margin:6px 0 0;color:${c.dim};font-size:13px">${esc(bhT("st_resumed_note"))}</p>`;
  return h+cfgCmpHTML(ign,c);
}
// the lighting settings compared: per combination how many starts, how many lit, typical time to flame and to full heat
function cfgCmpHTML(ign,c){
  const S=(ign&&ign.by_settings)||[];
  let h=`<p style="margin:14px 0 4px"><b>${esc(bhT("st_cfg_h"))}</b></p>`;
  if(!S.length) h+=`<p style="margin:0;color:${c.dim}">—</p>`;
  h+=`<div id="cfgCmp">`+S.map(s=>{ const cf=s.cfg||{}, name=Object.keys(cf).map(k=>{ const [nm,u]=ccParts(k); return nm+" "+ccNum(cf[k])+(u?" "+u:""); }).join(", ")||"—";
    return `<div class="cfgRow"${s.now?' data-now="1"':""} style="padding:7px 0;border-top:1px solid ${c.line}"><b style="font-weight:600">${esc(name)}</b>${s.now?` <span style="color:${c.ok||c.dim};font-weight:600">● ${esc(bhT("st_cfg_now"))}</span>`:""}
      <br><span style="color:${c.dim};font-size:14px">${esc([bhT("st_cfg_n",{n:s.n,ok:s.ok}), s.flame_min!=null?bhT("st_cfg_flame",{a:fmt(s.flame_min,1)}):"", s.median_min!=null?bhT("st_cfg_full",{a:fmt(s.median_min,1)}):""].filter(Boolean).join(" · "))}</span></div>`; }).join("")+`</div>`;
  if(S.length===1) h+=`<p style="margin:6px 0 0;color:${c.dim};font-size:13px">${esc(bhT("st_cfg_none"))}</p>`;
  return h+`<p style="margin:6px 0 0;color:${c.dim};font-size:13px">${esc(bhT("st_cfg_note"))}</p>`;
}

// ---- the flame sensor per power band (api/optimiser "lux"): learned so far, or usual against now
function luxHTML(lx,c){
  if(!lx) return "";
  if(lx.status==="no_field") return `<p style="margin:0;color:${c.dim}">${esc(bhT("fs_nofield"))}</p>`;
  const B=lx.bands||{}, nm=lx.need_min||30, nb=lx.need_burns||3;
  const row=k=>{ const b=B[k]||{}; let s, warn=false;
    if(!b.n) s=bhT("fs_none");
    else if(b.learning) s=bhT("fs_learn",{m:Math.min(b.min||0,nm),nm,b:Math.min(b.burns||0,nb),nb});
    else { warn=(b.drop_pct||0)>=10; s=bhT("fs_ready",{a:fmt(b.baseline,0),c:fmt(b.current,0)})+" "+(warn?bhT("fs_drop",{p:fmt(b.drop_pct,0)}):bhT("fs_same")); }
    return `<div class="fsRow" data-band="${k}" style="padding:7px 0;border-top:1px solid ${c.line}"><b style="font-weight:600">${esc(bhT("fs_band_"+k))}</b><br><span style="color:${warn?c.warn:c.dim};font-size:14px">${esc(s)}</span></div>`; };
  return `<p style="margin:0 0 4px"><b>${esc(bhT("fs_h"))}</b></p><div id="fsBands">${["low","mid","high"].map(row).join("")}</div>
    <p style="margin:8px 0 0;color:${c.dim};font-size:13px">${esc(bhT("fs_how",{nm,nb}))}${lx.reset_epoch?" "+esc(bhT("fs_cleaned",{d:bhWhen(lx.reset_epoch)})):""}</p>`;
}

const updT=(k,v)=>String((UPD_TXT[LANG]||UPD_TXT.en)[k]||"").replace(/\{(\w+)\}/g,(m,x)=>v&&v[x]!=null?v[x]:"");
let UPD=null, UPD_BUSY=false, UPD_TIMER=0, UPD_WATCH=0, UPD_KEY0=null;       // the last api/update answer (null = no updater here); still at work?
// the words for the state; "" when there is no updater on this machine
function updStateText(){ const v=UPD&&UPD.view; if(!v) return ""; return updT(v.key,v)+(v.why?" "+updT("why_"+v.why,v):""); }
// the inside of the card: version, state, buttons (data-upd = check / retry / back), the short rule.
// cls = the page's own button classes [main, second]
function updCardHTML(cls){ const v=UPD&&UPD.view; if(!v) return "";
  const b=(what,label,c)=>`<button type="button" class="${c}" data-upd="${what}">${esc(label)}</button>`;
  let h=`<div style="font-weight:700">${esc(updT("title"))}</div><div style="margin-top:4px;opacity:.75">${esc(updT("ver",v))}</div>`+
    `<div id="updState" data-key="${esc(v.key)}" aria-live="polite" style="margin-top:10px;font-weight:600">${v.busy?"⏳ ":""}${esc(updStateText())}</div>`+
    `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px">`;
  if(v.btn) h+=b(v.btn==="retry"?"retry":v.btn==="install"?"install":"check",updT("btn_"+v.btn,v),cls[0]);
  if(v.back) h+=b("back",updT("btn_back",{prev:v.back}),cls[1]);
  h+=`</div>`;
  if(!v.busy) h+=`<div style="margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px">`+
    `<span>${esc(updT(v.auto?"auto_on":"auto_off"))}</span>`+b(v.auto?"auto-off":"auto-on",updT(v.auto?"btn_auto_off":"btn_auto_on"),cls[1])+`</div>`;
  return h+`<div style="margin-top:12px;font-size:13px;opacity:.75">${esc(updT("note"))}</div>`; }
// Reads the state and draws it (the page's updDraw). While the updater works it asks again every 3 s; the monitor
// restarts in the middle of an update, so a failed read keeps the last state and tries again.
async function updLoad(){ clearTimeout(UPD_TIMER);
  let ok=true;
  try{ const {j}=await api("api/update"); UPD=j&&j.current&&j.view?j:null; }catch(e){ ok=false; }
  if(ok){ const v=UPD&&UPD.view, busy=!!(v&&v.busy);
    // the version changed under the page: load the page of the version that runs now (it shows the same result)
    // also right after a press (UPD_WATCH): the updater may pick the request up a moment after the first read
    const watching=Date.now()<UPD_WATCH;
    if(!busy&&v&&["updated","rolled_back","went_back"].includes(v.key)&&(UPD_BUSY||(watching&&v.key!==UPD_KEY0))){
      UPD_WATCH=0; setTimeout(()=>location.reload(),4000); }
    UPD_BUSY=busy; }
  updDraw();
  if(UPD_BUSY||Date.now()<UPD_WATCH) UPD_TIMER=setTimeout(updLoad,3000); }
// a button was pressed: what = check / retry / back. Only that word is sent. -> true when the Pi took the request
async function updAsk(what){ let ok=false;
  UPD_KEY0=UPD&&UPD.view?UPD.view.key:null; UPD_WATCH=Date.now()+120000;   // keep reading for 2 min after a press
  try{ ok=(await api("api/update/"+what,{})).ok; }catch(e){}
  await updLoad(); return ok; }

function runs(rows, key, gapS, getter){
  const out=[]; let cur=[], last=null;
  rows.forEach(r=>{ const v=getter?getter(r):r[key];
    if(v==null||isNaN(v)){ if(cur.length) out.push(cur); cur=[]; last=null; return; }
    if(last!=null && r.epoch-last>gapS){ if(cur.length) out.push(cur); cur=[]; }
    cur.push(r); last=r.epoch; });

function stateSegs(rows, t0, t1, gapS){

  rows.forEach(r=>{ if(r.epoch<t0||r.epoch>t1||r.state==null) return;
    if(cur && r.epoch-cur.e>gapS){ out.push(cur); cur=null; }
    if(cur && r.state===cur.s){ cur.e=r.epoch; return; }
    if(cur){ cur.e=r.epoch; out.push(cur); }

function windowIntervals(t0,t1){
  const sch=SETS&&SETS.settings&&SETS.settings.schedule; if(!sch||!sch.enabled||!Array.isArray(sch.windows)) return [];
  const out=[], mins=x=>{const p=String(x).split(":"); return (+p[0])*60+(+p[1]||0);};
  for(let d=-2; d<=0; d++){
    const day=new Date(t1*1000); day.setHours(0,0,0,0); day.setDate(day.getDate()+d);
    const wd=(day.getDay()+6)%7, base=day.getTime()/1000;
    sch.windows.forEach(w=>{ if(!w.on||!(w.days||[]).includes(wd)) return;
      const a=mins(w.start), b=mins(w.end); const s=base+a*60, e=base+(b>a?b:b+1440)*60;
      if(e>t0 && s<t1) out.push([Math.max(t0,s),Math.min(t1,e)]); });

}

function fxGraft(hw,tmp,oRing,nRing){

  for(let n=nRing;n&&n!==tmp;n=n.parentNode) pn.push(n);
  if(po.length!==pn.length||po.some((n,i)=>!pn[i]||n.tagName!==pn[i].tagName)) return false;
  po.push(hw); pn.push(tmp);
  for(let i=po.length-1;i>=1;i--){
    const O=po[i], N=pn[i], oc=po[i-1], nc=pn[i-1];
    if(i<po.length-1) fxAttrs(O,N);
    [...O.childNodes].forEach(c=>{ if(c!==oc) c.remove(); });
    let before=true; [...N.childNodes].forEach(c=>{ if(c===nc){ before=false; return; } if(before) O.insertBefore(c,oc); else O.appendChild(c); });

  [...nRing.childNodes].forEach(c=>oRing.appendChild(c));

}

// How the plan works out: was it warm in time, and what each period costs. The server works both out from the

const insData=id=>{ const c=((INS&&INS.cards)||[]).find(x=>x.id===id); return c&&c.data?c.data:null; };
function warmInHTML(){

    <div class="leg" style="margin-top:10px"><span><i style="background:var(--okSoft);border:1px solid var(--ok)"></i>${esc(t("wi_lg_ok"))}</span>${made<st.length?`<span><i style="background:var(--amberSoft);border:1px solid var(--amber)"></i>${esc(t("wi_lg_late"))}</span>`:""}</div>

function perPeriodHTML(){

// the boiler's own minimum mode (MINIMUMDRIFT) seems on: the monitor saw it burn out by itself (DRIFT -> WAITING).

  if(f==="stop_pct"){ const v=parseInt(e.target.value,10); if(isNaN(v)) delete p.stop_pct; else p.stop_pct=v; planDirty(); } });

  return W.lead_now!=null&&bc!=null?t("pl_warm_note",{m:W.lead_now,c:fmt(bc,0)})+(W.learned?" "+t(W.learned===1?"pl_learned1":"pl_learned",{n:W.learned}):" "+t("pl_learning")):t("pl_warm_note0"); }
// a Just start period is one start time; its end is only the window in which the start may be retried (30 min)
function addMin(hm,m){ const [h,mm]=hm.split(":").map(Number), x=((h*60+mm+m)%1440+1440)%1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }

document.addEventListener("click",async e=>{
  if(!PLAN||!e.target.closest("#v-plan")) return;

  const k=e.target.closest("[data-k]"); if(k&&r){ const p=PLAN.periods[+r.dataset.i]; p.kind=k.dataset.k;
    if(p.kind!=="keep") p.end=addMin(p.start,30); else if(p.end===addMin(p.start,30)) p.end=addMin(p.start,120);

  const d=e.target.closest("[data-day]"); if(d&&r){ const p=PLAN.periods[+r.dataset.i], n=+d.dataset.day;

  const del=e.target.closest("[data-del]"); if(del){ if(await askConfirm(t("pl_del_q"),t("pl_del"))){ PLAN.periods.splice(+del.dataset.del,1); planDirty(); renderPlan(); } return; }
  if(e.target.closest("#plAdd")){ if(PLAN.periods.length>=8){ toast(t("pl_max")); return; }
    PLAN.periods.push({name:"",start:"12:00",end:"13:00",days:[0,1,2,3,4,5,6],kind:"keep",on:true}); planDirty(); renderPlan(); return; }
  if(e.target.closest("#plSave")){
    if(PLAN.periods.some(p=>!p.days.length||p.start===p.end)){ toast(t("pl_bad")); return; }
    PLAN.periods.forEach(p=>{ if(p.kind!=="keep") p.end=addMin(p.start,30); });
    const body={warm:{enabled:PLAN.enabled, periods:PLAN.periods}};
    if(PLAN.fresh) body.warm.pause_h=0;                  // a first plan: start again only at the next period
    try{ const {ok,j}=await api("api/settings",body);
      if(ok){ PLAN_DIRTY=false; toast(t("saved")); SETS=Object.assign({},SETS,{settings:j.settings}); PLAN=null; await pollStatus(); renderTab(); loadSlow(); }
      else toast(saveFail(j,t("save_fail")+" "+((j&&j.msg)||""))); }catch(err){ toast(t("save_fail")); } }
});

// ============================================================ Settings: one field list
// Every typed setting is one line in FIELDS: where it is kept in the monitor's settings ("section.key"), its kind,
// limits, unit, label and help text. fRow() draws a field from it. On the Settings pages a field is saved at once
// (fSave); the first-start guide and the ask-once dialog draw the same fields in "form" mode (fa = the attribute
// their own code reads) and save with their own button. So the limits and the texts are the same everywhere.
const FIELDS={
  "warm.enabled":{kind:"sw",lbl:"set_heat_on",help:"set_heat_on_s",ask:"st_q_plan",id:"setPlanOn"},
  "warm.stop_pct":{kind:"num",min:10,max:100,unit:"%",lbl:"pl_stop",help:"st_stop_w",id:"plStop"},
  "warm.min_boiler_c":{kind:"num",min:0,max:60,unit:"°C",lbl:"pl_min_c",id:"plMinC",off:0},   // off: this value shows as "off" (empty field)
  "warm.stop_after_min":{kind:"num",min:0,max:60,unit:"min",lbl:"set_after",id:"plAfter"},
  "warm.keep_restart_c":{kind:"num",min:1,max:30,unit:"°C",lbl:"pl_restart",id:"plRestart"},
  "warm.pause_h":{kind:"num",min:0,max:48,unit:"u_h",lbl:"pl_pause",id:"plPause"},
  "setup.boiler_kw":{kind:"pick",opts:[10,15,25],unit:"kW",lbl:"su_size",help:"su_size_w",fa:"data-sukw"},
  "controller_info.sw":{kind:"text",re:/^\d{1,2}(\.\d{1,3}){0,3}$/,err:"st_e_sw",mode:"decimal",opt:1,lbl:"s2_q_sw",help:"s2_q_sw_w",fa:'data-ci="sw"'},
  "controller_info.min_pct":{kind:"num",min:1,max:100,unit:"%",opt:1,lbl:"s2_q_min",help:"s2_q_min_w",fa:'data-ci="min_pct"'},
  "controller_info.fan100_rpm":{kind:"num",min:300,max:5000,unit:"u_rpm",opt:1,lbl:"s2_q_fan",help:"s2_q_fan_w",fa:'data-ci="fan100_rpm"'},
  "warm.pump_c":{kind:"num",min:30,max:80,unit:"°C",lbl:"st_pump",help:"st_pump_w",id:"plPump"},
  "setup.store_kg":{kind:"num",min:1,max:30000,unit:"kg",opt:1,lbl:"st_store",help:"st_store_w",fa:'data-sup="store"'},
  "pellets.reserve_kg":{kind:"num",min:0,max:2000,unit:"kg",lbl:"st_reserve",help:"st_reserve_w"},
  "ash.bin_kg":{kind:"num",min:0,max:200,step:.5,unit:"kg",lbl:"set_bin",help:"st_bin_w",id:"setBin"},
  "auto_reset.enabled":{kind:"sw",lbl:"ar_title",ask:"st_q_reset",id:"arOn"},
  "auto_reset.wait_min":{kind:"num",min:1,max:240,unit:"min",lbl:"ar_wait",id:"arWait"},
  "auto_reset.max_per_day":{kind:"pick",opts:[1,2],lbl:"ar_max"},
  "vvb.enabled":{kind:"sw",lbl:"vv_title",ask:"vv_q",id:"vvOn"},
  "vvb.source":{kind:"sel",opts:["mqtt","http","onewire"],optlbl:"vv_",lbl:"vv_src",id:"vvSrc"},
  "vvb.max_age_min":{kind:"num",min:1,max:120,unit:"min",lbl:"vv_age",id:"vvAge"},
  "vvb.safe_c":{kind:"num",min:40,max:95,unit:"°C",lbl:"vv_safe",id:"vvSafe"}
};
const F_MSG={};                               // field -> {ok, text, raw}: the line under it ("Saved", or what is wrong)
function stopHelp(){                          // "stop at power" explained, with the monitor's own minutes
  const live=(S&&S.warm)||{}, w=((SETS&&SETS.settings)||{}).warm||{};
  return t("st_stop_w",{r:live.min_run_min??20,a:w.stop_after_min??live.stop_after_min??2});
}
function fGet(key){                           // the value in use now
  const [sect,k]=key.split("."), v=((((SETS&&SETS.settings)||{})[sect])||{})[k];
  if(key==="warm.stop_pct"){ const live=(S&&S.warm)||{}; return live.stop_pct??v??40; }      // may come from the boiler's own setting
  if(key==="ash.bin_kg") return v||((OPT&&OPT.ash)||{}).bin_kg||0;
  return v;
}
const fRange=d=>t(d.step?"st_e_dec":"st_e_num",{a:nf(d.min,0),b:nf(d.max,0)});
// a typed number: plain digits with one . or , only (not "0x10", "1e3", "+5"); anything else -> NaN
const numTyped=s=>{ s=String(s==null?"":s).trim().replace(",","."); return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN; };
function fCheck(key,raw){                     // what was typed -> {v: the value to save} or {err: one plain line}
  const d=FIELDS[key]; let s=String(raw==null?"":raw).trim();
  if(d.kind==="text"){ s=s.replace(/^v\s*/i,""); return s===""||d.re.test(s)?{v:s}:{err:t(d.err)}; }
  if(d.off!=null&&(s===""||[t("off"),"off"].includes(s.toLowerCase()))) return {v:d.off};
  if(s==="") return d.opt?{v:null}:{err:fRange(d)};
  const n=numTyped(s);
  return !isFinite(n)||n<d.min||n>d.max||(!d.step&&!Number.isInteger(n))?{err:fRange(d)}:{v:n};
}
function fRow(key,o){                         // one field: label and help left, the value right
  o=o||{}; const d=FIELDS[key], v=o.val!==undefined?o.val:fGet(key), m=o.form?null:F_MSG[key], lbl=o.lbl||t(d.lbl);
  const off=d.off!=null&&(v==null||v===d.off)&&!(m&&!m.ok);      // e.g. minimum boiler temperature 0 = "off", not "0 °C"
  const u=d.unit&&!off?`<span class="f-u">${esc(d.unit.slice(0,2)==="u_"?t(d.unit):d.unit)}</span>`:"";
  const at=(o.form?(d.fa||""):`data-f="${key}"${d.id?` id="${d.id}"`:""}`)+` aria-label="${esc(t(d.lbl))}"`;
  let c;
  if(d.kind==="sw") c=`<label class="sw2${o.big?" big":""}"><input type="checkbox" ${at} ${v?"checked":""}><span></span></label>`;
  else if(d.kind==="pick") c=`<div class="seg2 f-pick" role="group" aria-label="${esc(lbl)}">${d.opts.map(x=>`<button type="button" ${o.form?`${d.fa}="${x}"`:`data-fpick="${key}" data-v="${x}"`} class="${v===x?"on":""}" aria-pressed="${v===x?"true":"false"}">${x}</button>`).join("")}</div>${u}`;
  else if(d.kind==="sel") c=`<select class="inp" ${at}>${d.opts.map(x=>`<option value="${x}" ${v===x?"selected":""}>${esc(t(d.optlbl+x))}</option>`).join("")}</select>`;
  else c=`<input class="inp${m&&!m.ok?" bad":""}" ${at} inputmode="${d.kind==="num"?(d.step?"decimal":"numeric"):d.mode}" maxlength="12" autocomplete="off"${off?` placeholder="${esc(t("off"))}"`:""} value="${esc(m&&!m.ok&&m.raw!=null?m.raw:(v==null||off?"":String(v)))}">${u}`;
  const help=o.help!==undefined?o.help:(d.help?t(d.help):"");
  return `<div class="f-row"><div class="f-t"><b>${esc(lbl)}${o.chip||""}</b>${help?`<span${o.helpId?` id="${o.helpId}"`:""}>${esc(help)}</span>`:""}`+
    `<span class="f-msg${m?(m.ok?" ok":" bad"):""}" data-fmsg="${key}" role="status">${m?esc(m.text):""}</span></div><div class="f-c">${c}</div></div>`;
}
function fMsg(key,m){                         // show (or clear) the line under a field without redrawing the page
  if(m) F_MSG[key]=m; else delete F_MSG[key];
  document.querySelectorAll(`#v-settings [data-fmsg="${key}"]`).forEach(e=>{ e.className="f-msg"+(m?(m.ok?" ok":" bad"):""); e.textContent=m?m.text:""; });
  document.querySelectorAll(`#v-settings input[data-f="${key}"]`).forEach(e=>{ if(e.type!=="checkbox") e.classList.toggle("bad",!!(m&&!m.ok)); });
  if(m&&m.ok) setTimeout(()=>{ if(F_MSG[key]===m) fMsg(key,null); },4000);
}
// The one save rule: a value is saved at once, alone. -> true when the monitor took it.
async function fSave(key,v,raw){
  const [sect,k]=key.split("."), body={[sect]:{[k]:v}};
  if(key==="warm.stop_pct") body.warm.use_board=false;               // typed here: no longer the boiler's own limit
  if(sect==="controller_info") body.controller_info.asked=true;      // typed here: the service picture won't ask
  if(key==="warm.enabled"&&v&&!suPeriods().length){ body.warm.periods=planFromSettings().periods; body.warm.pause_h=0; }   // first time on: the two ready-made periods
  let ok=false, rj=null;
  try{ const r=await api("api/settings",body); ok=r.ok; rj=r.j; if(ok&&r.j&&r.j.settings) SETS=Object.assign({},SETS,{settings:r.j.settings}); }catch(e){}
  if(ok&&key==="warm.enabled"&&PLAN) PLAN.enabled=!!v;
  fMsg(key,ok?{ok:true,text:"✓ "+t("st_saved")}:{ok:false,text:saveFail(rj,t("st_e_save")),raw});
  if(ok&&(sect==="warm"||sect==="auto_reset")) await pollStatus();
  renderSettings();
  if(ok&&(sect==="pellets"||sect==="ash")) loadSlow();
  return ok;
}
document.addEventListener("change",async e=>{
  const el=e.target; if(!el.closest||!el.closest("#v-settings")) return;
  if(el.dataset.ar){                          // an alarm that may be reset automatically: ticked or not
    const l=new Set((((SETS&&SETS.settings)||{}).auto_reset||{}).alarms||[]); el.checked?l.add(+el.dataset.ar):l.delete(+el.dataset.ar);
    fSave("auto_reset.alarms",[...l].sort((a,b)=>a-b)); return; }
  if(el.id==="setAnim") return;
  const key=el.dataset.f, d=FIELDS[key]; if(!d) return;
  if(d.kind==="sw"){ const on=el.checked;     // a switch that lets the page act on the burner asks first
    if(on&&d.ask&&!(await askConfirm(t(d.ask),t("st_turn_on")))){ el.checked=false; return; }
    if(!(await fSave(key,on))) el.checked=!on;
    return; }
  if(d.kind==="sel"){ fSave(key,el.value); return; }
  const r=fCheck(key,el.value);               // number or text: saved when the field is left or Enter is pressed
  if(r.err){ fMsg(key,{ok:false,text:r.err,raw:el.value}); return; }
  el.value=r.v==null||r.v===d.off?"":String(r.v);   // shown as it is saved ("5 " -> "5", "07" -> "7", 0 -> "off")
  const was=fGet(key);
  if(r.v===was||(r.v==null&&was==null)){ fMsg(key,null); return; }
  fSave(key,r.v,el.value);
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-fpick]"); if(!b) return;
  const key=b.dataset.fpick, v=+b.dataset.v; if(fGet(key)!==v) fSave(key,v); });

const stTitle=g=>({plan:t("set_heat_on"),boiler:t("st_g_boiler"),pellets:t("st_g_pellets"),alerts:t("nt_title"),weather:t("wx_title"),ha:"Home Assistant",
  screen:t("set_screen"),reset:t("ar_title"),tank:t("st_g_tank"),service:t("st_g_service"),about:t("st_g_about")}[g]);
const betaChip=()=>` <span class="chip amber">${esc(t("beta"))}</span>`;
const ciMissing=()=>{ const c=ctlInfo(); return (c.sw?0:1)+(c.min_pct==null?1:0)+(c.fan100_rpm==null?1:0); };
async function aboutLoad(){ try{ const {ok,j}=await api("api/about"); if(ok) ABOUT=j; }catch(e){} }
function stState(g){                          // the one line under a group's name: its state at a glance
  const st=(SETS&&SETS.settings)||{}, onoff=v=>t(v?"st_on":"st_off"), p=[];
  if(g==="plan"){ const w=st.warm||{}; return {s:t("st_l_plan",{o:onoff(w.enabled),n:(w.periods||[]).length,p:fGet("warm.stop_pct")})}; }
  if(g==="boiler"){ const kw=fGet("setup.boiler_kw")||suBoardKw(), n=ciMissing();
    if(kw) p.push(kw+" kW"); if(n) p.push(t(n===1?"st_l_missing1":"st_l_missing",{n}));
    return {s:p.join(" · ")||t("st_l_boiler_ok"),dot:n>0}; }
  if(g==="pellets"){ const kg=(st.setup||{}).store_kg, r=(st.pellets||{}).reserve_kg, b=fGet("ash.bin_kg");
    if(kg) p.push(t("st_l_store",{kg:nf(kg,0)})); if(r!=null) p.push(t("st_l_buy",{kg:nf(r,0)})); if(b) p.push(t("st_l_bin",{kg:nf(b,1)}));
    const s=p.join(" · "); return {s:s.charAt(0).toUpperCase()+s.slice(1)}; }
  if(g==="alerts"){ const c=ntCfg(), bad=!!(c.enabled&&NT&&NT.last&&!NT.last.ok); if(!c.enabled) return {s:onoff(false)};
    p.push(onoff(true),t("st_l_kinds",{n:NT_EVENTS.filter(k=>(c.events||{})[k]).length})); if(bad) p.push(t("st_l_nt_bad"));
    return {s:p.join(" · "),dot:bad}; }
  if(g==="weather"){ const w=(S&&S.weather)||{}; return {s:w.enabled?[w.name,wxFresh()?nf(w.c,1)+" °C":""].filter(Boolean).join(" · ")||onoff(true):onoff(false)}; }
  if(g==="ha"){ const m=ABOUT&&ABOUT.mqtt; if(!ABOUT) return {s:t("st_l_ha_info")}; if(!m||!m.on) return {s:t("st_l_ha_off")};
    return {s:t(m.connected?"st_l_ha_on":"st_l_ha_wait")+" · "+t(m.read_only?"st_l_ha_ro":"st_l_ha_btn"),dot:!m.connected}; }
  if(g==="screen") return {s:t("lang_name")+" · "+t("set_theme")+": "+t("theme_"+THEME)};
  if(g==="reset") return {s:onoff((st.auto_reset||{}).enabled)};
  if(g==="tank") return {s:onoff((st.vvb||{}).enabled)};
  if(g==="service") return {s:t("st_l_service")};
  const a=ABOUT||{}; if(a.version) p.push(t("upd_ver",{v:a.version})); p.push(t("st_l_port",{p:pagePort(a)})); if(a.keep_days) p.push(t("st_l_days",{d:nf(a.keep_days,0)}));
  return {s:p.join(" · ")||t("st_l_about"),dot:!!(UPD&&UPD_LOOK.includes(UPD.view.key))};
}
const stShown=g=>g!=="alerts"||!!(NT&&NT.available!==false);     // phone alerts: only where the monitor can send them
function stListHTML(){
  const cur=ST_SUB||"plan";
  const row=g=>{ const x=stState(g);
    return `<a class="st-row${g===cur?" on":""}" href="#settings/${g}"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ST_ICON[g]}</svg></i>`+
      `<span><b>${esc(stTitle(g))}${g==="tank"?betaChip():""}</b><span class="s">${esc(x.s||"")}</span></span><span class="go">${x.dot?`<i class="dot"></i>`:""}›</span></a>`; };
  return `<h2>${esc(t("tab_set"))}</h2><div class="st-cap">${esc(t("st_everyday"))}</div><div class="card">${ST_EVERY.filter(stShown).map(row).join("")}</div>`+
    `<div class="st-cap">${esc(t("st_advanced"))}</div><div class="card">${ST_ADV.map(row).join("")}</div>`;
}

function renderSettings(force){
  const el=document.getElementById("v-settings"); if(!el) return;
  if(SU.open){ el.innerHTML=""; return; }       // the guide draws some of the same fields: only one copy at a time
  if(!SETS){ el.innerHTML=`<div class="card"><div class="empty">…</div></div>`; return; }
  let box=el.querySelector(".st");
  if(!box){ el.innerHTML=`<div class="st"><div class="st-list" id="stList"></div><div class="st-pane" id="stPane"></div></div>`; box=el.firstElementChild; }
  const g=ST_SUB||"plan", pane=box.querySelector("#stPane"), ae=document.activeElement;
  box.classList.toggle("sub",!!ST_SUB);
  box.querySelector("#stList").innerHTML=stListHTML();
  // a field that is being typed in, or an open list of choices, is never wiped by a redraw
  if(!force&&pane.dataset.g===g+LANG&&ae&&pane.contains(ae)&&(ae.tagName==="SELECT"||(ae.tagName==="INPUT"&&ae.type!=="checkbox"))) return;
  pane.dataset.g=g+LANG; pane.innerHTML=stPaneHTML(g);
}
document.addEventListener("toggle",e=>{ const d=e.target; if(d&&d.dataset&&d.dataset.fold) ST_OPEN[d.dataset.fold]=d.open; },true);
document.addEventListener("click",async e=>{
  const l=e.target.closest("[data-setlang]"); if(l){ setLang(l.dataset.setlang); return; }
  const th=e.target.closest("[data-settheme]"); if(th){ setTheme(th.dataset.settheme); renderSettings(); return; }
  const b=e.target.closest("[data-stsv]"); if(!b) return;       // relearn after service: the monitor's own memory, nothing goes to the boiler
  const k=b.dataset.stsv, path={lux:"api/lux/reset",fan:"api/fan/reset",opt:"api/optimiser/reset",ign:"api/ignitions/reset"}[k];
  if(!path||!(await askConfirm(t("st_sv_"+k)+". "+t("st_sv_"+k+"_s"),b.textContent))) return;
  try{ const {ok}=await api(path,{}); toast(ok?t("st_sv_done"):t("save_fail")); if(ok) loadSlow(); }catch(err){ toast(t("save_fail")); }
});

const BATCH_COLORS=["#9B7652","#E0A458","#5F7F8F","#8C6BB1","#4E9A7A","#C0624F","#7A8B3F","#B07AA1"];
// Time to flame = minutes from the start of lighting until the flame is strong enough. The server works it out
// (flame_min on every start record, the typical values in api/ignitions): the page only shows it.
const flameMin=x=>x.flame_min!=null?+x.flame_min:null;
// bar height in the lighting chart: the time to flame; a start that failed or was stopped: how long it lasted
const startBarMin=r=>flameMin(r)!=null?flameMin(r):(r.result!=="ok"&&r.minutes!=null?+r.minutes:0);
function batchList(){ return ((IGN&&IGN.batches)||[]).slice().sort((a,b)=>(a.since||0)-(b.since||0)); }
function batchColor(name){ const i=batchList().findIndex(b=>b.name===name); return i<0?"#A39789":BATCH_COLORS[i%BATCH_COLORS.length]; }
function batchStats(name){
  const s=((IGN&&IGN.stats)||{})[name]||{};       // counted by the server, per pellet batch
  return {n:s.n||0, ok:s.flame_n||0, med:s.flame_min!=null?s.flame_min:null, max:s.flame_max_min!=null?s.flame_max_min:null, failed:s.failed||0};
}
function ignVerdict(){
  const bl=batchList().filter(b=>batchStats(b.name).n>0);
  const cur=(IGN&&IGN.current_batch)||(bl.length?bl[bl.length-1].name:null);
  const ci=bl.findIndex(b=>b.name===cur);
  const cs=cur?batchStats(cur):null;
  if(ci>0){ const ps=batchStats(bl[ci-1].name);
    if(cs.ok>=3 && ps.ok>=3){ const a=cs.med, b=ps.med;
      const kind=a>b*1.15?"slower":(a<b*0.87?"faster":"same");
      return {kind, h:t("ign_"+kind), l:t("ign_cmp",{a:nf(a,1),b:nf(b,1)}), cur}; }
    return {kind:"few", h:t("ign_title"), l:t("ign_few"), cur}; }
  const typ=IGN&&IGN.typical_flame_min, any=((IGN&&IGN.records)||[]).some(x=>x.result==="ok");
  return {kind:"one", h:t("ign_title"), l:typ!=null?t("ign_typ",{a:nf(typ,1)}):(any?t("ign_few"):t("ign_none")), cur};
}

// ash build-up: bars = ash made each day (from that day's pellets), line = ash in the bin since "Just emptied",
// dashed line = the bin size. Before the first "Just emptied" only the bars show.
function chartAsh(el){
  if(!el) return;
  const a=(OPT&&OPT.ash)||{}, pctA=a.ash_pct||((SETS&&SETS.settings&&SETS.settings.ash)||{}).ash_pct||0.7;
  const days=((OPT&&OPT.days)||[]).slice(-21);
  if(!days.length){ el.innerHTML=""; return; }
  const g=days.map(d=>(dayFuel(d)||0)*pctA/100*1000);                    // grams of ash per day
  const ed=a.emptied_at?new Date(a.emptied_at*1000):null, edDay=ed?dayKey(ed):null;
  let cum=null, run=0; if(edDay){ const tday=dayKey();
    cum=days.map((d,i)=>{ if(d.day<edDay) return null;
      if(d.day===edDay){ if(d.day===tday){ run=a.ash_kg||0; return run; }        // emptied today: what the PC counted since then
        const nx=new Date(ed); nx.setHours(24,0,0,0); run+=g[i]/1000*Math.max(0,Math.min(1,(nx-ed)/86400000)); return run; }   // only the part of that day after emptying
      run+=g[i]/1000; return run; }); }
  const cap=a.bin_kg||0, W=elW(el,700), H=170, x0=36, x1=W-(cum?40:8), y0=14, y1=136, n=days.length, gw=(x1-x0)/n, bw=Math.max(4,Math.min(22,gw*.6));
  const gm=Math.max(10,...g), gn=gm<=50?Math.ceil(gm/10)*10:Math.ceil(gm/50)*50, Yg=v=>y1-(y1-y0)*v/gn;
  let s="";
  [0,gn/2,gn].forEach(v=>{ s+=`<line x1="${x0}" x2="${x1}" y1="${Yg(v).toFixed(1)}" y2="${Yg(v).toFixed(1)}" style="stroke:${v?"var(--grid)":"var(--axis)"}"/><text class="ax" x="${x0-6}" y="${(Yg(v)+4).toFixed(1)}" text-anchor="end">${fmt(v,0)}</text>`; });
  g.forEach((v,i)=>{ const x=x0+gw*i+(gw-bw)/2, h=y1-Yg(v);
    s+=`<rect x="${x.toFixed(1)}" y="${Yg(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" style="fill:#9A8C7E"><title>${esc(fmt(v,0)+" g")}</title></rect>`; });
  if(cum){ const cm=Math.max(cap||0,...cum.filter(v=>v!=null),0.1), cn=cm<=1?Math.ceil(cm*10)/10:Math.ceil(cm), Yc=v=>y1-(y1-y0)*v/cn;

    else s+=`<rect x="${x.toFixed(1)}" y="${y(m).toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y0-y(m)).toFixed(1)}" rx="${Math.min(5,bw/2).toFixed(1)}" fill="${batchColor(r.batch)}"><title>${esc(dmon(r.epoch)+" · "+fmt(m,1)+" min · "+(r.batch||""))}</title></rect>`; });

// ---- pellet sheets (in-page) ----
function openSheet(kind){
  const s=OPT&&OPT.stock, perDay=s&&s.per_day;
  const st={mode:kind==="deliver"?"pallet":"bags", n:1, kg:"", name:""};
  if(kind==="count") st.n=s?Math.max(0,Math.round(s.left/15)):10;
  const bg=document.createElement("div"); bg.className="scrim";
  const close=()=>{ bg.remove(); document.removeEventListener("keydown",key); };
  const key=e=>{ if(e.key==="Escape") close(); };
  const kgNow=()=>{ if(st.mode==="pallet") return st.n*960; if(st.mode==="bag"||st.mode==="bags") return st.n*15;
    const v=parseFloat(String(st.kg).replace(",",".")); return v>=0?v:null; };
  function draw(){
    const kg=kgNow();
    const segs=kind==="deliver"
      ? `<div class="segs"><button type="button" data-m="pallet" class="${st.mode==="pallet"?"on":""}"><b>960 kg</b>${esc(t("pallet"))}</button><button type="button" data-m="bag" class="${st.mode==="bag"?"on":""}"><b>15 kg</b>${esc(t("bag"))}</button><button type="button" data-m="other" class="${st.mode==="other"?"on":""}"><b>…</b>${esc(t("other"))}</button></div>`
      : `<div class="segs two"><button type="button" data-m="bags" class="${st.mode==="bags"?"on":""}"><b>15 kg</b>${esc(t("bags15"))}</button><button type="button" data-m="kg" class="${st.mode==="kg"?"on":""}"><b>kg</b>${esc(t("kg_in"))}</button></div>`;
    const unit=st.mode==="pallet"?(st.n===1?t("u_pallet"):t("u_pallets")):(st.n===1?t("u_bag"):t("u_bags"));
    const amount=(st.mode==="other"||st.mode==="kg")
      ? `<input class="inp" id="shKg" inputmode="decimal" placeholder="${esc(t("kg_ph"))}" value="${esc(st.kg)}">`
      : `<div class="stepper"><button type="button" data-d="-1">−</button><div class="sv"><b>${st.n}</b><span>${esc(unit)}</span></div><button type="button" data-d="1">+</button></div>`;
    let total;
    if(kind==="deliver"){ const tot=kg!=null?(s?s.left:0)+kg:null;
      total=`<div class="row"><span>${esc(t("new_total"))}</span><b>${tot!=null?nf(tot,0)+" kg"+(perDay?" · ~"+Math.round(tot/perDay)+" d":""):"—"}</b></div>`; }
    else total=`<div class="row"><span>${esc(t("at_home_now"))}</span><b>${kg!=null?nf(kg,0)+" kg"+(perDay?" · ~"+Math.round(kg/perDay)+" d":""):"—"}</b></div>`;
    const name=kind==="deliver"?`<input class="inp" id="shName" maxlength="40" placeholder="${esc(t("batch_name"))}" value="${esc(st.name)}"><div class="note" style="margin-top:6px">${esc(t("batch_note"))}</div>`:"";
    bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sh"><b>${esc(kind==="deliver"?t("add").replace("+ ",""):t("count_h"))}</b><button type="button" class="link" data-x="1" style="color:var(--ink3)">${esc(t("close"))}</button></div>
      ${segs}${amount}${total}${name}<div class="acts"><button type="button" class="btn emb" data-save="1">${esc(t("save"))}</button></div></div>`;
    const ki=bg.querySelector("#shKg"); if(ki){ ki.oninput=()=>{ st.kg=ki.value; const r=bg.querySelector(".row b"); const k2=kgNow();
      const tot=kind==="deliver"?(k2!=null?(s?s.left:0)+k2:null):k2; r.textContent=tot!=null?nf(tot,0)+" kg"+(perDay?" · ~"+Math.round(tot/perDay)+" d":""):"—"; }; }
    const ni=bg.querySelector("#shName"); if(ni) ni.oninput=()=>{ st.name=ni.value; };
  }
  bg.addEventListener("click",async e=>{
    if(e.target===bg||e.target.closest("[data-x]")) return close();
    const m=e.target.closest("[data-m]"); if(m){ st.mode=m.dataset.m; draw(); const k=bg.querySelector("#shKg"); if(k) k.focus(); return; }
    const d=e.target.closest("[data-d]"); if(d){ st.n=Math.max(kind==="count"?0:1,st.n+(+d.dataset.d)); draw(); return; }
    if(e.target.closest("[data-save]")){
      const kg=kgNow(); if(kg==null||(kind==="deliver"&&kg<=0)){ toast(t("bad_kg")); return; }
      try{
        const nm=(st.name||"").trim();
        const {ok,j}=kind==="deliver"?await api("api/pellets",nm?{kg,name:nm}:{kg}):await api("api/pellets/stock",{kg});
        if(ok){ close(); toast(t("saved")); loadSlow(); } else toast(saveFail(j,t("save_fail")+" "+((j&&j.msg)||"")));
      }catch(err){ toast(t("save_fail")); }
    }
  });
  document.addEventListener("keydown",key);
  draw(); document.body.appendChild(bg);
}

// part (optional) = how much of each bar is drawn light (the short burns of that day), partTip = its hover text
function bars(el, labels, values, color, unit, temps, part, partTip){
  const tv=(temps||[]).filter(v=>v!=null), W=elW(el,500), H=180, x0=34, x1=W-(tv.length?32:6), y0=12, y1=150;
  if(!values.length){ el.innerHTML=`<div class="empty">${esc(t("opt_none"))}</div>`; return; }
  const mx=Math.max(1,...values.map(v=>v||0)), [,nice,st]=niceAxis(0,mx,true), n=values.length, gw=(x1-x0)/n, bw=Math.max(3,Math.min(22,gw*0.62));
  let s="";
  for(let g=0;g<=4;g+=2){ const v=st*g, y=y1-(y1-y0)*v/nice; s+=`<line x1="${x0}" x2="${x1}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${g?"var(--grid)":"var(--axis)"}"/><text class="ax" x="${x0-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v,axisDec(st*2))}${g===4&&unit?" "+esc(unit):""}</text>`; }
  values.forEach((v,i)=>{ const h=(y1-y0)*(v||0)/nice, x=x0+gw*i+(gw-bw)/2;
    s+=`<rect x="${x.toFixed(1)}" y="${(y1-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" style="fill:${color}"><title>${esc(labels[i]+" · "+(part&&part[i]>0?partTip(v,part[i]):fmt(v,1)+" "+unit))}</title></rect>`;

    if(pv>0) s+=`<rect class="bar-part" x="${x.toFixed(1)}" y="${(y1-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h*pv/v).toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" style="fill:var(--card);pointer-events:none" opacity=".6"/>`; });
  const step=Math.ceil(n/Math.max(2,Math.floor((x1-x0)/56)));
  labels.forEach((l,i)=>{ if((n-1-i)%step===0) s+=`<text class="ax" x="${(x0+gw*(i+0.5)).toFixed(1)}" y="170" text-anchor="middle">${esc(l)}</text>`; });
  if(tv.length){ const tlo=Math.floor(Math.min(0,...tv)/5)*5, thi=Math.max(tlo+10,Math.ceil(Math.max(...tv)/5)*5), YT=v=>y1-(y1-y0)*(v-tlo)/(thi-tlo);
    [tlo,thi].forEach(v=>{ s+=`<text class="ax" x="${x1+5}" y="${(YT(v)+4).toFixed(1)}" style="fill:var(--outLine,#4E8FD0)">${v}°</text>`; });
    const pts=temps.map((v,i)=>v==null?null:[x0+gw*(i+0.5),YT(v),v]).filter(Boolean);
    if(pts.length>1) s+=`<polyline fill="none" style="stroke:var(--outLine,#4E8FD0)" stroke-width="1.4" opacity=".6" points="${pts.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}"/>`;
    pts.forEach(q=>{ s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" style="fill:var(--outLine,#4E8FD0);stroke:var(--card)" stroke-width="1.5"><title>${fmt(q[2],1)} °C</title></circle>`; }); }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;max-width:100%">${s}</svg>`+(tv.length?`<div class="note" style="margin-top:4px">${esc(t("ppd_out"))}</div>`:"");
}
