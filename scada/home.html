  else if(k==="hi") body=head("su_hi_h","su_hi_s")+`<div class="lbl h" style="margin-top:22px">${esc(t("su_conn"))}</div>
    <div class="su-conn ${suConnCls()}" id="suConn">${suConnHTML()}</div>`;
  else if(k==="boil"){ const bk=suBoardKw();
    body=head("su_boil_h","su_boil_s")+`<div style="margin-top:14px">${fRow("setup.boiler_kw",{form:1,val:d.kw,help:bk?t("su_size_board",{k:bk}):t("su_size_w"),helpId:"suKwNote"})}
      <div id="suCi">${ctlFields(d.ci||ctlInfo())}</div></div>`; }
  else if(k==="wx") body=head("su_wx_h","su_wx_s")+wxCardHTML(true,true);
  else if(k==="pel") body=head("su_pel_h","su_pel_s")+`<div style="margin-top:14px">${fRow("setup.store_kg",{form:1,val:d.pel.store})}</div>`+
      suField("home","su_home","su_home_w",d.pel.home,"numeric",6,"")+suField("bag","su_bag","su_bag_w",d.pel.bag,"text",40,suBatch());
  else if(k==="ash") body=head("su_ash_h","su_ash_s")+`<div style="margin-top:18px"><button type="button" class="btn ${d.ash?"emb":"sec"}" data-suash="1" aria-pressed="${d.ash?"true":"false"}">${d.ash?"✓ ":""}${esc(t("su_ash_btn"))}</button></div>
      <p class="note" style="margin-top:10px">${esc(t(d.ash?"su_ash_on":"su_ash_w"))}</p>`;
  else if(k==="plan"){ const np=suPeriods().length, on=!!((((SETS&&SETS.settings)||{}).warm)||{}).enabled;
    body=head("su_plan_h","su_plan_s")+`<div class="su-opts">${np?opt("data-suplan","keep",d.plan==="keep",t("su_p_keep"),t("su_p_keep_s",{n:np})):""}
      ${opt("data-suplan","morning",d.plan==="morning",t("su_p_morning"),t("su_p_morning_s"))}${opt("data-suplan","evening",d.plan==="evening",t("su_p_evening"),t("su_p_evening_s"))}
      ${opt("data-suplan","both",d.plan==="both",t("su_p_both"),t("su_p_both_s"))}${np?"":opt("data-suplan","none",d.plan==="none",t("su_p_none"),t("su_p_none_s"))}</div>
      ${!on&&["morning","evening","both"].includes(d.plan)?`<p class="note" style="margin-top:12px">${esc(t("su_plan_off"))}</p>`:""}`; }
  else { const s=SU.sum, row=(l,v)=>`<div><span>${esc(t(l))}</span><b>${esc(v)}</b></div>`;
    body=head("su_done_h","su_done_s")+`<div class="su-sum">${row("su_sum_lang",t("lang_name"))}${row("su_sum_conn",suConnected()?t("su_yes"):t("su_no"))}
      ${row("su_sum_boil",suSumBoil())}${row("su_sum_wx",suSumWx())}${row("su_sum_pel",suSumPel())}
      ${row("su_sum_ash",s.ash?t("su_emptied"):t("su_skipped"))}${row("su_sum_plan",!s.plan?t("su_skipped"):s.plan==="keep"?t("su_kept"):t("su_p_"+s.plan))}</div>`; }
  const B=(a,cls,lbl,dis)=>`<button type="button" class="btn ${cls}" data-su="${a}"${dis?" disabled":""}>${esc(t(lbl))}</button>`;
  el.hidden=false;
  el.innerHTML=`<div class="su-card" data-step="${k}">
    <div class="su-top"><span class="note">${esc(t("su_step",{n,m}))}</span>${last?"":`<button type="button" class="link" data-su="skipall">${esc(t("su_skip_all"))}</button>`}</div>
    <div class="su-dots" aria-hidden="true">${SU_STEPS.map((_,j)=>`<i class="${j<SU.i?"d":j===SU.i?"on":""}"></i>`).join("")}</div>
    ${body}<p class="note" id="suBad" role="alert" style="color:var(--emberText);margin-top:12px;min-height:1em"></p>
    <div class="su-acts">${B("back","sec","su_back",first)}<span class="grow"></span>${last?B("open","emb","su_open"):B("skip","sec","su_skip")+B("next","emb","su_next")}</div></div>`;
}
async function suSave(k){                     // save one step; -> null when done, else the reason to show
  const d=SU.d, el=document.getElementById("setup");
  if(k==="lang"){ SU.sum.lang=LANG; return await suPost("api/settings",{setup:{lang:LANG}}); }
  if(k==="boil"){ const v=ctlRead(el), bad=ctlCheck(v); ctlMark(el,bad); if(bad) return ctlErr(bad);
    const ci=Object.assign({},v); if(v.sw||v.min_pct!=null||v.fan100_rpm!=null) ci.asked=true;   // typed here: the service picture won't ask again
    return await suPost("api/settings",{setup:{boiler_kw:d.kw||null},controller_info:ci}); }
  if(k==="pel"){ const p=d.pel, num=s=>{ s=String(s||"").trim(); return s===""?null:numTyped(s); };
    const rs=fCheck("setup.store_kg",p.store), store=rs.v, home=num(p.home), bag=String(p.bag||"").trim();
    const mark=f=>el.querySelectorAll("[data-sup]").forEach(i=>i.style.borderColor=i.dataset.sup===f?"var(--ember)":"");
    if(rs.err){ mark("store"); return rs.err; }
    if(home!=null&&!(home>=0&&home<=30000)){ mark("home"); return t("su_bad"); }
    mark(null);
    let e=await suPost("api/settings",{setup:{store_kg:store}}); if(e) return e;
    if(home!=null&&d.sent.home!==home){ e=await suPost("api/pellets/stock",{kg:home}); if(e) return e; d.sent.home=home; }
    if(bag&&bag!==suBatch()&&d.sent.bag!==bag){ e=await suPost("api/pellets",{name:bag}); if(e) return e; d.sent.bag=bag; }
    SU.sum.pel={store,home,bag}; return null; }
  if(k==="ash"){ if(!d.ash) return null; if(!d.sent.ash){ const e=await suPost("api/settings",{ash:{emptied:true}}); if(e) return e; d.sent.ash=true; }
    SU.sum.ash=true; return null; }
  if(k==="plan"){ const c=d.plan, all=[0,1,2,3,4,5,6], P=[];
    if(c==="morning"||c==="both") P.push({name:t("p_def_morning"),kind:"warmby",start:"06:00",end:"06:30",days:all,on:true});
    if(c==="evening"||c==="both") P.push({name:t("p_def_evening"),kind:"keep",start:"17:00",end:"21:00",days:all,on:true});
    if(P.length){ const e=await suPost("api/settings",{warm:{periods:P}}); if(e) return e; PLAN=null; PLAN_DIRTY=false; }
    SU.sum.plan=c; return null; }
  return null;                                 // hi, wx (the place is saved when picked), done
}
async function suGo(i){ SU.i=Math.max(0,Math.min(SU_STEPS.length-1,i)); renderSetup(); window.scrollTo(0,0);
  if(SU_STEPS[SU.i]==="done") await suMarkDone(); }
async function suNext(){
  if(SU.busy) return; suCapture(); SU.busy=true;
  const btns=[...document.querySelectorAll("#setup .su-acts .btn")], was=btns.map(b=>b.disabled); btns.forEach(b=>b.disabled=true);
  let err=null; try{ err=await suSave(SU_STEPS[SU.i]); }finally{ SU.busy=false; }
  if(err){ btns.forEach((b,j)=>b.disabled=was[j]); const bad=document.getElementById("suBad"); if(bad) bad.textContent=err; return; }
  suGo(SU.i+1);
}
function suLive(){                            // live yes/no and the board's boiler type while a step shows them
  if(!SU.open) return;
  const c=document.getElementById("suConn"); if(c){ c.className="su-conn "+suConnCls(); c.innerHTML=suConnHTML(); }
  const kn=document.getElementById("suKwNote"); if(kn){ const bk=suBoardKw(); kn.textContent=bk?t("su_size_board",{k:bk}):t("su_size_w");
    if(bk&&SU.d.kw==null){ SU.d.kw=bk; renderSetup(); } }
}
async function suBoot(){                      // first open: ask the monitor whether it was set up
  try{ const {ok,j}=await api("api/settings");
    if(ok&&j&&j.settings){ SETS=Object.assign({},SETS||{},j);
      const c=j.settings.setup; let mine=null; try{ mine=localStorage.getItem("burner_lang"); }catch(e){}
      if(c&&(c.lang==="en"||c.lang==="da")&&mine!=="en"&&mine!=="da"&&c.lang!==LANG){ LANG=c.lang; applyStatic(); renderAll(); }
      if(c&&!c.done&&!SU.open) suOpen(); } }catch(e){}
  document.documentElement.classList.remove("su-wait");
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-su],[data-sulang],[data-sukw],[data-suash],[data-suplan]"); if(!b) return;
  if(b.dataset.su==="again"){ suOpen(); return; }
  if(!SU.open||SU.busy) return;
  if(b.dataset.sulang){ setLang(b.dataset.sulang); renderSetup(); return; }
  if(b.dataset.sukw){ suCapture(); SU.d.kw=+b.dataset.sukw; renderSetup(); return; }
  if(b.dataset.suash){ SU.d.ash=!SU.d.ash; renderSetup(); return; }
  if(b.dataset.suplan){ SU.d.plan=b.dataset.suplan; renderSetup(); return; }
  const a=b.dataset.su;
  if(a==="next") suNext(); else if(a==="skip") suGo(SU.i+1); else if(a==="back") suGo(SU.i-1);
  else if(a==="open"||a==="skipall"){ SU.busy=true; const ok=await suMarkDone(); SU.busy=false; if(!ok) toast(t("save_fail")); suClose(); }
});
document.addEventListener("input",e=>{ if(SU.open&&e.target.closest&&e.target.closest("#setup")){ const b=document.getElementById("suBad"); if(b) b.textContent=""; } });
document.addEventListener("keydown",e=>{ if(!SU.open||e.key!=="Enter"||!e.target.closest) return;
  const i=e.target.closest("#setup input"); if(!i||i.id==="wxQ") return; e.preventDefault(); suNext(); });

// ============================================================ polling
// The monitor's live history (the last ~2 h) is kept here: each poll asks only for the rows after the last one we
// have (status.json?since=...), so a poll is a few kB, not ~300 kB. Polling stops while the page is hidden.
// The seldom-changing parts (transitions, events, ...) come only when they changed: the page sends back the
// versions it has (&tv=) and keeps its own copy of each part the answer leaves out ("hot" = a few changed keys of it).
let LIVEH=[], TV="", SLOW={};
// why a poll got no data: this device offline / no reply at all (network error, timeout) / the monitor answered with an error
const noAnswerKey=e=>navigator.onLine===false?"nodata_net":(e&&e.name&&e.name!=="SyntaxError")?"nodata_noreply":"nodata_resp";
// One poll at a time: tick=true (the timers) skips while one is still waiting (slow Wi-Fi); any other call (after a
// save) waits for it and then asks again, so it gets fresh values. A poll gives up after 20 s.
let pollBusy=null;
function pollStatus(tick){
  if(pollBusy) return tick?pollBusy:pollBusy.then(()=>pollStatus());
  pollBusy=pollOnce().finally(()=>{ pollBusy=null; });
  return pollBusy;
}
async function pollOnce(){
  const ac=window.AbortController?new AbortController():null, to=ac?setTimeout(()=>ac.abort(),20000):0;
  try{
    const last=LIVEH.length?LIVEH[LIVEH.length-1].epoch:0;
    const r=await fetch("status.json"+(last?"?since="+last+(TV?"&tv="+TV:""):""),{cache:"no-store",signal:ac?ac.signal:undefined}); if(!r.ok) throw 0;
    const j=await r.json(); clearTimeout(to);
    ["transitions","events","prealarm","labels","warm","ash_plate","weather","schedule","auto_reset","warnings","remote","vvb","cfg","minmode","cfg_sync","cfg_changes"].forEach(k=>{ if(k in j) SLOW[k]=j[k]; else if(k in SLOW){ if(j.hot&&j.hot[k]) SLOW[k]=Object.assign({},SLOW[k],j.hot[k]); j[k]=SLOW[k]; } });
    TV=j.tv||"";
    const add=Array.isArray(j.history)?j.history:[], end=LIVEH.length?LIVEH[LIVEH.length-1].epoch:0;
    LIVEH=(j.history_since!=null?LIVEH.concat(add.filter(r=>r.epoch>end)):add).slice(-720);   // 720 = the monitor's own list length
    j.history=LIVEH;
    S=j; failed=false; lastGood=Date.now();
    REC=j.latest?flatten(j):null;
    const age=REC&&REC.epoch?Math.max(0,(j.now||Date.now()/1000)-REC.epoch):Infinity;
    if(!REC) NODATA=t("nodata_never");
    else if(j.connected===false||age>45) NODATA=t("nodata_board",{x:fmtAgo(age)});
    else NODATA=null;
  }catch(e){
    clearTimeout(to); failed=true; NODATA=t(noAnswerKey(e));
  }
  renderHeader();
  if(SU.open) suLive();
  if(TAB==="now") renderNow();
  if(TAB==="plan") drawMmCard();
  drawAshSheet();
}
let slowBusy=false;
// tick=true (the 1-minute timer): the answers that change slowly are asked less often (keeps an open page's Wi-Fi
// use low): fan and Discoveries every 10 min, the start list every 10 min or after a state change, settings and
// the optimiser every 5 min unless their tab is open. Any other call (after a save, ...) asks for everything.
let slowAtK={}, slowTr=null;
async function loadSlow(tick){
  if(slowBusy) return; slowBusy=true;
  try{
    const now=Date.now(), due=(k,min)=>{ if(!tick||!slowAtK[k]||now-slowAtK[k]>=min*60000-5000){ slowAtK[k]=now; return true; } return false; };
    const tr=(S&&S.transitions)||[], trKey=tr.length?tr[tr.length-1].epoch:0, trNew=trKey!==slowTr; slowTr=trKey;
    const skip=Promise.resolve({status:"skipped"});
    // the Settings page needs only these: draw it as soon as each answer is in, not after the slow history answers
    const setDraw=()=>{ if(TAB==="settings") renderSettings(); };
    const sp=[due("set",TAB==="settings"||TAB==="plan"?1:5)?api("api/settings").then(r=>{ if(r.ok) SETS=r.j; setDraw(); }).catch(()=>{}):skip];
    if(TAB==="settings") sp.push(ntLoad().then(setDraw),aboutLoad().then(setDraw));
    // the 24 h history: all of it (thinned) at first and every 3 h, in between only the new rows
    const hr=HIST24&&HIST24.rows, full=!hr||!hr.length||Date.now()-h24At>3*3600000;
    const [o,g,h,f,n]=await Promise.allSettled([due("opt",TAB==="history"||TAB==="pellets"?1:5)?api("api/optimiser"):skip,
      (due("ign",10)||trNew)?api("api/ignitions"):skip,
      api("history.json?h=24"+(full?"":"&since="+hr[hr.length-1].epoch)),due("fan",10)?api("api/fan"):skip,due("ins",10)?api("api/insights"):skip]);
    const ok=x=>x.status==="fulfilled"&&x.value.ok?x.value.j:null;
    OPT=ok(o)||OPT; IGN=ok(g)||IGN; FAN=ok(f)||FAN; INS=ok(n)||INS;
    const hj=ok(h);
    if(hj&&hj.since==null){ HIST24=hj; h24At=Date.now(); }
    else if(hj&&HIST24){ const cut=nowEp()-(HIST24.hours||24)*3600;
      HIST24={...HIST24, rows:HIST24.rows.concat(hj.rows||[]).filter(r=>r.epoch>=cut)}; }
    await Promise.all(sp);
  }finally{ slowBusy=false; slowAt=Date.now(); }
  renderTab();
}
let h24At=0, slowAt=0;

// ============================================================ wiring
document.querySelectorAll("#langSel button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.getElementById("themeBtn").onclick=()=>setTheme({auto:"light",light:"dark",dark:"auto"}[THEME]);
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const k=a.dataset.act;
  if(k==="start") runMode("start"); else if(k==="stop"||k==="reset") runMode("stop");
  else if(k==="deliver") openSheet("deliver");
  else if(k==="batch") newBatch();
  else if(k==="ash") openAshSheet();
  else if(k==="share") shareBurner();
  else if(k==="share2") shareTech();
  else if(k==="count"){ if(TAB!=="pellets") location.hash="#pellets"; openSheet("count"); }
});
window.addEventListener("hashchange",()=>showTab(location.hash.slice(1)));
let rzT=0; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(renderTab,150); });
if(window.matchMedia) try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{}); }catch(e){}
// ring sizes follow the viewport
const rs=document.createElement("style");
rs.textContent=":root{--rsize:360px;--rnum:96px;--rsize2:270px;--rnum2:72px}@media (max-width:640px){:root{--rsize:min(290px,76vw);--rnum:min(72px,18vw);--rsize2:min(250px,70vw);--rnum2:min(60px,16vw)}}";
document.head.appendChild(rs);

applyStatic();
showTab(location.hash.slice(1)||"now");
// Software update (only on a Pi with the updater, pi/pelletpi-update.sh): the card is in Settings → About this
// monitor; the line under the notice shows the version, what the updater is doing and the same button.
// The words, the card and the polling are in the shared block (UPD_TXT, updCardHTML, updLoad, updAsk).
const UPD_CLS=["btn emb","btn sec"], UPD_LOOK=["available","later","bad_skipped","rolled_back","build_failed","disk_full","busy","interrupted","error"];
function updDraw(){
  const el=document.getElementById("updLine"), card=document.getElementById("updCard");
  if(card){ card.hidden=!UPD; card.innerHTML=updCardHTML(UPD_CLS); }
  if(!UPD){ const v=(S&&S.version)||(ABOUT&&ABOUT.version);   // no updater here: just the version
    el.textContent=v?t("upd_ver",{v}):""; el.hidden=!v; if(!v&&!S) setTimeout(updDraw,10000); return; }
  const v=UPD.view; let h=esc(updT("ver",v));
  if(v.busy||UPD_LOOK.includes(v.key)||["updated","went_back","offline"].includes(v.key)) h+=" · "+esc(updStateText());
  h+=v.btn&&v.btn!=="retry"?` · <a href="#settings/about" data-upd="${v.btn==="install"?"install":"check"}">${esc(updT("btn_"+v.btn,v))}</a>`:` · <a href="#settings/about">${esc(updT("open"))}</a>`;
  el.innerHTML=h; el.hidden=false;
  if(TAB==="settings"&&!ST_SUB) renderSettings();          // the dot on "About this monitor"
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-upd]"); if(!b) return;
  const what=b.dataset.upd;
  if(what==="back"&&!(await askConfirm(updT("back_confirm",{prev:UPD&&UPD.view.back}),b.textContent))) return;
  if(!(await updAsk(what))) toast(updT("send_fail"));
});
pollStatus(); loadSlow(); suBoot(); updLoad();
// nothing is asked while the page is hidden (a background tab, a phone in the pocket); on return it catches up at once
setInterval(()=>{ if(!document.hidden&&!UPD_BUSY) updLoad(); },30*60000);
// every 10 s = the step of the monitor's history rows: one poll per new row (at 5 s every other poll asked the same since=)
setInterval(()=>{ if(!document.hidden) pollStatus(true); },10000);
setInterval(()=>{ if(!document.hidden) loadSlow(true); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) return;
  pollStatus(true); if(Date.now()-slowAt>60000) loadSlow(true); });
</script>
